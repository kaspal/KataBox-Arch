[package]
name = "ka-app"
description = "KataBox Arch app service: .kbarch files, recent files, settings and typed errors behind the Tauri commands"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ka-core.workspace = true
ka-store.workspace = true
serde.workspace = true
serde_json.workspace = true
specta = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }

[features]
# TypeScript bindings for the desktop app (tauri-specta).
specta = ["dep:specta", "ka-core/specta", "ka-store/specta"]

[lints]
workspace = true
