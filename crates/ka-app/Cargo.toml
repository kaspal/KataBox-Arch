[package]
name = "ka-app"
description = "KataBox Arch app service: .kbarch files, recent files, settings and typed errors behind the Tauri commands"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ka-core.workspace = true
ka-judge.workspace = true
ka-sim.workspace = true
ka-store.workspace = true
serde.workspace = true
serde_json.workspace = true
specta = { workspace = true, optional = true }
thiserror.workspace = true
yaml-rust2.workspace = true
# Pack previews run their checks on a blocking thread; pack databases sit behind a lock.
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
toml.workspace = true

[features]
# TypeScript bindings for the desktop app (tauri-specta).
specta = ["dep:specta", "ka-core/specta", "ka-judge/specta", "ka-sim/specta", "ka-store/specta"]

[lints]
workspace = true
