[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]
# `cargo build` / `cargo test` at the root skip the desktop shell, so the crates build
# and test without WebKitGTK on Linux. Build the shell with `-p katabox-arch-desktop`.
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kaspal/KataBox-Arch"
rust-version = "1.99"

[workspace.dependencies]
ka-app = { path = "crates/ka-app" }
ka-core = { path = "crates/ka-core" }
ka-store = { path = "crates/ka-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["rt"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
