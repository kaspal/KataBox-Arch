id = "cache-aside"
number = 1

title = "Cache-aside"
title_es = "Cache-aside"

one_liner = "Check the cache first; on a miss, read the database and fill the cache."
one_liner_es = "Mira primero en la caché; si falla, lee la base de datos y llena la caché."

problem = "The database spends most of its time answering the same reads again and again, and latency climbs with load."
problem_es = "La base de datos pasa la mayor parte del tiempo respondiendo las mismas lecturas una y otra vez, y la latencia sube con la carga."

use_when = [
  "Reads far outnumber writes",
  "A small set of keys gets most of the reads",
  "Readers can accept data a little out of date",
]
use_when_es = [
  "Las lecturas superan con mucho a las escrituras",
  "Un conjunto pequeño de claves recibe la mayoría de las lecturas",
  "Los lectores aceptan datos algo desfasados",
]

gains = [
  "Hits return far faster than a database read",
  "The database only sees the misses",
  "The cache holds only what is read, so it stays small",
]
gains_es = [
  "Los aciertos responden mucho más rápido que una lectura de la base de datos",
  "La base de datos solo ve los fallos",
  "La caché guarda solo lo que se lee, así que sigue siendo pequeña",
]

costs = [
  "A cached copy can be stale until it expires or is deleted",
  "The first read of every key is slower, and a cold cache hits the database hard",
  "The app owns the caching logic on every read path",
]
costs_es = [
  "Una copia en caché puede quedar obsoleta hasta que caduca o se borra",
  "La primera lectura de cada clave es más lenta, y una caché fría castiga a la base de datos",
  "La app se encarga de la lógica de caché en cada ruta de lectura",
]

kinds = [
  "app",
  "cache",
  "sql",
]
practice = [
  "url-shortener",
  "pastebin",
  "typeahead",
]

in_simulator = "Fully: hits, misses, TTL expiry, memory size, cold starts, flushes and stale reads are simulated, and so is stampede coalescing when the cache has its stampede guard on."
in_simulator_es = "Completamente: se simulan aciertos, fallos, caducidad por TTL, tamaño de memoria, arranques en frío, vaciados y lecturas obsoletas, y también la agrupación de peticiones ante una estampida cuando la caché tiene activada su protección contra estampidas."

[[quiz]]
q = "With cache-aside, what happens on a cache miss?"
q_es = "Con cache-aside, ¿qué pasa en un fallo de caché?"
options = ["The cache fetches the data from the database by itself", "The app reads the database, then stores the answer in the cache", "The request fails until the cache is warmed", "The database pushes the row into the cache"]
options_es = ["La caché trae los datos de la base de datos por su cuenta", "La aplicación lee la base de datos y luego guarda la respuesta en la caché", "La petición falla hasta que la caché se calienta", "La base de datos empuja la fila a la caché"]
answer = 1
why = "In cache-aside the application owns the logic: it checks the cache, reads the database on a miss, and fills the cache with what it read."
why_es = "En cache-aside la lógica es de la aplicación: mira la caché, lee la base de datos si falla y llena la caché con lo que ha leído."

[[quiz]]
q = "A user updates a value in the database, but some readers keep seeing the old one. What is the most likely reason?"
q_es = "Un usuario actualiza un valor en la base de datos, pero algunos lectores siguen viendo el antiguo. ¿Cuál es la causa más probable?"
options = ["The write was lost because cache-aside writes only to the cache", "The database is serving the old row from its own disk", "Cache-aside always rejects reads during a write", "The cached copy stays until its TTL expires or the app deletes the key"]
options_es = ["La escritura se perdió porque cache-aside solo escribe en la caché", "La base de datos sirve la fila antigua desde su propio disco", "Cache-aside siempre rechaza las lecturas durante una escritura", "La copia en caché sigue ahí hasta que caduca su TTL o la app borra la clave"]
answer = 3
why = "Writes go to the database and leave the cached copy alone, so readers can see stale data until it expires, unless the app deletes the key when it writes."
why_es = "Las escrituras van a la base de datos y no tocan la copia en caché, así que los lectores pueden ver datos obsoletos hasta que caducan, salvo que la app borre la clave al escribir."

[[quiz]]
q = "Right after the cache is restarted or flushed, what does the database face?"
q_es = "Justo después de reiniciar o vaciar la caché, ¿qué le toca a la base de datos?"
options = ["The full read load, since every read is a miss until the hot keys are back", "Almost nothing, because the cache reloads itself from a snapshot", "Only write traffic, since reads wait for the cache", "Half the usual load, since misses are batched"]
options_es = ["Toda la carga de lectura, porque cada lectura falla hasta que vuelven las claves calientes", "Casi nada, porque la caché se recarga sola desde una instantánea", "Solo tráfico de escritura, porque las lecturas esperan a la caché", "La mitad de la carga habitual, porque los fallos se agrupan"]
answer = 0
why = "The cache only fills with keys someone asked for, so a cold cache sends every read to the database until the hot keys are cached again."
why_es = "La caché solo se llena con las claves que alguien ha pedido, así que una caché fría manda cada lectura a la base de datos hasta que las claves calientes vuelven a estar en caché."
