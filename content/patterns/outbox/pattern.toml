in_simulator = "Partly: the database write, the stream and its consumers are simulated, but a database never publishes onward in the engine, so the relay from the outbox table is drawn, not run. Crashes between a write and a publish are not modelled."
in_simulator_es = "En parte: se simulan la escritura en la base de datos, el stream y sus consumidores, pero en el motor una base de datos nunca publica hacia delante, así que el reenvío desde la tabla outbox se dibuja pero no se ejecuta. Las caídas entre una escritura y una publicación no se modelan."
