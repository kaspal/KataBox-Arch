options = ["Only after every subscriber has finished its work", "After the slowest subscriber acknowledges the event", "As soon as the event is published to the topic", "After the publisher has called each consumer directly"]
options_es = ["Solo cuando cada suscriptor ha terminado su trabajo", "Cuando el suscriptor más lento confirma el evento", "En cuanto el evento se publica en el topic", "Cuando el publicador ha llamado directamente a cada consumidor"]
