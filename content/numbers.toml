note = "A compressed photo: a few megabytes. A thumbnail of it is a few tens of kilobytes."
note_es = "Una foto comprimida: unos pocos megabytes. Su miniatura ocupa unas decenas de kilobytes."
# a rule of thumb (M7b review); the page for context: https://en.wikipedia.org/wiki/JPEG
source = "rule of thumb"

[[figure]]
id = "video-minute"
group = "sizes"
label = "One minute of 1080p video"
label_es = "Un minuto de vídeo 1080p"
value = 40
unit = "MB"
note = "At about 5 megabits a second, a minute of HD video is around 40 MB. Streams store several bitrates of each."
note_es = "A unos 5 megabits por segundo, un minuto de vídeo HD ronda los 40 MB. Los servicios de streaming guardan varias calidades de cada uno."
source = "arithmetic"

# --- Time -------------------------------------------------------------------------------------

[[figure]]
id = "seconds-per-day"
group = "time"
label = "Seconds in a day"
label_es = "Segundos en un día"
value = 86400
unit = "count"
note = "Round it to 100,000 for quick estimates: a million requests a day is about 12 a second on average."
note_es = "Redondéalo a 100 000 para estimar rápido: un millón de peticiones al día son unas 12 por segundo de media."
source = "arithmetic"

[[figure]]
id = "seconds-per-month"
group = "time"
label = "Seconds in a month"
label_es = "Segundos en un mes"
value = 2629746
unit = "count"
note = "About 2.6 million. One request a second all month is about 2.6 million requests."
note_es = "Unos 2,6 millones. Una petición por segundo durante todo el mes son unos 2,6 millones de peticiones."
source = "arithmetic"

[[figure]]
id = "seconds-per-year"
group = "time"
label = "Seconds in a year"
label_es = "Segundos en un año"
value = 31556952
unit = "count"
note = "About 31.5 million: handy for storage per year at a given write rate."
note_es = "Unos 31,5 millones: útil para calcular el almacenamiento anual a un ritmo de escritura dado."
source = "arithmetic"

[[figure]]
id = "peak-factor"
group = "time"
label = "Peak traffic over the daily average"
label_es = "Tráfico pico sobre la media diaria"
value = 3
unit = "count"
note = "A rule of thumb: the busiest hour runs at two to three times the day's average. Size for the peak, not the average."
note_es = "Una regla práctica: la hora más ocupada va a dos o tres veces la media del día. Dimensiona para el pico, no para la media."
