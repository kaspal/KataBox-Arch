# The numbers cheat sheet (M5.1): rough speeds and sizes for back-of-the-envelope estimates.
# Orders of magnitude, not benchmarks. Sources: a URL; `needed: <URL>` until checked;
# `arithmetic` for a derived constant; `rule of thumb` for a convention with no single source;
# `simulator` for a figure read from the registry's
# calibration (docs/calibration.md), so estimates and the simulator agree.

# --- Memory -----------------------------------------------------------------------------------

[[figure]]
id = "l1-cache"
group = "memory"
label = "L1 cache reference"
label_es = "Acceso a la caché L1"
value = 1
unit = "ns"
note = "The CPU's own cache: about a nanosecond. Everything else is slower than this."
note_es = "La caché propia de la CPU: alrededor de un nanosegundo. Todo lo demás es más lento."
# cited: https://colin-scott.github.io/personal_website/research/interactive_latency.html: 1 ns; Gregg, Systems Performance, 2nd ed. (2020), Table 2.2: 0.9 ns
source = "https://colin-scott.github.io/personal_website/research/interactive_latency.html"

[[figure]]
id = "memory-reference"
group = "memory"
label = "Main memory reference"
label_es = "Acceso a memoria principal"
value = 100
unit = "ns"
note = "Reading RAM is about a hundred times slower than the L1 cache, and still far faster than any disk."
note_es = "Leer la RAM es unas cien veces más lento que la caché L1, y aun así mucho más rápido que cualquier disco."
# cited: https://colin-scott.github.io/personal_website/research/interactive_latency.html: 100 ns; Gregg, Systems Performance, 2nd ed. (2020), Table 2.2: about 100 ns
source = "https://colin-scott.github.io/personal_website/research/interactive_latency.html"

[[figure]]
id = "memory-read-1mb"
group = "memory"
label = "Read 1 MB sequentially from memory"
label_es = "Leer 1 MB seguido de memoria"
value = 10
unit = "us"
note = "Streaming through RAM is fast: a megabyte in about ten microseconds on current machines."
note_es = "Recorrer la RAM es rápido: un megabyte en unos diez microsegundos en máquinas actuales."
source = "needed: https://colin-scott.github.io/personal_website/research/interactive_latency.html"

[[figure]]
id = "redis-get"
group = "memory"
label = "A Redis GET, served from memory"
label_es = "Un GET de Redis, servido desde memoria"
value = 0.01
unit = "ms"
note = "One Redis process answers about 100,000 simple commands a second. The network round trip to it costs more than the command."
note_es = "Un proceso de Redis responde unos 100 000 comandos simples por segundo. El viaje de red hasta él cuesta más que el comando."
source = "https://redis.io/docs/latest/operate/oss_and_stack/management/optimization/benchmarks/"

# --- Storage ----------------------------------------------------------------------------------

[[figure]]
id = "ssd-random-read"
group = "storage"
label = "SSD random read"
label_es = "Lectura aleatoria en SSD"
value = 50
unit = "us"
note = "A 4 KB read from an NVMe SSD: about a twentieth of a millisecond, some 500 times slower than RAM."
note_es = "Una lectura de 4 KB en un SSD NVMe: una veinteava parte de milisegundo, unas 500 veces más lenta que la RAM."
# cited: Samsung 990 PRO datasheet: QD1 random read 22K IOPS, about 45 us per read; Gregg, Systems Performance, 2nd ed. (2020), Table 2.2: SSD I/O 50-150 us
source = "https://download.semiconductor.samsung.com/resources/data-sheet/Samsung_NVMe_SSD_990_PRO_Datasheet_Rev.1.0_10129514072296.pdf"

[[figure]]
id = "ssd-read-1mb"
group = "storage"
label = "Read 1 MB sequentially from SSD"
label_es = "Leer 1 MB seguido de un SSD"
value = 0.3
unit = "ms"
note = "Sequential reads from an NVMe SSD run at several gigabytes a second: a megabyte in about a third of a millisecond."
note_es = "Las lecturas seguidas de un SSD NVMe van a varios gigabytes por segundo: un megabyte en un tercio de milisegundo."
# cited: Samsung 990 PRO brochure: PCIe 3.0 SSDs about 3,500 MB/s, PCIe 4.0 up to 7,450 MB/s; 1 MB at 3.5 GB/s is about 0.29 ms
source = "https://download.semiconductor.samsung.com/resources/brochure/990_PRO_Series_Brouchure_Web_Version_1.0.pdf"

[[figure]]
id = "disk-seek"
group = "storage"
label = "Hard disk seek"
label_es = "Búsqueda en disco duro"
value = 10
unit = "ms"
note = "A spinning disk has to move its head: about ten milliseconds per random read. Avoid random reads on it."
note_es = "Un disco giratorio tiene que mover el cabezal: unos diez milisegundos por lectura aleatoria. Evita leer al azar en él."
# cited: Gregg, Systems Performance, 2nd ed. (2020), Table 2.2: rotational disk I/O 1-10 ms; https://colin-scott.github.io/personal_website/research/interactive_latency.html: 10 ms (its year-2000 base figure)
source = "https://colin-scott.github.io/personal_website/research/interactive_latency.html"

[[figure]]
id = "sql-query"
group = "storage"
label = "A small indexed SQL query"
label_es = "Una consulta SQL pequeña con índice"
value = 5
unit = "ms"
note = "The simulator's median for a PostgreSQL or MySQL read or write by key, including the database's own work."
note_es = "La mediana del simulador para una lectura o escritura por clave en PostgreSQL o MySQL, con el trabajo de la base de datos incluido."
source = "simulator"

[[figure]]
id = "object-get"
group = "storage"
label = "An object storage GET"
label_es = "Un GET a almacenamiento de objetos"
value = 50
unit = "ms"
note = "S3 and similar stores answer in tens of milliseconds: fine for blobs, too slow for every request's hot path."
note_es = "S3 y almacenes parecidos responden en decenas de milisegundos: bien para blobs, demasiado lento para la ruta caliente de cada petición."
source = "simulator"

# --- Network ----------------------------------------------------------------------------------

[[figure]]
id = "rtt-same-az"
group = "network"
label = "Round trip within one availability zone"
label_es = "Ida y vuelta dentro de una zona de disponibilidad"
value = 0.5
unit = "ms"
note = "Two servers in the same data center talk in well under a millisecond."
note_es = "Dos servidores del mismo centro de datos se hablan en mucho menos de un milisegundo."
# cited: https://colin-scott.github.io/personal_website/research/interactive_latency.html: round trip within the same datacenter, 500 us
source = "https://colin-scott.github.io/personal_website/research/interactive_latency.html"

[[figure]]
id = "rtt-cross-az"
group = "network"
label = "Round trip between availability zones"
label_es = "Ida y vuelta entre zonas de disponibilidad"
value = 1.5
unit = "ms"
note = "Zones in one region are a few kilometres apart: about a millisecond or two. The simulator adds the same between zones."
note_es = "Las zonas de una región están a pocos kilómetros: uno o dos milisegundos. El simulador suma lo mismo entre zonas."
# cited: AWS: Availability Zones are up to about 100 km apart, with single-digit millisecond latency between them
source = "https://docs.aws.amazon.com/whitepapers/latest/aws-fault-isolation-boundaries/availability-zones.html"

[[figure]]
id = "rtt-cross-region"
group = "network"
label = "Round trip between regions on one continent"
label_es = "Ida y vuelta entre regiones de un continente"
value = 70
unit = "ms"
note = "Across a continent and back: about 60-70 ms. Cross-region calls belong off the request path."
note_es = "Cruzar un continente y volver: unos 60-70 ms. Las llamadas entre regiones no deben estar en el camino de la petición."
# cited: cloudping P50 on 2026-11-22: us-east-1 to us-west-2 about 61 ms
source = "https://www.cloudping.co/"

[[figure]]
id = "rtt-intercontinental"
group = "network"
label = "Round trip across an ocean"
label_es = "Ida y vuelta a través de un océano"
value = 120
unit = "ms"
note = "Across an ocean and back: about 100-150 ms. No user should wait on several of these."
note_es = "Cruzar un océano y volver: unos 100-150 ms. Ningún usuario debería esperar varias de estas."
# cited: cloudping P50 on 2026-11-22: us-west-2 to ap-northeast-1 about 107 ms, eu-west-1 to us-west-2 about 118 ms; https://colin-scott.github.io/personal_website/research/interactive_latency.html: CA to the Netherlands 150 ms
source = "https://www.cloudping.co/"

[[figure]]
id = "nic-bandwidth"
group = "network"
label = "A server's network link"
label_es = "El enlace de red de un servidor"
value = 10
unit = "Gbps"
note = "A common server's network link: up to 10 Gbps, and one connection gets at most about half of it."
note_es = "El enlace de red de un servidor corriente: hasta 10 Gbps, y una sola conexión obtiene como mucho la mitad."
# cited: AWS: m5.large has up to 10 Gbps; https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-network-bandwidth.html: one flow is capped at 5 Gbps outside a placement group
source = "https://aws.amazon.com/blogs/aws/m5-the-next-generation-of-general-purpose-ec2-instances"

[[figure]]
id = "send-1mb-1gbps"
group = "network"
label = "Send 1 MB over a 1 Gbps link"
label_es = "Enviar 1 MB por un enlace de 1 Gbps"
value = 8
unit = "ms"
note = "Eight megabits at a gigabit a second: 8 ms of pure transfer, before any round trips."
note_es = "Ocho megabits a un gigabit por segundo: 8 ms de transferencia pura, antes de cualquier ida y vuelta."
source = "arithmetic"

# --- Servers ----------------------------------------------------------------------------------

[[figure]]
id = "app-go-rps"
group = "servers"
label = "One Go app server instance"
label_es = "Una instancia de servidor de aplicaciones en Go"
value = 12800
unit = "rps"
note = "In the simulator: 64 requests in parallel at about 5 ms each. Real services vary widely with the work per request."
note_es = "En el simulador: 64 peticiones en paralelo a unos 5 ms cada una. Los servicios reales varían mucho según el trabajo por petición."
source = "simulator"

[[figure]]
id = "app-node-rps"
group = "servers"
label = "One Node.js or Spring Boot instance"
label_es = "Una instancia de Node.js o Spring Boot"
value = 6400
unit = "rps"
note = "In the simulator: 64 in parallel at about 10 ms each."
note_es = "En el simulador: 64 en paralelo a unos 10 ms cada una."
source = "simulator"

[[figure]]
id = "app-django-rps"
group = "servers"
label = "One Django instance"
label_es = "Una instancia de Django"
value = 450
unit = "rps"
note = "In the simulator: 9 worker processes at about 20 ms each. Fewer, slower workers per instance than the others."
note_es = "En el simulador: 9 procesos worker a unos 20 ms cada uno. Menos workers, y más lentos, por instancia que los demás."
source = "simulator"

[[figure]]
id = "postgres-connections"
group = "servers"
label = "PostgreSQL default connections"
label_es = "Conexiones por defecto de PostgreSQL"
value = 100
unit = "count"
note = "max_connections defaults to 100. At about 5 ms a query that is roughly 20,000 simple queries a second per server."
note_es = "max_connections vale 100 por defecto. A unos 5 ms por consulta son unas 20 000 consultas simples por segundo por servidor."
source = "https://www.postgresql.org/docs/current/runtime-config-connection.html"

[[figure]]
id = "dynamodb-partition"
group = "servers"
label = "DynamoDB reads per partition"
label_es = "Lecturas de DynamoDB por partición"
value = 3000
unit = "rps"
note = "A partition serves up to 3,000 reads or 1,000 writes a second. A hot key is limited to one partition."
note_es = "Una partición sirve hasta 3000 lecturas o 1000 escrituras por segundo. Una clave caliente se limita a una partición."
source = "https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-design.html"

[[figure]]
id = "s3-prefix"
group = "servers"
label = "S3 GETs per prefix"
label_es = "GET de S3 por prefijo"
value = 11000
unit = "rps"
note = "At least 11,000 GET or 3,500 PUT requests a second per prefix, and S3 adds prefixes as load grows."
note_es = "Al menos 11 000 GET o 3500 PUT por segundo por prefijo, y S3 añade prefijos a medida que crece la carga."
source = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/optimizing-performance.html"

[[figure]]
id = "lambda-concurrency"
group = "servers"
label = "Lambda concurrent executions per account"
label_es = "Ejecuciones simultáneas de Lambda por cuenta"
value = 1000
unit = "count"
note = "The default limit per region. At 20 ms a call, about 50,000 calls a second; beyond the limit calls are throttled."
note_es = "El límite por defecto por región. A 20 ms por llamada, unas 50 000 llamadas por segundo; por encima del límite se limitan."
source = "https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html"

[[figure]]
id = "kafka-partition"
group = "servers"
label = "Throughput of one Kafka partition"
label_es = "Rendimiento de una partición de Kafka"
value = 10
unit = "MB/s"
note = "A planning figure: a partition handles roughly ten megabytes a second. Partitions also cap how many consumers work in parallel."
note_es = "Una cifra de planificación: una partición maneja unos diez megabytes por segundo. Las particiones también limitan cuántos consumidores trabajan en paralelo."
# cited: Confluent: producers reach 10s of MB/sec on one partition; consumer throughput depends on the application
source = "https://www.confluent.io/blog/how-choose-number-topics-partitions-kafka-cluster/"

