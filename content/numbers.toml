[[figure]]
id = "url"
group = "sizes"
label = "A typical URL"
label_es = "Una URL típica"
value = 100
unit = "B"
note = "Most links fit in about a hundred bytes; a short link's record with its metadata is a few hundred."
note_es = "La mayoría de los enlaces caben en unos cien bytes; el registro de un enlace corto con sus metadatos ocupa unos cientos."
source = "needed: https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Web_mechanics/What_is_a_URL"

[[figure]]
id = "photo"
group = "sizes"
label = "A phone photo"
label_es = "Una foto de móvil"
value = 3
unit = "MB"
note = "A compressed photo: a few megabytes. A thumbnail of it is a few tens of kilobytes."
note_es = "Una foto comprimida: unos pocos megabytes. Su miniatura ocupa unas decenas de kilobytes."
source = "needed: https://en.wikipedia.org/wiki/JPEG"

[[figure]]
id = "video-minute"
group = "sizes"
label = "One minute of 1080p video"
label_es = "Un minuto de vídeo 1080p"
value = 40
