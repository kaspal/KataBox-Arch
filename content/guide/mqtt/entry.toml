kind = "mqtt"
one_liner = "A broker that keeps millions of devices connected and passes small messages between them by topic."
one_liner_es = "Un broker que mantiene conectados millones de dispositivos y les pasa mensajes pequeños por tema."

use_when = [
  "Many devices stay connected and send small readings often",
  "Devices sit on slow or flaky networks and must reconnect cheaply",
  "The server needs to push commands to devices, not only receive data",
]
use_when_es = [
  "Muchos dispositivos siguen conectados y envían lecturas pequeñas a menudo",
  "Los dispositivos están en redes lentas o inestables y deben reconectarse con poco coste",
  "El servidor necesita enviar órdenes a los dispositivos, no solo recibir datos",
]
skip_when = [
  "Clients are browsers: a WebSocket gateway fits better",
  "Clients send a request now and then and don't need a live connection",
  "Backend services talk to each other: a queue or stream is the usual tool",
]
skip_when_es = [
  "Los clientes son navegadores: encaja mejor un gateway WebSocket",
  "Los clientes envían una petición de vez en cuando y no necesitan una conexión viva",
  "Son servicios de backend hablando entre sí: lo habitual es una cola o un stream",
]

formula = "connections ≤ instances × max connections (and the memory each connection holds); a dead instance's devices reconnect elsewhere; deliveries per instance ≤ msgs per s, the excess waits in a backlog; QoS at least once retries until acknowledged, QoS at most once may lose a message"
formula_es = "conexiones ≤ instancias × conexiones máximas (y la memoria que ocupa cada conexión); los dispositivos de una instancia caída se reconectan en otra; entregas por instancia ≤ mensajes por s, el exceso espera en una cola pendiente; QoS al menos una vez reintenta hasta la confirmación, QoS como máximo una vez puede perder un mensaje"

gains = [
  "One cheap, long-lived connection per device in both directions",
  "Publishers and subscribers only share a topic name, not addresses",
  "Each message can choose speed or delivery guarantee with its QoS",
]
gains_es = [
  "Una conexión barata y duradera por dispositivo en ambos sentidos",
  "Quienes publican y quienes se suscriben solo comparten el nombre de un tema, no direcciones",
  "Cada mensaje puede elegir velocidad o garantía de entrega con su QoS",
]
costs = [
  "Connections are a capacity of their own, separate from messages per second",
  "When an instance dies, all its devices reconnect at once unless clients add jitter",
  "At-least-once delivery means duplicates, so subscribers must be idempotent",
]
costs_es = [
  "Las conexiones son una capacidad propia, distinta de los mensajes por segundo",
  "Cuando cae una instancia, todos sus dispositivos se reconectan a la vez salvo que los clientes añadan variación aleatoria",
  "La entrega al menos una vez supone duplicados, así que los suscriptores deben ser idempotentes",
]

works_with = ["client", "lb", "streamproc", "tsdb", "stream", "worker"]
practice = []

interview_tip = "Size connections and messages per second separately, and say what happens when one broker node dies and all its devices reconnect."
interview_tip_es = "Dimensiona por separado las conexiones y los mensajes por segundo, y di qué pasa cuando cae un nodo del broker y todos sus dispositivos se reconectan."

not_simulated = [
  "Retained messages that a new subscriber gets on connect",
  "Session persistence across broker restarts",
  "The cost of topic wildcards in subscriptions",
  "Payload sizes and network bandwidth",
]
not_simulated_es = [
  "Los mensajes retenidos que recibe un suscriptor nuevo al conectarse",
  "La persistencia de sesiones tras reiniciar el broker",
  "El coste de los comodines de tema en las suscripciones",
  "El tamaño de los mensajes y el ancho de banda de red",
]

[[sim]]
prop = "instances"
note = "Broker nodes. Devices are spread over them, and a dead node's devices reconnect to the others."
note_es = "Nodos del broker. Los dispositivos se reparten entre ellos, y los de un nodo caído se reconectan a los demás."

[[sim]]
prop = "max_connections"
note = "Devices one node keeps connected. Connections beyond it are refused and the device retries later."
note_es = "Dispositivos que un nodo mantiene conectados. Las conexiones por encima se rechazan y el dispositivo reintenta más tarde."

[[sim]]
prop = "conn_memory_kb"
note = "Memory each open connection holds on the broker. Many idle devices still cost memory."
note_es = "Memoria que ocupa en el broker cada conexión abierta. Muchos dispositivos inactivos siguen costando memoria."

[[sim]]
prop = "msgs_per_s"
note = "Messages one node delivers per second. Beyond it, deliveries wait in a backlog and arrive late."
note_es = "Mensajes que entrega un nodo por segundo. Por encima, las entregas esperan en una cola pendiente y llegan tarde."

[[sim]]
prop = "qos"
note = "At most once sends and forgets, so a message can be lost. At least once retries until the receiver acknowledges, so it can arrive twice."
note_es = "Como máximo una vez envía y olvida, así que un mensaje puede perderse. Al menos una vez reintenta hasta que el receptor confirma, así que puede llegar dos veces."

[[sim]]
prop = "service_ms"
note = "Time the broker takes to route one publish to its subscribers."
note_es = "Lo que tarda el broker en enrutar una publicación a sus suscriptores."

[[sim]]
sim = "servers_per_instance"
note = "Publishes one node routes at the same time. More wait in its queue."
note_es = "Publicaciones que un nodo enruta a la vez. Las demás esperan en su cola."

[[sim]]
cost = "per_instance_month"
note = "A fixed monthly price per node for a self-hosted broker such as EMQX, Mosquitto or HiveMQ. AWS IoT Core has no node fee."
note_es = "Un precio mensual fijo por nodo para un broker propio como EMQX, Mosquitto o HiveMQ. AWS IoT Core no cobra por nodo."

[[sim]]
cost = "messages_m"
note = "AWS IoT Core bills per million messages. Retries under at least once count as messages too."
note_es = "AWS IoT Core cobra por millón de mensajes. Los reintentos con al menos una vez también cuentan como mensajes."

[[sim]]
cost = "conn_minutes_m"
note = "AWS IoT Core also bills per million connection-minutes, so idle devices that stay connected cost money."
note_es = "AWS IoT Core también cobra por millón de minutos de conexión, así que los dispositivos inactivos que siguen conectados cuestan dinero."

