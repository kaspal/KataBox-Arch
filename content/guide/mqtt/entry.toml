[[quiz]]
q = "Two million sensors each send one small reading per minute. What limits the broker first?"
q_es = "Dos millones de sensores envían cada uno una lectura pequeña por minuto. ¿Qué limita antes al broker?"
options = ["Messages per second", "The number of open connections and the memory they hold", "The time to route one publish", "The QoS level"]
options_es = ["Los mensajes por segundo", "El número de conexiones abiertas y la memoria que ocupan", "El tiempo de enrutar una publicación", "El nivel de QoS"]
answer = 1
why = "About thirty thousand messages a second is modest, but two million devices stay connected all the time. Connections are a capacity of their own."
why_es = "Unos treinta mil mensajes por segundo es poco, pero dos millones de dispositivos siguen conectados todo el tiempo. Las conexiones son una capacidad propia."

[[quiz]]
q = "A broker node holding half a million devices crashes, and the clients reconnect at once with no delay. What should the design expect?"
q_es = "Cae un nodo del broker con medio millón de dispositivos, y los clientes se reconectan a la vez sin retraso. ¿Qué debe esperar el diseño?"
options = ["The devices move to the other nodes within a second with no errors", "The devices stay offline until the node comes back", "Only devices using QoS at least once reconnect", "A reconnect storm: most attempts are refused and retried until the load spreads out"]
options_es = ["Los dispositivos pasan a los otros nodos en un segundo sin errores", "Los dispositivos siguen desconectados hasta que vuelve el nodo", "Solo se reconectan los dispositivos con QoS al menos una vez", "Una tormenta de reconexiones: la mayoría de los intentos se rechazan y se reintentan hasta que la carga se reparte"]
answer = 3
why = "All the reconnects land together and exceed what the remaining nodes can accept. A random delay on the client spreads them out."
why_es = "Todas las reconexiones llegan juntas y superan lo que pueden aceptar los nodos restantes. Un retraso aleatorio en el cliente las reparte."

[[quiz]]
q = "An unlock command to a smart lock must not be lost. Which QoS, and what else does the device need?"
q_es = "Una orden de abrir a una cerradura inteligente no debe perderse. ¿Qué QoS, y qué más necesita el dispositivo?"
options = ["At least once, and the device must handle the same command twice safely", "At most once, because it is faster", "At most once, plus a retained message"]
options_es = ["Al menos una vez, y el dispositivo debe tratar sin riesgo la misma orden dos veces", "Como máximo una vez, porque es más rápido", "Como máximo una vez, más un mensaje retenido"]
answer = 0
why = "At least once retries until acknowledged, so the command arrives, possibly twice. An id per command lets the device ignore the repeat."
why_es = "Al menos una vez reintenta hasta la confirmación, así que la orden llega, quizá dos veces. Un id por orden permite al dispositivo ignorar la repetición."
