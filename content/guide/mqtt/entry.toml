[[pitfalls]]
title = "Reconnect storm"
title_es = "Tormenta de reconexiones"
body = "A broker node dies. Every device it held reconnects at the same moment, the other nodes refuse most of them, and the retries keep the load high for minutes."
body_es = "Cae un nodo del broker. Todos los dispositivos que tenía se reconectan en el mismo instante, los demás nodos rechazan la mayoría y los reintentos mantienen la carga alta durante minutos."
fix = "Give clients a random reconnect delay with backoff, and keep spare connection room on the other nodes."
fix_es = "Da a los clientes un retraso aleatorio de reconexión con espera creciente, y deja margen de conexiones libre en los demás nodos."

[[pitfalls]]
title = "Sizing by messages only"
title_es = "Dimensionar solo por mensajes"
body = "The broker handles the message rate easily, but a million devices send one reading a minute. The nodes run out of connections long before they run out of throughput."
body_es = "El broker soporta de sobra el ritmo de mensajes, pero un millón de dispositivos envía una lectura por minuto. Los nodos se quedan sin conexiones mucho antes de quedarse sin rendimiento."
fix = "Size nodes for the connection count and its memory first, then check the message rate."
fix_es = "Dimensiona los nodos primero por el número de conexiones y su memoria, y luego comprueba el ritmo de mensajes."

[[pitfalls]]
title = "Lost commands at QoS zero"
title_es = "Órdenes perdidas con QoS cero"
body = "Commands to devices are sent at most once. A device on a bad network misses one and never learns about it."
body_es = "Las órdenes a los dispositivos se envían como máximo una vez. Un dispositivo con mala red pierde una y nunca se entera."
fix = "Send messages that matter at least once, and make the device handle a repeated command safely."
fix_es = "Envía al menos una vez los mensajes importantes, y haz que el dispositivo trate sin riesgo una orden repetida."

