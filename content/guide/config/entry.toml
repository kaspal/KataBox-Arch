[[pitfalls]]
title = "A push to everyone at once"
title_es = "Un cambio para todos a la vez"
body = "A typo in a config value is pushed without stages. Every server picks it up within a second and the whole fleet fails together."
body_es = "Una errata en un valor de configuración se envía sin etapas. Todos los servidores la recogen en un segundo y toda la flota falla a la vez."
fix = "Turn on staged rollout with a bake time long enough for errors to show, so a bad change stops at the first stage."
fix_es = "Activa el despliegue por etapas con un tiempo de observación lo bastante largo para que se vean los errores, así un cambio malo se detiene en la primera etapa."

[[pitfalls]]
title = "Halted but not undone"
title_es = "Detenido pero no deshecho"
body = "The rollout halts at the second stage, but the servers already changed keep the bad value while someone writes a fix."
body_es = "El despliegue se detiene en la segunda etapa, pero los servidores ya cambiados se quedan con el valor malo mientras alguien escribe un arreglo."
fix = "Turn on the kill switch so a halted change rolls back on its own."
fix_es = "Activa el interruptor de emergencia para que un cambio detenido se revierta solo."

[[pitfalls]]
title = "Config service on the request path"
title_es = "Servicio de configuración en el camino de la petición"
body = "Each request asks the config service for its flags. When the service is down, every request fails or waits."
body_es = "Cada petición pregunta sus flags al servicio de configuración. Cuando el servicio cae, todas las peticiones fallan o esperan."
fix = "Keep a local copy in each app and read flags from it; the service only updates the copy."
fix_es = "Guarda una copia local en cada aplicación y lee los flags de ella; el servicio solo actualiza la copia."

