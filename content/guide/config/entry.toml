[[quiz]]
q = "A config change with a bad value is pushed by stream with no stages. What does the design risk?"
q_es = "Se envía en stream y sin etapas un cambio de configuración con un valor malo. ¿Qué arriesga el diseño?"
options = ["Only new servers pick it up", "Every app gets it within a second and the whole fleet fails together", "The config service refuses the bad value", "Apps keep the old value until their next restart"]
options_es = ["Solo lo recogen los servidores nuevos", "Todas las aplicaciones lo reciben en un segundo y toda la flota falla a la vez", "El servicio de configuración rechaza el valor malo", "Las aplicaciones mantienen el valor antiguo hasta su próximo reinicio"]
answer = 1
why = "Streaming makes every change fast, the bad ones too. Stages with a bake time limit a bad change to a small share of servers."
why_es = "El stream hace rápido cada cambio, también los malos. Las etapas con tiempo de observación limitan un cambio malo a una pequeña parte de los servidores."

[[quiz]]
q = "A staged rollout halts at stage two because errors rise. With no kill switch, what happens to the servers in stages one and two?"
q_es = "Un despliegue por etapas se detiene en la etapa dos porque suben los errores. Sin interruptor de emergencia, ¿qué pasa con los servidores de las etapas uno y dos?"
options = ["They roll back on their own", "They move on to stage three anyway", "They keep the bad value until someone pushes a fix", "They stop serving traffic"]
options_es = ["Se revierten solos", "Pasan igualmente a la etapa tres", "Se quedan con el valor malo hasta que alguien envía un arreglo", "Dejan de servir tráfico"]
answer = 2
why = "Halting stops the spread, not the damage already done. The kill switch is what rolls the changed servers back within a second."
why_es = "Detener frena la propagación, no el daño ya hecho. El interruptor de emergencia es lo que revierte los servidores cambiados en menos de un segundo."

[[quiz]]
q = "The config service is down for ten minutes. Apps keep a local copy of their flags. What happens to user requests?"
q_es = "El servicio de configuración cae diez minutos. Las aplicaciones guardan una copia local de sus flags. ¿Qué pasa con las peticiones de los usuarios?"
options = ["They keep working with the last flags; only new changes wait", "They all fail until the service is back", "They fall back to every flag turned off"]
options_es = ["Siguen funcionando con los últimos flags; solo esperan los cambios nuevos", "Fallan todas hasta que vuelve el servicio", "Pasan a tener todos los flags desactivados"]
answer = 0
why = "The config service is not on the request path. Apps read their local copy, so an outage only delays new changes."
why_es = "El servicio de configuración no está en el camino de la petición. Las aplicaciones leen su copia local, así que una caída solo retrasa los cambios nuevos."
