kind = "config"
one_liner = "The service that pushes settings and feature flags to your apps, and decides how fast a change spreads."
one_liner_es = "El servicio que envía ajustes y feature flags a tus aplicaciones, y decide lo rápido que se extiende un cambio."

use_when = [
  "You want to turn features on or off without a deploy",
  "A bad setting must be rolled back in seconds, not after a new build",
  "Changes should reach a few servers first and the rest only if all is well",
]
use_when_es = [
  "Quieres activar o desactivar funciones sin desplegar",
  "Un ajuste malo debe revertirse en segundos, no tras una compilación nueva",
  "Los cambios deben llegar primero a unos pocos servidores y al resto solo si todo va bien",
]
skip_when = [
  "The setting never changes at runtime: a file shipped with the build is enough",
  "Per-user data that changes on every request belongs in a database, not in config",
  "A secret such as a password belongs in a secrets manager",
]
skip_when_es = [
  "El ajuste nunca cambia en ejecución: basta un fichero que viaja con la compilación",
  "Los datos por usuario que cambian en cada petición van en una base de datos, no en la configuración",
  "Un secreto como una contraseña va en un gestor de secretos",
]

formula = "unstaged: a push reaches every app at once (stream) or within a poll interval (poll); staged: one stage at a time, each waiting the bake time, halting if errors rise; with a kill switch, a halted change rolls back within a second; apps keep a local copy, so an outage of the service doesn't stop requests"
formula_es = "sin etapas: un cambio llega a todas las aplicaciones a la vez (stream) o dentro de un intervalo de sondeo (poll); por etapas: una etapa cada vez, cada una esperando el tiempo de observación, deteniéndose si suben los errores; con interruptor de emergencia, un cambio detenido se revierte en menos de un segundo; las aplicaciones guardan una copia local, así que una caída del servicio no detiene las peticiones"

gains = [
  "Behaviour changes without a deploy",
  "A staged rollout limits a bad change to a small share of servers",
  "A kill switch undoes a bad change in seconds",
]
gains_es = [
  "El comportamiento cambia sin desplegar",
  "Un despliegue por etapas limita un cambio malo a una pequeña parte de los servidores",
  "Un interruptor de emergencia deshace un cambio malo en segundos",
]
costs = [
  "A config push is a deploy in disguise, and without stages it hits every server at once",
  "Stages and bake time make every change slower to reach everyone",
  "Flags pile up and leave dead code paths if nobody removes them",
]
costs_es = [
  "Un cambio de configuración es un despliegue disfrazado, y sin etapas llega a todos los servidores a la vez",
  "Las etapas y el tiempo de observación hacen que cada cambio tarde más en llegar a todos",
  "Los flags se acumulan y dejan caminos de código muertos si nadie los quita",
]

works_with = ["app", "micro", "gateway", "metrics", "serverless"]
practice = []

interview_tip = "Treat a config change like a deploy: say how it is staged, what error signal halts it, and how fast it rolls back."
interview_tip_es = "Trata un cambio de configuración como un despliegue: di cómo se escalona, qué señal de error lo detiene y lo rápido que se revierte."

not_simulated = [
  "Targeting rules and the evaluation of a flag for each user",
  "Experiment statistics for A/B tests",
  "Audit logs of who changed what",
  "Flag debt: old flags and the dead code they leave",
]
