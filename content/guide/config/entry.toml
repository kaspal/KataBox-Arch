  "Las reglas de segmentación y la evaluación de un flag para cada usuario",
  "La estadística de los experimentos A/B",
  "Los registros de auditoría de quién cambió qué",
  "La deuda de flags: flags antiguos y el código muerto que dejan",
]

[[sim]]
prop = "delivery"
note = "Stream pushes a change to every app as soon as it is made. Poll lets each app fetch it on its own schedule."
note_es = "Stream envía un cambio a todas las aplicaciones en cuanto se hace. Poll deja que cada aplicación lo traiga a su ritmo."

[[sim]]
prop = "poll_s"
note = "With poll delivery, how often each app asks for changes. A change reaches everyone within this time."
note_es = "Con entrega por sondeo, cada cuánto pregunta cada aplicación por cambios. Un cambio llega a todas dentro de este tiempo."

[[sim]]
prop = "staged"
note = "Off, a push reaches every app at once. On, it rolls out one stage at a time and halts when errors rise."
note_es = "Desactivado, un cambio llega a todas las aplicaciones a la vez. Activado, se despliega etapa a etapa y se detiene cuando suben los errores."

[[sim]]
prop = "stages"
note = "How many steps a staged rollout takes. More stages expose fewer servers to a bad change, but full rollout takes longer."
note_es = "Cuántos pasos da un despliegue por etapas. Más etapas exponen menos servidores a un cambio malo, pero el despliegue completo tarda más."

[[sim]]
prop = "bake_s"
note = "How long each stage runs before the next one starts. Errors in this time halt the rollout."
note_es = "Cuánto dura cada etapa antes de empezar la siguiente. Los errores en este tiempo detienen el despliegue."

[[sim]]
prop = "kill_switch"
note = "Once a rollout halts, the change is rolled back within a second. Without it, the servers already changed keep the bad setting."
note_es = "Cuando un despliegue se detiene, el cambio se revierte en menos de un segundo. Sin él, los servidores ya cambiados se quedan con el ajuste malo."

[[sim]]
cost = "per_instance_month"
note = "A flat monthly fee for the service, whatever the flavour."
note_es = "Una cuota mensual fija por el servicio, sea cual sea la variante."

