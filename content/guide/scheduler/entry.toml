[[pitfalls]]
title = "The midnight burst"
title_es = "La ráfaga de medianoche"
body = "Many jobs are set for the same round time, so they all start together and swamp whatever they call."
body_es = "Muchas tareas se fijan a la misma hora en punto, así que arrancan todas juntas y saturan lo que llaman."
fix = "Publish jobs to a queue and let workers drain it, or spread start times with a little jitter."
fix_es = "Publica las tareas en una cola y deja que los workers la vacíen, o reparte las horas de inicio con un poco de variación."

[[pitfalls]]
title = "Calling workers directly"
title_es = "Llamar a los workers directamente"
body = "The scheduler calls the workers over HTTP. When they are busy or down, jobs fail with nothing to retry them."
body_es = "El planificador llama a los workers por HTTP. Cuando están ocupados o caídos, las tareas fallan sin nada que las reintente."
fix = "Put a durable queue between the scheduler and the workers."
fix_es = "Pon una cola duradera entre el planificador y los workers."

[[pitfalls]]
title = "Jobs that run twice"
title_es = "Tareas que se ejecutan dos veces"
body = "Two scheduler copies, or a retry after a timeout, start the same job twice, and it charges or emails twice."
body_es = "Dos copias del planificador, o un reintento tras un tiempo de espera, lanzan la misma tarea dos veces, y cobra o envía correos dos veces."
fix = "Make jobs idempotent, and use a lock or a single leader for the scheduler."
fix_es = "Haz las tareas idempotentes, y usa un bloqueo o un único líder para el planificador."

