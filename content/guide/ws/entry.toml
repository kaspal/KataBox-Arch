[[quiz]]
q = "A gateway instance holding many clients dies, and the clients reconnect with no jitter. What does the simulator show?"
q_es = "Cae una instancia del gateway con muchos clientes, y los clientes se reconectan sin margen aleatorio. ¿Qué muestra el simulador?"
options = ["The other instances take every client within the same second", "The clients wait until the dead instance comes back", "Reconnects beyond the accept rate are dropped and retry after backoff, so clients stay offline for a while", "The load balancer queues the reconnects with no loss"]
options_es = ["Las demás instancias aceptan a todos los clientes en el mismo segundo", "Los clientes esperan a que vuelva la instancia caída", "Las reconexiones por encima del ritmo de aceptación se descartan y reintentan tras la espera, así que los clientes siguen desconectados un rato", "El balanceador encola las reconexiones sin pérdidas"]
answer = 2
why = "New connections per second are capped per instance. A burst of reconnects beyond that cap is dropped and retried, which is a reconnect storm. Jitter on the client spreads the burst out."
why_es = "Las conexiones nuevas por segundo tienen un tope por instancia. Una ráfaga de reconexiones por encima de ese tope se descarta y se reintenta: es una tormenta de reconexiones. El margen aleatorio en el cliente reparte la ráfaga."

[[quiz]]
q = "A chat app has many idle clients and few messages. Instances refuse new connections while their CPU is low. What is the right move?"
q_es = "Una app de chat tiene muchos clientes inactivos y pocos mensajes. Las instancias rechazan conexiones nuevas aunque su CPU está baja. ¿Qué conviene hacer?"
options = ["Add instances or memory, because connections are capped by count and memory, not by CPU", "Raise the message rate per instance", "Put a queue in front of the gateway", "Switch the clients to polling every second"]
options_es = ["Añadir instancias o memoria, porque las conexiones tienen un tope por número y por memoria, no por CPU", "Subir el ritmo de mensajes por instancia", "Poner una cola delante del gateway", "Pasar los clientes a sondear cada segundo"]
answer = 0
why = "Open connections are a capacity of their own. Each one holds memory, so the gateway fills up on connections even with little traffic. Polling every second would add far more requests."
why_es = "Las conexiones abiertas son una capacidad propia. Cada una ocupa memoria, así que el gateway se llena de conexiones aunque haya poco tráfico. Sondear cada segundo añadiría muchas más peticiones."

[[quiz]]
q = "A message goes to a room whose members are spread over many gateway instances. When is it delivered to everyone?"
q_es = "Un mensaje va a una sala cuyos miembros están repartidos entre muchas instancias del gateway. ¿Cuándo se ha entregado a todos?"
options = ["When the first instance pushes it", "When the average instance pushes it", "When the publisher gets an acknowledgement", "When the last instance has pushed it"]
options_es = ["Cuando la primera instancia lo envía", "Cuando lo envía la instancia media", "Cuando quien publica recibe una confirmación", "Cuando la última instancia lo ha enviado"]
answer = 3
why = "A fan-out completes only when the slowest instance has pushed it. One instance with a backlog delays the whole room, so push capacity matters on every instance."
why_es = "Un fan-out termina solo cuando la instancia más lenta lo ha enviado. Una instancia con cola pendiente retrasa a toda la sala, así que la capacidad de envío importa en cada instancia."
