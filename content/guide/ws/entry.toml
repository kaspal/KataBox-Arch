[[pitfalls]]
title = "Reconnect storm"
title_es = "Tormenta de reconexiones"
body = "A gateway instance dies and all its clients reconnect in the same second. The survivors can only accept so many new connections per second, so most attempts are dropped, retry, and pile up again."
body_es = "Cae una instancia del gateway y todos sus clientes se reconectan en el mismo segundo. Las supervivientes solo aceptan cierto número de conexiones nuevas por segundo, así que la mayoría de intentos se descartan, reintentan y vuelven a amontonarse."
fix = "Give the client a reconnect jitter so reconnects spread over several seconds, and keep spare accept capacity on the other instances."
fix_es = "Dale al cliente un margen aleatorio de reconexión para que las reconexiones se repartan en varios segundos, y deja capacidad de aceptación de sobra en las demás instancias."

[[pitfalls]]
title = "Sizing by requests per second"
title_es = "Dimensionar por peticiones por segundo"
body = "The design counts messages per second but forgets that every idle client still holds a connection and its memory. The gateway runs out of connections long before it runs out of CPU."
body_es = "El diseño cuenta mensajes por segundo pero olvida que cada cliente inactivo sigue ocupando una conexión y su memoria. El gateway se queda sin conexiones mucho antes que sin CPU."
fix = "Size instances for peak concurrent connections first, using memory per connection, then check the push rate."
fix_es = "Dimensiona las instancias primero por las conexiones simultáneas del pico, usando la memoria por conexión, y luego comprueba el ritmo de envíos."

[[pitfalls]]
title = "One slow instance holds up a fan-out"
title_es = "Una instancia lenta retrasa un fan-out"
body = "A message to a big room must be pushed by every instance that holds a member. One instance with a backlog makes the whole delivery late."
body_es = "Un mensaje a una sala grande lo debe enviar cada instancia que tenga a un miembro. Una sola instancia con cola pendiente retrasa toda la entrega."
fix = "Keep push capacity well above the peak on every instance, and spread connections evenly with the load balancer."
fix_es = "Mantén la capacidad de envío muy por encima del pico en cada instancia, y reparte las conexiones por igual con el balanceador."

