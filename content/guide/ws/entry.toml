kind = "ws"
one_liner = "A server that holds long-lived connections open so it can push messages to clients the moment they happen."
one_liner_es = "Un servidor que mantiene abiertas conexiones de larga duración para empujar mensajes a los clientes en cuanto ocurren."

use_when = [
  "Clients must see updates within a second, such as chat messages or live edits",
  "The server, not the client, decides when there is something new",
  "Many clients stay connected for minutes or hours",
]
use_when_es = [
  "Los clientes deben ver las novedades en menos de un segundo, como mensajes de chat o ediciones en vivo",
  "Es el servidor, no el cliente, quien decide cuándo hay algo nuevo",
  "Muchos clientes permanecen conectados durante minutos u horas",
]
skip_when = [
  "Clients only ask and wait for an answer, like a normal page load",
  "Updates every minute or so are good enough, so polling would do",
  "The data is large files, which belong on a CDN or object storage",
]
skip_when_es = [
  "Los clientes solo preguntan y esperan respuesta, como una carga de página normal",
  "Basta con novedades cada minuto o así, así que el sondeo serviría",
  "Los datos son ficheros grandes, que van en una CDN o en almacenamiento de objetos",
]

formula = "connections per instance ≤ min(max connections, memory ÷ memory per connection); new connections per second ≤ accept rate (the rest retry after the client's backoff); pushes per instance ≤ message rate, excess waits in a backlog; a fan-out is delivered when the last instance has pushed it"
formula_es = "conexiones por instancia ≤ mín(conexiones máximas, memoria ÷ memoria por conexión); conexiones nuevas por segundo ≤ ritmo de aceptación (el resto reintenta tras la espera del cliente); envíos por instancia ≤ ritmo de mensajes, el exceso espera en una cola pendiente; un fan-out se entrega cuando la última instancia lo ha enviado"

gains = [
  "Updates reach clients at once, with no polling delay",
  "No wasted requests asking whether anything changed",
]
gains_es = [
  "Las novedades llegan a los clientes al momento, sin el retraso del sondeo",
  "Sin peticiones desperdiciadas preguntando si algo cambió",
]
costs = [
  "Every open connection holds memory, even when it is idle",
  "When an instance dies, all its clients reconnect at once unless they spread out",
  "Instances hold state, so scaling in or deploying drops connections",
]
costs_es = [
  "Cada conexión abierta ocupa memoria, aunque esté inactiva",
  "Cuando una instancia cae, todos sus clientes se reconectan a la vez salvo que se repartan",
  "Las instancias guardan estado, así que reducir o desplegar corta conexiones",
]

works_with = ["lb", "pubsub", "app", "client", "cache"]
practice = ["chat", "collab-docs"]

interview_tip = "Size connections and pushes apart from requests per second: say how many clients stay connected, how much memory each takes, and how they reconnect when a gateway dies."
interview_tip_es = "Dimensiona las conexiones y los envíos aparte de las peticiones por segundo: di cuántos clientes siguen conectados, cuánta memoria ocupa cada uno y cómo se reconectan cuando cae un gateway."

not_simulated = [
  "The TLS cost of each handshake, beyond the accept rate",
  "Message ordering on a connection",
  "Message sizes and network bandwidth",
  "The sticky routing details of each product",
  "API Gateway's limit on how long one connection may stay open",
]
not_simulated_es = [
  "El coste TLS de cada handshake, más allá del ritmo de aceptación",
  "El orden de los mensajes en una conexión",
  "El tamaño de los mensajes y el ancho de banda de red",
  "Los detalles del enrutado persistente de cada producto",
  "El límite de API Gateway sobre cuánto puede seguir abierta una conexión",
]

[[sim]]
prop = "instances"
note = "Gateway servers. Each one holds its own share of the connections and pushes its own share of the messages."
note_es = "Servidores del gateway. Cada uno mantiene su parte de las conexiones y envía su parte de los mensajes."

[[sim]]
prop = "max_connections"
note = "The most connections one instance accepts. Past it, new connections are refused."
note_es = "El máximo de conexiones que acepta una instancia. Por encima, las conexiones nuevas se rechazan."

[[sim]]
prop = "conn_memory_kb"
note = "Memory each open connection holds. Together with the instance memory it sets a second cap on connections."
note_es = "Memoria que ocupa cada conexión abierta. Junto con la memoria de la instancia fija un segundo tope de conexiones."

[[sim]]
prop = "memory_gb"
note = "Memory per instance. Divided by the memory per connection, it caps how many clients fit."
note_es = "Memoria por instancia. Dividida entre la memoria por conexión, limita cuántos clientes caben."

[[sim]]
prop = "accept_per_s"
note = "New connections one instance can open per second. Attempts beyond it are dropped and retry after the client's backoff, which matters most in a reconnect storm."
note_es = "Conexiones nuevas que una instancia puede abrir por segundo. Los intentos por encima se descartan y reintentan tras la espera del cliente, lo que pesa sobre todo en una tormenta de reconexiones."

[[sim]]
prop = "msgs_per_s"
note = "Pushes one instance can send per second. Excess waits in a backlog and arrives late."
note_es = "Envíos que una instancia puede hacer por segundo. El exceso espera en una cola pendiente y llega tarde."

[[sim]]
prop = "service_ms"
note = "Time to handle one message on its way through the gateway."
note_es = "Tiempo para procesar un mensaje a su paso por el gateway."

[[sim]]
sim = "p99_ratio"
note = "How much slower the slow tail is than the median when handling a message."
note_es = "Cuánto más lenta es la cola lenta que la mediana al procesar un mensaje."

[[sim]]
cost = "per_instance_month"
note = "A fixed monthly price per self-hosted gateway server. The managed AWS flavour has no instance fee."
note_es = "Un precio mensual fijo por servidor de gateway propio. El sabor gestionado de AWS no cobra por instancia."

[[sim]]
cost = "messages_m"
note = "The managed AWS flavour bills each message sent or received, per million."
note_es = "El sabor gestionado de AWS cobra cada mensaje enviado o recibido, por millón."

[[sim]]
cost = "conn_minutes_m"
note = "The managed AWS flavour also bills the time each client stays connected, per million connection-minutes."
note_es = "El sabor gestionado de AWS cobra además el tiempo que cada cliente sigue conectado, por millón de minutos de conexión."

