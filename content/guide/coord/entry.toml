[[quiz]]
q = "A five-member ensemble is split by the network into a group of two and a group of three. What happens to lock requests?"
q_es = "Un conjunto de cinco miembros queda dividido por la red en un grupo de dos y otro de tres. ¿Qué pasa con las peticiones de bloqueo?"
options = ["The group of three keeps granting locks; the group of two refuses them", "Both groups keep granting locks until the network heals", "Both groups refuse every lock until the network heals"]
options_es = ["El grupo de tres sigue concediendo bloqueos; el de dos los rechaza", "Ambos grupos siguen concediendo bloqueos hasta que la red se recupere", "Ambos grupos rechazan todos los bloqueos hasta que la red se recupere"]
answer = 0
why = "A grant needs a majority, three of five. Only the larger side has one, so only it can grant; that is what stops two holders at once."
why_es = "Una concesión necesita una mayoría, tres de cinco. Solo el lado mayor la tiene, así que solo él puede conceder; eso es lo que evita dos titulares a la vez."

[[quiz]]
q = "A worker holding a lock pauses for longer than its lease. Another worker gets the lock. How do you stop the first one's late write?"
q_es = "Un worker con un bloqueo se pausa más tiempo que su concesión. Otro worker obtiene el bloqueo. ¿Cómo evitas la escritura tardía del primero?"
options = ["Make the lease longer than any possible pause", "Have the first worker check the lock just before it writes", "Add more members to the coordination service", "Send a fencing token with each write and have the datastore refuse older tokens"]
options_es = ["Hacer la concesión más larga que cualquier pausa posible", "Que el primer worker compruebe el bloqueo justo antes de escribir", "Añadir más miembros al servicio de coordinación", "Enviar un token de cercado con cada escritura y que el almacén rechace tokens más antiguos"]
answer = 3
why = "No lease is long enough for every pause, and a check just before the write can still go stale. Only the datastore, seeing the token, can refuse the stale holder."
why_es = "Ninguna concesión es lo bastante larga para toda pausa, y una comprobación justo antes de escribir puede quedar obsoleta igual. Solo el almacén, al ver el token, puede rechazar al titular obsoleto."

[[quiz]]
q = "Why do coordination clusters usually have three or five members, not four?"
q_es = "¿Por qué los clústeres de coordinación suelen tener tres o cinco miembros y no cuatro?"
options = ["Four members would be too slow to elect a leader", "Four tolerates one failure, like three, but costs more and splits evenly", "The consensus protocols only work with odd counts", "Four members would lose data when one fails"]
options_es = ["Cuatro miembros tardarían demasiado en elegir líder", "Cuatro tolera un fallo, como tres, pero cuesta más y se parte en mitades iguales", "Los protocolos de consenso solo funcionan con números impares", "Cuatro miembros perderían datos al fallar uno"]
answer = 1
why = "A majority of four is three, so only one member may fail, as with three. The fourth member adds cost and a two-two split leaves no majority."
why_es = "La mayoría de cuatro es tres, así que solo puede fallar un miembro, como con tres. El cuarto añade coste y una partición dos-dos deja sin mayoría."
