kind = "coord"
one_liner = "A small, strongly consistent store that a cluster uses to agree on leaders, locks and config."
one_liner_es = "Un almacén pequeño y fuertemente consistente que un clúster usa para ponerse de acuerdo en líderes, bloqueos y configuración."

use_when = [
  "Only one worker at a time may do a job, such as a scheduler leader",
  "Several services must agree on who owns a resource",
  "You need a lock that survives the holder crashing, through a lease",
  "A small piece of shared config or membership must never disagree between nodes",
]
use_when_es = [
  "Solo un worker a la vez puede hacer un trabajo, como el líder de un planificador",
  "Varios servicios deben ponerse de acuerdo en quién es dueño de un recurso",
  "Necesitas un bloqueo que sobreviva a la caída de quien lo tiene, mediante una concesión",
  "Un pequeño dato compartido de configuración o pertenencia nunca debe diferir entre nodos",
]
skip_when = [
  "You need to store lots of data or serve high read traffic",
  "The database already offers the guarantee, such as a unique key or a conditional write",
  "Occasional duplicate work is harmless and idempotent",
]
skip_when_es = [
  "Necesitas guardar muchos datos o servir mucho tráfico de lectura",
  "La base de datos ya ofrece la garantía, como una clave única o una escritura condicional",
  "Algún trabajo duplicado de vez en cuando es inofensivo e idempotente",
]

formula = "a write or lock grant needs a majority of members (floor(n/2)+1) and costs service time; the side of a split without a majority refuses; losing the leader pauses writes for election_ms; a lock is a lease that expires after lease_s unless renewed"
formula_es = "una escritura o concesión de bloqueo necesita a la mayoría de los miembros (floor(n/2)+1) y cuesta el tiempo de servicio; el lado de una partición sin mayoría la rechaza; perder al líder pausa las escrituras durante election_ms; un bloqueo es una concesión que caduca tras lease_s si no se renueva"

gains = [
  "One agreed answer about who is leader or who holds a lock",
  "Survives losing a minority of members without losing data",
  "Leases free a lock when its holder dies, with no human help",
]
gains_es = [
  "Una única respuesta acordada sobre quién es líder o quién tiene un bloqueo",
  "Sobrevive a la pérdida de una minoría de miembros sin perder datos",
  "Las concesiones liberan un bloqueo cuando muere quien lo tiene, sin ayuda humana",
]
costs = [
  "Every write waits for a majority, so it is slower than a single node",
  "The minority side of a network split cannot write at all",
  "A lock alone doesn't stop a paused, stale holder from writing: you need fencing tokens",
]
costs_es = [
  "Cada escritura espera a una mayoría, así que es más lenta que un solo nodo",
  "El lado minoritario de una partición de red no puede escribir en absoluto",
  "Un bloqueo por sí solo no impide que un titular pausado y obsoleto escriba: necesitas tokens de cercado",
]

works_with = ["scheduler", "worker", "app", "sql", "micro"]
practice = ["job-scheduler"]

interview_tip = "Use an odd number of members, say what happens on the minority side of a split, and pair every lock with a fencing token checked by the datastore."
interview_tip_es = "Usa un número impar de miembros, explica qué pasa en el lado minoritario de una partición y acompaña cada bloqueo con un token de cercado que compruebe el almacén de datos."

not_simulated = [
  "Watch notifications: clients learn about changes only through the requests you draw",
  "Limits on value and database size",
  "Snapshots, log compaction and member replacement",
  "Clock skew between members and clients, which real leases depend on",
]
not_simulated_es = [
  "Las notificaciones de cambios (watch): los clientes solo se enteran por las peticiones que dibujas",
  "Los límites de tamaño de los valores y de la base de datos",
  "Las instantáneas, la compactación del registro y el reemplazo de miembros",
  "El desfase de reloj entre miembros y clientes, del que dependen las concesiones reales",
]

[[sim]]
prop = "instances"
note = "Members of the ensemble. A write needs a majority of them, so an odd count tolerates the most failures for its size."
note_es = "Miembros del conjunto. Una escritura necesita a la mayoría, así que un número impar tolera más fallos para su tamaño."

[[sim]]
prop = "election_ms"
note = "How long writes and lock grants pause after the leader is lost, while the members elect a new one."
note_es = "Cuánto se pausan las escrituras y las concesiones de bloqueo tras perder al líder, mientras los miembros eligen otro."

[[sim]]
prop = "lease_s"
note = "How long a lock lasts without renewal. If the holder dies, the lock frees itself after this long."
note_es = "Cuánto dura un bloqueo sin renovarse. Si muere quien lo tiene, el bloqueo se libera solo pasado este tiempo."

[[sim]]
prop = "service_ms"
note = "Time to commit one write or grant one lock, including the round to a majority."
note_es = "Tiempo para confirmar una escritura o conceder un bloqueo, incluida la ronda hasta una mayoría."

[[sim]]
sim = "servers_per_instance"
note = "Requests one member handles at once before the rest wait."
note_es = "Peticiones que un miembro atiende a la vez antes de que el resto espere."

[[sim]]
cost = "per_instance_month"
note = "A fixed monthly price per member. Three members cost three times one."
note_es = "Un precio mensual fijo por miembro. Tres miembros cuestan el triple que uno."

