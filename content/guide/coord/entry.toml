[[pitfalls]]
title = "An even number of members"
title_es = "Un número par de miembros"
body = "Four members need three for a majority, so they survive one failure, the same as three members. A split down the middle leaves neither side able to write."
body_es = "Cuatro miembros necesitan tres para la mayoría, así que sobreviven a un fallo, igual que tres. Una partición por la mitad deja a ningún lado capaz de escribir."
fix = "Run three or five members, spread over availability zones so one zone can't hold a majority alone."
fix_es = "Usa tres o cinco miembros, repartidos entre zonas de disponibilidad para que una sola zona no tenga la mayoría."

[[pitfalls]]
title = "A lock without fencing"
title_es = "Un bloqueo sin cercado"
body = "The holder pauses, its lease expires, and a second worker takes the lock. Then the first one wakes up and writes too, because it still believes it holds the lock."
body_es = "Quien tiene el bloqueo se pausa, su concesión caduca y un segundo worker lo toma. Luego el primero despierta y también escribe, porque cree que aún tiene el bloqueo."
fix = "Hand out a fencing token that grows with each grant, and have the datastore refuse writes with an older token."
fix_es = "Entrega un token de cercado que crece con cada concesión y haz que el almacén rechace escrituras con un token más antiguo."

[[pitfalls]]
title = "Using it as a database"
title_es = "Usarlo como base de datos"
body = "App data goes into the coordination service. Every write waits for a majority, it fills up, and the slow writes delay the leader elections that depend on it."
body_es = "Los datos de la aplicación van al servicio de coordinación. Cada escritura espera a una mayoría, se llena, y las escrituras lentas retrasan las elecciones de líder que dependen de él."
fix = "Keep only small coordination data there: leaders, locks, membership and a little config."
fix_es = "Guarda allí solo datos pequeños de coordinación: líderes, bloqueos, pertenencia y algo de configuración."

