kind = "sql"
one_liner = "A relational database: tables, joins and transactions you can trust."
one_liner_es = "Una base de datos relacional: tablas, joins y transacciones en las que puedes confiar."

use_when = [
  "Data has clear relations and you need joins across them",
  "Several rows must change together or not at all",
  "Every read must see the latest committed write",
  "The write rate fits on one primary, or splits cleanly by a key",
]
use_when_es = [
  "Los datos tienen relaciones claras y necesitas joins entre ellas",
  "Varias filas deben cambiar juntas o no cambiar",
  "Cada lectura debe ver la última escritura confirmada",
  "El ritmo de escrituras cabe en una principal, o se reparte bien por una clave",
]
skip_when = [
  "You store large files or blobs: they belong in object storage",
  "Writes far exceed what one primary can take and there is no clean shard key",
  "Lookups are always by one key and never need joins or transactions",
  "Free-text search is the main way people find the data",
]
skip_when_es = [
  "Guardas ficheros grandes o blobs: van en almacenamiento de objetos",
  "Las escrituras superan con mucho lo que aguanta una principal y no hay una clave de partición clara",
  "Las búsquedas son siempre por una clave y nunca necesitan joins ni transacciones",
  "La búsqueda de texto libre es la forma principal de encontrar los datos",
]

formula = "throughput per shard ≈ concurrency ÷ (service time × (1 + payload KB ÷ 64)); a key always lands on the same shard; writes go to the primary, reads spread over healthy members"
formula_es = "rendimiento por partición ≈ concurrencia ÷ (tiempo de servicio × (1 + KB de carga ÷ 64)); una clave cae siempre en la misma partición; las escrituras van a la principal y las lecturas se reparten entre los miembros sanos"

gains = [
  "Transactions and constraints keep the data correct",
  "Flexible queries and joins over the same data",
  "Mature tools for backups, replicas and migrations",
]
gains_es = [
  "Las transacciones y las restricciones mantienen los datos correctos",
  "Consultas flexibles y joins sobre los mismos datos",
  "Herramientas maduras para copias de seguridad, réplicas y migraciones",
]
costs = [
  "Writes are limited by a single primary",
  "Sharding is manual and makes cross-shard queries hard",
  "Large rows and blobs hold connections for a long time",
]
costs_es = [
  "Las escrituras están limitadas por una sola principal",
  "El particionado es manual y complica las consultas entre particiones",
  "Las filas grandes y los blobs ocupan las conexiones mucho tiempo",
]

works_with = ["app", "cache", "worker", "object", "search"]
practice = ["url-shortener"]

interview_tip = "Say what is read and written per second, whether one primary takes the writes, and what you add for reads first: a cache or replicas."
interview_tip_es = "Di cuánto se lee y se escribe por segundo, si una principal aguanta las escrituras y qué añades primero para las lecturas: una caché o réplicas."

[[sim]]
prop = "shards"
note = "Independent slices of the data, each with its own connections. A key always lands on the same shard, so a hot key makes a hot shard."
note_es = "Trozos independientes de los datos, cada uno con sus propias conexiones. Una clave cae siempre en la misma partición, así que una clave caliente crea una partición caliente."

[[sim]]
prop = "concurrency"
note = "Connections per shard: queries that run at once. The flavour default follows each engine's out-of-the-box connection limit."
note_es = "Conexiones por partición: consultas que se ejecutan a la vez. El valor por defecto de cada sabor sigue el límite de conexiones de fábrica del motor."

[[sim]]
prop = "service_ms"
note = "The median time of a small indexed read or write. Bigger payloads take longer in proportion."
note_es = "La mediana de una lectura o escritura pequeña con índice. Las cargas más grandes tardan más en proporción."

[[sim]]
prop = "replication_lag_ms"
note = "How far a replica trails the primary. A replica read of a key written within this window counts as stale."
note_es = "Cuánto va una réplica por detrás de la principal. Una lectura en réplica de una clave escrita dentro de este margen cuenta como obsoleta."

[[sim]]
prop = "failover_s"
note = "With a replica wired by Replicate, how long until it is promoted after the primary dies. Writes fail until then. The default matches a managed cluster with two readable standbys (typically just over half a minute); a single standby takes one to two minutes."
note_es = "Con una réplica unida por Replicate, cuánto tarda en ascender cuando cae la principal. Hasta entonces las escrituras fallan. El valor por defecto corresponde a un clúster gestionado con dos réplicas legibles (normalmente algo más de medio minuto); con una sola réplica en espera se tarda de uno a dos minutos."

[[sim]]
sim = "p99_ratio"
note = "How much slower the slowest queries are than the median. Databases have a long tail."
note_es = "Cuánto más lentas son las consultas más lentas que la mediana. Las bases de datos tienen una cola larga."

[[sim]]
cost = "per_instance_month"
note = "Priced per card and per shard: each replica is another card and adds the same price, and each shard beyond the first adds it again."
note_es = "Se cobra por tarjeta y por shard: cada réplica es otra tarjeta y suma el mismo precio, y cada shard más allá del primero lo vuelve a sumar."

[[sim]]
prop = "read_from"
note = "Where reads go: spread over the primary and its replicas, or to the primary only. The primary always has the latest write (read-your-writes), but takes every read."
note_es = "Adónde van las lecturas: repartidas entre la principal y sus réplicas, o solo a la principal. La principal siempre tiene la última escritura (leer lo que escribes), pero se lleva todas las lecturas."

[[sim]]
prop = "cdc_buffer_s"
note = "With a CDC edge to a stream, how long committed changes wait in the database log while the stream is down. Older changes are lost."
note_es = "Con un enlace CDC a un stream, cuánto esperan los cambios confirmados en el registro de la base de datos mientras el stream está caído. Los más antiguos se pierden."

