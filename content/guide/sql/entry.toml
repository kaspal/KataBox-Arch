[[pitfalls]]
title = "A single primary with no replica"
title_es = "Una sola principal sin réplica"
body = "When the only database dies, there is nothing to promote, and every request that needs it fails until it comes back."
body_es = "Cuando cae la única base de datos, no hay nada que ascender, y cada petición que la necesita falla hasta que vuelve."
fix = "Add a replica joined by a Replicate edge, and keep the failover time short."
fix_es = "Añade una réplica unida por un enlace Replicate, y mantén corto el tiempo de failover."
seen_in = "url-shortener"

[[pitfalls]]
title = "Blobs in the database"
title_es = "Blobs en la base de datos"
body = "Large bodies make every query slower and hold a connection the whole time. A burst of big writes fills the connections and the app tier stalls behind them."
body_es = "Los cuerpos grandes hacen más lenta cada consulta y ocupan una conexión todo el tiempo. Un pico de escrituras grandes llena las conexiones y la capa de aplicación se atasca detrás."
fix = "Store the bytes in object storage and keep only the key and metadata in the database."
fix_es = "Guarda los bytes en almacenamiento de objetos y deja en la base de datos solo la clave y los metadatos."
seen_in = "pastebin"

[[pitfalls]]
title = "A write flood on one primary"
title_es = "Una avalancha de escrituras en una principal"
body = "Replicas help reads, not writes. When the write rate passes what the primary's connections can serve, writes queue, callers hold their slots, and errors spread."
body_es = "Las réplicas ayudan a las lecturas, no a las escrituras. Cuando el ritmo de escrituras supera lo que sirven las conexiones de la principal, las escrituras se encolan, los que llaman conservan sus huecos y los errores se extienden."
fix = "Shard by a key that spreads the writes, buffer them through a queue, or use a store built for heavy writes."
fix_es = "Particiona por una clave que reparta las escrituras, amortígualas con una cola, o usa un almacén pensado para muchas escrituras."
seen_in = "ride-sharing"

