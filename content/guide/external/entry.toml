[[quiz]]
q = "An app sends a confirmation email inside the checkout request. The email provider is down for a few minutes. What happens?"
q_es = "Una aplicación envía un correo de confirmación dentro de la petición de compra. El proveedor de correo cae unos minutos. ¿Qué pasa?"
options = ["Checkouts fail or hang while the provider is down", "The emails are delayed but checkouts succeed", "The provider queues the emails for you", "Nothing, because email is optional"]
options_es = ["Las compras fallan o se cuelgan mientras el proveedor está caído", "Los correos se retrasan pero las compras salen bien", "El proveedor encola los correos por ti", "Nada, porque el correo es opcional"]
answer = 0
why = "A call inside the request ties the request to the provider. Sending the email through a queue and a worker lets checkout succeed and retries the email later."
why_es = "Una llamada dentro de la petición ata la petición al proveedor. Enviar el correo por una cola y un worker deja que la compra salga bien y reintenta el correo después."

[[quiz]]
q = "Two external cards are bound to the same SMS provider, one for a bulk campaign and one for login codes. How do their rate limits work?"
q_es = "Dos tarjetas externas están vinculadas al mismo proveedor de SMS, una para una campaña masiva y otra para códigos de inicio de sesión. ¿Cómo funcionan sus límites?"
options = ["Each card has the full limit", "The limit is split evenly between the cards", "They share one limit, so the campaign can starve the login codes", "Login codes always go first"]
options_es = ["Cada tarjeta tiene el límite completo", "El límite se reparte a partes iguales entre las tarjetas", "Comparten un límite, así que la campaña puede dejar sin hueco a los códigos de inicio de sesión", "Los códigos de inicio de sesión siempre van primero"]
answer = 2
why = "The rate limit belongs to the provider account, not to the card. Pacing the bulk sender keeps room for the urgent traffic."
why_es = "El límite pertenece a la cuenta del proveedor, no a la tarjeta. Regular el envío masivo deja sitio para el tráfico urgente."

[[quiz]]
q = "Why draw an external card at all, when the simulator already knows the problem's providers?"
q_es = "¿Por qué dibujar una tarjeta externa, si el simulador ya conoce los proveedores del problema?"
options = ["It makes the provider faster", "It removes the provider's rate limit", "It is required for the provider to bill", "It lets you route to the provider explicitly and give different callers their own path"]
options_es = ["Hace que el proveedor sea más rápido", "Quita el límite de ritmo del proveedor", "Es obligatoria para que el proveedor cobre", "Te deja enrutar hacia el proveedor de forma explícita y dar a cada llamador su propio camino"]
answer = 3
why = "Without a card the provider is implicit. With one, the design shows who calls it and by which path, for example through a queue and a worker."
why_es = "Sin tarjeta el proveedor es implícito. Con ella, el diseño muestra quién lo llama y por qué camino, por ejemplo a través de una cola y un worker."
