[[sim]]
cost = "per_million"
note = "A price per million calls, for providers that bill per message, such as SMS or email. Latency, rate limit and outages come from the problem, not from the card."
note_es = "Un precio por millón de llamadas, para proveedores que cobran por mensaje, como SMS o correo. La latencia, el límite de ritmo y las caídas vienen del problema, no de la tarjeta."

[flavours_compared]
flavours = ["generic", "stripe", "twilio", "sendgrid"]

[[flavours_compared.rows]]
label = "What it does"
label_es = "Qué hace"
cells = ["Any HTTP API the problem names", "Card payments", "SMS and voice", "Email delivery"]
cells_es = ["Cualquier API HTTP que nombre el problema", "Pagos con tarjeta", "SMS y voz", "Envío de correo"]

[[flavours_compared.rows]]
label = "How it bills"
label_es = "Cómo cobra"
cells = ["Nothing in the simulator", "A share of each payment, not per call", "Per message", "Per email"]
cells_es = ["Nada en el simulador", "Una parte de cada pago, no por llamada", "Por mensaje", "Por correo"]

[[flavours_compared.rows]]
label = "Typical call"
label_es = "Llamada típica"
cells = ["Depends on the API", "Charge a card while the user waits", "Send a code or an alert", "Send a receipt or a newsletter"]
cells_es = ["Depende de la API", "Cobrar una tarjeta mientras el usuario espera", "Enviar un código o una alerta", "Enviar un recibo o un boletín"]

[[pitfalls]]
title = "Calling the provider inside the user's request"
title_es = "Llamar al proveedor dentro de la petición del usuario"
body = "The app sends an email or SMS while the user waits. When the provider slows down or fails, the user's request slows down or fails with it."
body_es = "La aplicación envía un correo o un SMS mientras el usuario espera. Cuando el proveedor se ralentiza o falla, la petición del usuario se ralentiza o falla con él."
fix = "Put a queue and a worker between the app and the provider, so the user gets a quick answer and the call is retried later."
fix_es = "Pon una cola y un worker entre la aplicación y el proveedor, para que el usuario reciba una respuesta rápida y la llamada se reintente después."

[[pitfalls]]
title = "Two cards, one limit"
title_es = "Dos tarjetas, un límite"
body = "Two callers each get their own card for the same provider, and the design assumes each has the full rate limit. The limit belongs to the account, so together they exceed it and calls are refused."
body_es = "Dos llamadores tienen cada uno su propia tarjeta para el mismo proveedor, y el diseño supone que cada uno tiene el límite completo. El límite es de la cuenta, así que juntos lo superan y las llamadas se rechazan."
fix = "Budget the provider's limit across all callers, and pace the bulk ones with a queue or a rate limiter."
fix_es = "Reparte el límite del proveedor entre todos los llamadores, y regula los masivos con una cola o un limitador de ritmo."

