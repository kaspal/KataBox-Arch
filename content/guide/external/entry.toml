kind = "external"
one_liner = "A third-party API your system calls, such as a payment, SMS or email provider, drawn on the canvas so you can route to it."
one_liner_es = "Una API de terceros a la que llama tu sistema, como un proveedor de pagos, SMS o correo, dibujada en el lienzo para que puedas enrutar hacia ella."

use_when = [
  "The problem declares a provider and you want to show which components call it",
  "Different callers should reach the provider by their own path, for example a worker behind a queue",
  "You want the shared rate limit of one provider account to be visible in the design",
]
use_when_es = [
  "El problema declara un proveedor y quieres mostrar qué componentes lo llaman",
  "Distintos llamadores deben llegar al proveedor por su propio camino, por ejemplo un worker detrás de una cola",
  "Quieres que el límite de ritmo compartido de una cuenta del proveedor se vea en el diseño",
]
skip_when = [
  "The problem declares no provider",
  "The work is something you run yourself, which belongs on an app, worker or database card",
]
skip_when_es = [
  "El problema no declara ningún proveedor",
  "El trabajo es algo que ejecutas tú, y va en una tarjeta de aplicación, worker o base de datos",
]

formula = "a call takes the provider's declared latency; calls beyond the account's rate limit are refused, and all cards bound to the same provider share that limit; during a declared outage every call fails"
formula_es = "una llamada tarda la latencia declarada del proveedor; las llamadas por encima del límite de la cuenta se rechazan, y todas las tarjetas vinculadas al mismo proveedor comparten ese límite; durante una caída declarada todas las llamadas fallan"

gains = [
  "You buy a hard capability, such as card payments or SMS delivery, instead of building it",
  "The design shows exactly which components depend on the provider",
]
gains_es = [
  "Compras una capacidad difícil, como pagos con tarjeta o envío de SMS, en lugar de construirla",
  "El diseño muestra exactamente qué componentes dependen del proveedor",
]
costs = [
  "Its latency, limits and outages are outside your control",
  "Some providers bill per call, which grows with traffic",
  "A slow or failing provider can drag down every caller that waits on it",
]
costs_es = [
