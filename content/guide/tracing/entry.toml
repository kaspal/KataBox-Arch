kind = "tracing"
one_liner = "Follows one request through every service it touches and shows where the time went."
one_liner_es = "Sigue una petición por cada servicio que toca y muestra en qué se fue el tiempo."

use_when = [
  "A request crosses several services or queues",
  "You need to know which hop makes the tail latency slow",
  "Errors in one service surface as failures somewhere else",
]
use_when_es = [
  "Una petición atraviesa varios servicios o colas",
  "Necesitas saber qué salto hace lenta la latencia de cola",
  "Los errores de un servicio aparecen como fallos en otro sitio",
]
skip_when = [
  "A single service with one database, where logs and metrics suffice",
  "You can't add the tracing context to the services' calls",
  "Only totals matter, never one request (use metrics)",
]
skip_when_es = [
  "Un solo servicio con una base de datos, donde bastan logs y métricas",
  "No puedes añadir el contexto de trazas a las llamadas de los servicios",
  "Solo importan los totales, nunca una petición concreta (usa métricas)",
]

formula = "never on a request path: it adds no latency and drops nothing; the simulator only counts its cost, and a problem may require it"
formula_es = "nunca está en la ruta de una petición: no añade latencia ni descarta nada; el simulador solo cuenta su coste, y un problema puede exigirlo"

gains = [
  "Shows the slow hop in a request at a glance",
  "Connects errors across service boundaries",
  "Reveals the real call graph, including surprises",
]
gains_es = [
  "Muestra de un vistazo el salto lento de una petición",
  "Conecta errores a través de los límites entre servicios",
  "Revela el grafo de llamadas real, sorpresas incluidas",
]
costs = [
  "Every service must pass the trace context along",
  "Storing every trace is expensive, so most are sampled away",
  "Sampling can miss the rare request you care about",
]
costs_es = [
  "Cada servicio debe pasar el contexto de traza",
  "Guardar todas las trazas es caro, así que la mayoría se descartan por muestreo",
  "El muestreo puede perder justo la petición rara que te importa",
]

works_with = ["metrics", "logs", "micro", "gateway"]
practice = []

interview_tip = "Say how the trace id travels, including across queues, and how you sample without losing the slow and failed requests."
interview_tip_es = "Di cómo viaja el id de traza, también a través de colas, y cómo muestreas sin perder las peticiones lentas y fallidas."

[[sim]]
cost = "per_instance_month"
note = "A fixed monthly price for the tracing backend. The sample rate is a design note and doesn't change the price here."
note_es = "Un precio mensual fijo por el backend de trazas. La tasa de muestreo es una nota de diseño y aquí no cambia el precio."

[[pitfalls]]
title = "A broken chain"
title_es = "Una cadena rota"
body = "One service, or a queue in the middle, doesn't forward the trace context, so the trace stops there and the rest looks like separate requests."
body_es = "Un servicio, o una cola en medio, no reenvía el contexto de traza, así que la traza se corta ahí y el resto parecen peticiones distintas."
fix = "Instrument every service with the same library and carry the context in message headers too."
fix_es = "Instrumenta todos los servicios con la misma biblioteca y lleva el contexto también en las cabeceras de los mensajes."

[[pitfalls]]
title = "Sampling away the interesting requests"
title_es = "Descartar por muestreo las peticiones interesantes"
body = "A low fixed sample rate keeps a tiny share of traces, and the rare slow or failed request is almost never among them."
body_es = "Una tasa de muestreo fija y baja guarda una parte mínima de las trazas, y la petición rara lenta o fallida casi nunca está entre ellas."
fix = "Keep all errors and slow requests, and sample only the ordinary ones."
fix_es = "Guarda todos los errores y las peticiones lentas, y muestrea solo las normales."

[[sources]]
flavour = "jaeger"
title = "Jaeger documentation"
url = "https://www.jaegertracing.io/docs/"

[[quiz]]
q = "Metrics show that the p99 latency is high for a request that crosses six services. What does tracing add?"
q_es = "Las métricas muestran que la latencia p99 es alta en una petición que atraviesa seis servicios. ¿Qué aporta el trazado?"
options = ["A lower p99, because it skips slow calls", "A timeline of single requests across the services, showing which call took the time", "A count of requests per service per second", "Automatic retries of the slow calls"]
options_es = ["Una p99 más baja, porque se salta las llamadas lentas", "Una línea de tiempo de peticiones concretas a través de los servicios, que muestra qué llamada se llevó el tiempo", "Un recuento de peticiones por servicio y por segundo", "Reintentos automáticos de las llamadas lentas"]
answer = 1
why = "Metrics tell you that the tail is slow; a trace joins each service's spans into one timeline and shows where the time went, such as a slow call three hops down. Tracing observes; it doesn't change latency."
why_es = "Las métricas te dicen que la cola es lenta; una traza une los spans de cada servicio en una sola línea de tiempo y muestra en qué se fue el tiempo, como una llamada lenta tres saltos más abajo. El trazado observa; no cambia la latencia."

[[quiz]]
q = "In the simulator, what does adding a Tracing card do to the requests in a design?"
q_es = "En el simulador, ¿qué les hace a las peticiones de un diseño añadir una tarjeta de trazado?"
options = ["It adds a little time to every request it records", "It drops requests when its backend is full", "Nothing: it is never on a request's path and only adds its monthly cost", "It makes the design cost more the higher the sample rate"]
options_es = ["Añade algo de tiempo a cada petición que registra", "Descarta peticiones cuando su backend está lleno", "Nada: nunca está en la ruta de una petición y solo suma su coste mensual", "Hace que el diseño cueste más cuanto mayor sea la tasa de muestreo"]
answer = 2
why = "Tracing sits off the request path, so it adds no latency and drops nothing. Its price is fixed per month; the sample rate is a design note. A problem may still require it for a production-ready design."
why_es = "El trazado está fuera de la ruta de las peticiones, así que no añade latencia ni descarta nada. Su precio es fijo al mes; la tasa de muestreo es una nota de diseño. Aun así, un problema puede exigirlo para un diseño listo para producción."

[[quiz]]
q = "Traces stop at a queue: everything after it shows up as separate, unrelated requests. What is the likely cause?"
q_es = "Las trazas se cortan en una cola: todo lo que viene después aparece como peticiones distintas y sin relación. ¿Cuál es la causa probable?"
options = ["The trace context is not carried in the message headers across the queue", "The sample rate is too low", "Tracing can never follow a request through a queue", "The tracing backend ran out of space"]
options_es = ["El contexto de traza no viaja en las cabeceras de los mensajes a través de la cola", "La tasa de muestreo es demasiado baja", "El trazado nunca puede seguir una petición a través de una cola", "El backend de trazas se quedó sin espacio"]
answer = 0
why = "Every hop must pass the trace context along, including through messages. Instrument every service the same way and put the context in message headers. A low sample rate loses whole traces, not their second half."
why_es = "Cada salto debe pasar el contexto de traza, también a través de los mensajes. Instrumenta todos los servicios igual y pon el contexto en las cabeceras de los mensajes. Una tasa de muestreo baja pierde trazas enteras, no su segunda mitad."
