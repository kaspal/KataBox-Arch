[[sim]]
prop = "model_type"
note = "Chat returns output tokens. Embed returns a vector and produces no output tokens. Classify returns a short label."
note_es = "Chat devuelve tokens de salida. Embed devuelve un vector y no produce tokens de salida. Classify devuelve una etiqueta corta."

[[sim]]
prop = "api_mode"
note = "Realtime answers each request now. Batch returns results by a deadline instead, at half the token price."
note_es = "Realtime responde cada petición al momento. Batch devuelve los resultados antes de un plazo, a mitad del precio por token."

[[sim]]
prop = "ttft_ms"
note = "Fixed time before the first token, on top of queue wait and prompt processing."
note_es = "Tiempo fijo antes del primer token, sumado a la espera en cola y al procesado del prompt."

[[sim]]
prop = "prefill_tps"
note = "How fast the prompt is read. Long prompts delay the first token."
note_es = "Lo rápido que se lee el prompt. Los prompts largos retrasan el primer token."

[[sim]]
prop = "tokens_per_s"
note = "Output tokens per second for one request. Long answers take proportionally longer."
note_es = "Tokens de salida por segundo para una petición. Las respuestas largas tardan proporcionalmente más."

[[sim]]
prop = "batch_slots"
note = "Self-hosted only: requests one GPU node decodes together. More in a batch makes each one slower but the node faster in total."
note_es = "Solo en lo propio: peticiones que un nodo GPU decodifica juntas. Más en un lote hace cada una más lenta pero el nodo más rápido en total."

[[sim]]
prop = "instances"
note = "Self-hosted only: GPU nodes. Each one runs its own batch."
note_es = "Solo en lo propio: nodos GPU. Cada uno ejecuta su propio lote."

[[sim]]
prop = "rpm"
note = "Hosted only: requests per minute the account may send. Past it, calls get a rate-limit error. A problem that names your account's tier fixes this value for you."
note_es = "Solo en lo alojado: peticiones por minuto que puede enviar la cuenta. Por encima, las llamadas reciben un error de límite. Un problema que nombra el nivel de tu cuenta fija este valor por ti."

[[sim]]
prop = "tpm"
note = "Hosted only: tokens per minute, input and output together. Long prompts hit this before the request limit."
note_es = "Solo en lo alojado: tokens por minuto, entrada y salida juntas. Los prompts largos llegan a este límite antes que al de peticiones."

[[sim]]
sim = "queue_per_server"
note = "Requests that may wait for a free batch slot before new ones are refused."
note_es = "Peticiones que pueden esperar a una plaza de lote libre antes de rechazar las nuevas."

[[sim]]
cost = "tokens_in_m"
note = "Hosted flavours bill per million input tokens, halved in batch mode."
note_es = "Los sabores alojados cobran por millón de tokens de entrada, a mitad de precio en modo lote."

[[sim]]
cost = "tokens_out_m"
note = "Hosted flavours bill per million output tokens, which cost several times more than input tokens."
note_es = "Los sabores alojados cobran por millón de tokens de salida, que cuestan varias veces más que los de entrada."

[[sim]]
cost = "per_instance_month"
note = "Self-hosted flavours pay a fixed monthly price per GPU node and nothing per token."
note_es = "Los sabores propios pagan un precio mensual fijo por nodo GPU y nada por token."

