options = ["Whether the answers are correct", "Whether the tokens-per-minute limit was hit", "How long the first token took", "What the tokens cost"]
options_es = ["Si las respuestas son correctas", "Si se llegó al límite de tokens por minuto", "Cuánto tardó el primer token", "Cuánto costaron los tokens"]
answer = 0
why = "The simulator models time, limits and price. Answer quality, such as relevance or hallucination, is not simulated and needs its own evaluation."
why_es = "El simulador modela tiempo, límites y precio. La calidad de la respuesta, como la relevancia o las alucinaciones, no se simula y necesita su propia evaluación."
