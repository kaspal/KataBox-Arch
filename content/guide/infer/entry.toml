[[quiz]]
q = "A self-hosted GPU node raises its batch slots. What happens to latency and throughput?"
q_es = "Un nodo GPU propio sube sus plazas de lote. ¿Qué pasa con la latencia y el rendimiento?"
options = ["Each request gets faster and the total gets faster", "Each request gets slower, but the node finishes more requests in total", "Nothing changes, because the GPU speed is fixed", "Requests fail with rate-limit errors"]
options_es = ["Cada petición va más rápida y el total también", "Cada petición va más lenta, pero el nodo termina más peticiones en total", "No cambia nada, porque la velocidad de la GPU es fija", "Las peticiones fallan con errores de límite"]
answer = 1
why = "Continuous batching shares the GPU among more requests. Each decodes more slowly, but more are in progress at once, so throughput rises."
why_es = "El batching continuo reparte la GPU entre más peticiones. Cada una decodifica más despacio, pero hay más en curso a la vez, así que el rendimiento sube."

[[quiz]]
q = "A nightly job summarises a million documents with a hosted model. Nobody waits for the results until morning. What is the best move?"
q_es = "Un trabajo nocturno resume un millón de documentos con un modelo alojado. Nadie espera los resultados hasta la mañana. ¿Qué es lo mejor?"
options = ["Send them all at once in realtime mode", "Buy GPU nodes for the night", "Use an embedding model instead", "Use batch mode: results by a deadline at half the token price"]
options_es = ["Enviarlos todos a la vez en modo realtime", "Comprar nodos GPU para la noche", "Usar un modelo de embeddings en su lugar", "Usar el modo lote: resultados antes de un plazo a mitad del precio por token"]
answer = 3
why = "Batch mode trades latency for price and avoids the per-minute limits of realtime calls. Sending everything in realtime would hit the rate limits."
why_es = "El modo lote cambia latencia por precio y evita los límites por minuto de las llamadas realtime. Enviarlo todo en realtime chocaría con los límites."

[[quiz]]
q = "Your design passes every latency, error and cost goal with a hosted chat model. What has the simulator not checked?"
