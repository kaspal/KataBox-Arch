[[pitfalls]]
title = "Hitting the tokens-per-minute limit"
title_es = "Chocar con el límite de tokens por minuto"
body = "The design checks requests per minute but sends long prompts. Tokens per minute run out first, and the provider answers with rate-limit errors at peak."
body_es = "El diseño comprueba las peticiones por minuto pero envía prompts largos. Los tokens por minuto se agotan antes, y el proveedor responde con errores de límite en el pico."
fix = "Compute tokens per minute at peak, shorten prompts, put a queue in front to smooth the rate, or self-host for steady high volume."
fix_es = "Calcula los tokens por minuto del pico, acorta los prompts, pon una cola delante para suavizar el ritmo, o usa modelos propios para un volumen alto y constante."

[[pitfalls]]
title = "A model call on the user's path"
title_es = "Una llamada al modelo en el camino del usuario"
body = "The page waits for a long generated answer. Decode time grows with the output length, so the request takes seconds and misses its latency goal."
body_es = "La página espera una respuesta generada larga. El tiempo de decodificación crece con la longitud de la salida, así que la petición tarda segundos y no cumple su objetivo de latencia."
fix = "Cap output tokens, stream the answer, or move the call to a worker and deliver the result later. Use batch mode when a deadline is enough."
fix_es = "Limita los tokens de salida, transmite la respuesta por partes, o pasa la llamada a un worker y entrega el resultado después. Usa el modo lote cuando baste con un plazo."

[[pitfalls]]
title = "Treating a fast answer as a good answer"
title_es = "Tomar una respuesta rápida por una buena respuesta"
body = "The design meets every latency and cost goal, but nobody checked what the model says. The simulator measures time and money only, never answer quality."
body_es = "El diseño cumple todos los objetivos de latencia y coste, pero nadie comprobó lo que dice el modelo. El simulador mide solo tiempo y dinero, nunca la calidad de la respuesta."
fix = "Plan an evaluation set and checks on the output, and say in the design how wrong answers are caught."
fix_es = "Planifica un conjunto de evaluación y controles sobre la salida, y di en el diseño cómo se detectan las respuestas incorrectas."

