[[sim]]
prop = "instances"
note = "Worker nodes in the cluster. More nodes run more tasks at once."
note_es = "Nodos de trabajo del clúster. Más nodos ejecutan más tareas a la vez."

[[sim]]
prop = "executors"
note = "Tasks one node runs in parallel."
note_es = "Tareas que un nodo ejecuta en paralelo."

[[sim]]
prop = "task_overhead_ms"
note = "Fixed time added to every task for scheduling and start-up. Many tiny tasks waste time on it."
note_es = "Tiempo fijo que se suma a cada tarea por planificación y arranque. Muchas tareas diminutas lo desperdician."

[[sim]]
prop = "salting"
note = "Splits each of the biggest, skewed tasks into this many pieces, so they spread over several executors."
note_es = "Divide cada una de las tareas más grandes y sesgadas en este número de piezas, para que se repartan entre varios ejecutores."

[[sim]]
prop = "speculation"
note = "Re-runs slow tasks on free executors near the end of the job. Helps with random stragglers, not with skew: a copy of a huge task is just as huge."
note_es = "Relanza las tareas lentas en ejecutores libres cerca del final del trabajo. Ayuda con rezagadas aleatorias, no con el sesgo: una copia de una tarea enorme es igual de enorme."

[[sim]]
prop = "spot_share"
note = "Share of nodes on cheaper, interruptible capacity. An interruption kills that node's executors and their tasks start again."
note_es = "Parte de los nodos en capacidad más barata e interrumpible. Una interrupción mata los ejecutores de ese nodo y sus tareas vuelven a empezar."

[[sim]]
prop = "checkpoint"
note = "When on, an interrupted task restarts from its last checkpoint instead of from zero."
note_es = "Si está activo, una tarea interrumpida se reanuda desde su último checkpoint en lugar de desde cero."

[[sim]]
cost = "per_instance_month"
note = "A monthly price per node, the same for every flavour. No spot discount is applied yet."
note_es = "Un precio mensual por nodo, igual para todos los sabores. Aún no se aplica descuento spot."

