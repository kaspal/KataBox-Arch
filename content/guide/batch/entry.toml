[[pitfalls]]
title = "Skew makes one task the whole job"
title_es = "El sesgo convierte una tarea en todo el trabajo"
body = "One key holds a big share of the data, so its task is many times larger than the rest. Every other executor finishes and sits idle while that one task runs, and the job misses its deadline."
body_es = "Una clave tiene una gran parte de los datos, así que su tarea es muchas veces mayor que las demás. Todos los demás ejecutores terminan y esperan ociosos mientras esa tarea sigue, y el trabajo no llega a su plazo."
fix = "Salt the hot keys so the biggest tasks are split across several executors. Adding nodes alone doesn't help."
fix_es = "Aplica salting a las claves calientes para que las tareas más grandes se repartan entre varios ejecutores. Añadir nodos por sí solo no ayuda."

[[pitfalls]]
title = "Speculation against skew"
title_es = "Especulación contra el sesgo"
body = "Speculation is turned on to fix a slow task caused by skew. The copy has the same amount of work, so it finishes no sooner and only burns an executor."
body_es = "Se activa la especulación para arreglar una tarea lenta causada por el sesgo. La copia tiene la misma cantidad de trabajo, así que no termina antes y solo gasta un ejecutor."
fix = "Use speculation for random stragglers, and salting for skew."
fix_es = "Usa la especulación para rezagadas aleatorias, y el salting para el sesgo."

[[pitfalls]]
title = "Spot nodes without checkpoints"
title_es = "Nodos spot sin checkpoints"
body = "Most nodes run on interruptible capacity to save money. Each interruption throws away the progress of its long tasks, which start again from zero, and the job runs past its deadline."
body_es = "La mayoría de los nodos usan capacidad interrumpible para ahorrar. Cada interrupción tira el progreso de sus tareas largas, que vuelven a empezar desde cero, y el trabajo se pasa de su plazo."
fix = "Turn on checkpoints, or keep a smaller share of nodes on spot."
fix_es = "Activa los checkpoints, o deja una parte menor de los nodos en spot."

