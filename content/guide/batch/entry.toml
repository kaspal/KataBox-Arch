[[quiz]]
q = "A job misses its deadline because one key holds most of the data. Which change helps most?"
q_es = "Un trabajo no llega a su plazo porque una clave tiene la mayor parte de los datos. ¿Qué cambio ayuda más?"
options = ["Turn on speculation", "Double the number of nodes", "Raise the task overhead", "Salt the hot key so its task is split"]
options_es = ["Activar la especulación", "Duplicar el número de nodos", "Subir el sobrecoste por tarea", "Aplicar salting a la clave caliente para dividir su tarea"]
answer = 3
why = "The job waits for its biggest task. Salting splits it over several executors. More nodes don't shrink that one task, and a speculative copy of it is just as big."
why_es = "El trabajo espera a su tarea más grande. El salting la reparte entre varios ejecutores. Más nodos no achican esa tarea, y una copia especulativa es igual de grande."

[[quiz]]
q = "A few tasks run slowly at random, on whatever node they land on. What fits best?"
q_es = "Unas pocas tareas van lentas al azar, en el nodo donde caigan. ¿Qué encaja mejor?"
options = ["Speculation, which re-runs slow tasks on free executors", "Salting", "Fewer executors per node", "Checkpoints"]
options_es = ["La especulación, que relanza las tareas lentas en ejecutores libres", "El salting", "Menos ejecutores por nodo", "Los checkpoints"]
answer = 0
why = "A random straggler finishes sooner as a fresh copy elsewhere. Salting is for tasks that are big because of the data, not slow by chance."
why_es = "Una rezagada aleatoria termina antes como copia nueva en otro sitio. El salting es para tareas grandes por los datos, no lentas por azar."

[[quiz]]
q = "Half the nodes are on spot capacity and get interrupted during a long job. What does checkpointing change?"
q_es = "La mitad de los nodos están en capacidad spot y se interrumpen durante un trabajo largo. ¿Qué cambia el checkpointing?"
options = ["Interruptions no longer happen", "Interrupted tasks resume from their last checkpoint instead of from zero", "Spot nodes cost the same as regular ones", "The job skips the interrupted tasks"]
options_es = ["Las interrupciones dejan de ocurrir", "Las tareas interrumpidas se reanudan desde su último checkpoint en lugar de desde cero", "Los nodos spot cuestan lo mismo que los normales", "El trabajo se salta las tareas interrumpidas"]
answer = 1
why = "Interruptions still kill executors, but the lost work is only what ran since the last checkpoint, so the job stays closer to its deadline."
why_es = "Las interrupciones siguen matando ejecutores, pero el trabajo perdido es solo lo hecho desde el último checkpoint, así que el trabajo se mantiene más cerca de su plazo."
