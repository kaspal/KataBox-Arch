kind = "batch"
one_liner = "A cluster that splits a large job into many tasks and runs them in parallel until the whole job is done."
one_liner_es = "Un clúster que divide un trabajo grande en muchas tareas y las ejecuta en paralelo hasta terminar el trabajo entero."

use_when = [
  "A large amount of data must be processed by a deadline, such as a nightly report",
  "Nobody waits for the result in a request",
  "The work splits into many independent pieces",
]
use_when_es = [
  "Hay que procesar una gran cantidad de datos antes de un plazo, como un informe nocturno",
  "Nadie espera el resultado dentro de una petición",
  "El trabajo se divide en muchas piezas independientes",
]
skip_when = [
  "Results are needed within seconds of each event, which calls for a stream processor",
  "The data is small enough for one server or one database query",
]
skip_when_es = [
  "Los resultados se necesitan segundos después de cada evento, lo que pide un procesador de streams",
  "Los datos son lo bastante pocos para un servidor o una consulta a la base de datos",
]

formula = "job time ≈ time until the last task finishes; parallel tasks = nodes × executors; each task = its share of the work + task overhead; skew makes a few tasks much bigger; salting splits the biggest; speculation re-runs slow tasks near the end; a spot interruption restarts its tasks from zero, or from the last checkpoint"
formula_es = "tiempo del trabajo ≈ tiempo hasta que termina la última tarea; tareas en paralelo = nodos × ejecutores; cada tarea = su parte del trabajo + sobrecoste por tarea; el sesgo hace algunas tareas mucho más grandes; el salting divide las más grandes; la especulación relanza las tareas lentas al final; una interrupción spot reinicia sus tareas desde cero, o desde el último checkpoint"

gains = [
  "Huge jobs finish in hours instead of days",
  "Adding nodes cuts the time, as long as the work spreads evenly",
  "Cheaper, interruptible capacity can run much of the work",
]
gains_es = [
  "Los trabajos enormes terminan en horas en lugar de días",
  "Añadir nodos reduce el tiempo, siempre que el trabajo se reparta bien",
  "Capacidad más barata e interrumpible puede hacer buena parte del trabajo",
]
costs = [
  "The job is only as fast as its slowest task",
  "Results are late by design: hours, not seconds",
  "Interrupted nodes lose work unless the job checkpoints",
]
costs_es = [
  "El trabajo va tan rápido como su tarea más lenta",
  "Los resultados llegan tarde por diseño: horas, no segundos",
  "Los nodos interrumpidos pierden trabajo salvo que el trabajo haga checkpoints",
]

works_with = ["object", "lakehouse", "warehouse", "scheduler", "sql"]
practice = []

