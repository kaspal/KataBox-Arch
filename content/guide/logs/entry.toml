[[pitfalls]]
title = "Logging everything at debug level"
title_es = "Registrarlo todo en nivel debug"
body = "Every request writes many lines. The log store costs more than the services it watches, and the useful lines drown in noise."
body_es = "Cada petición escribe muchas líneas. El almacén de logs cuesta más que los servicios que vigila, y las líneas útiles se ahogan en ruido."
fix = "Log at info in production, sample noisy paths, and keep counts in metrics instead."
fix_es = "Registra en nivel info en producción, muestrea las rutas ruidosas y deja los recuentos a las métricas."

[[pitfalls]]
title = "Logs without a request id"
title_es = "Logs sin id de petición"
body = "Lines from different services can't be joined, so following one failed request means guessing by timestamps."
body_es = "Las líneas de distintos servicios no se pueden unir, así que seguir una petición fallida obliga a adivinar por las marcas de tiempo."
fix = "Write structured logs that carry a request or trace id on every line."
fix_es = "Escribe logs estructurados que lleven un id de petición o de traza en cada línea."

[[pitfalls]]
title = "Personal data in logs"
title_es = "Datos personales en los logs"
body = "Emails, tokens or card numbers end up in log lines that many people can search and that are kept for weeks."
body_es = "Correos, tokens o números de tarjeta acaban en líneas de log que mucha gente puede buscar y que se guardan durante semanas."
fix = "Redact sensitive fields before they are written, and keep retention as short as the need allows."
fix_es = "Oculta los campos sensibles antes de escribirlos, y deja la retención tan corta como permita la necesidad."

