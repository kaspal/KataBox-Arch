  "Las ráfagas deben amortiguarse para suscriptores lentos",
  "Importa un orden estricto entre todos los mensajes",
]

formula = "publish acknowledged after the hop + publish latency; one copy goes straight to every subscriber, and the message completes when the slowest copy is done"
