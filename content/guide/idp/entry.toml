[[sim]]
prop = "login_ms"
note = "How long one sign-in takes at the provider."
note_es = "Lo que tarda un inicio de sesión en el proveedor."

[[sim]]
prop = "logins_per_s"
note = "The most sign-ins the provider accepts per second. Past it, sign-ins are refused."
note_es = "El máximo de inicios de sesión por segundo que acepta el proveedor. Por encima, se rechazan."

[[sim]]
prop = "verify_ms"
note = "How long one remote token check takes at the provider."
note_es = "Lo que tarda una comprobación remota de token en el proveedor."

[[sim]]
prop = "verify"
note = "Remote: every token check calls the provider. Local: the app checks tokens itself with cached signing keys, at no cost, and keeps working when the provider is down."
note_es = "Remota: cada comprobación de token llama al proveedor. Local: la aplicación comprueba los tokens con las claves de firma en caché, sin coste, y sigue funcionando cuando el proveedor cae."

[[sim]]
prop = "instances"
note = "Servers of a self-hosted provider such as Keycloak. Each adds capacity for sign-ins and checks."
note_es = "Servidores de un proveedor propio como Keycloak. Cada uno añade capacidad para inicios de sesión y comprobaciones."

[[sim]]
sim = "servers_per_instance"
note = "Requests one instance handles at the same time. Extra requests wait."
note_es = "Peticiones que una instancia atiende a la vez. Las demás esperan."

[[sim]]
cost = "per_million"
note = "Managed providers bill per million sign-ins, standing in for their price per monthly active user."
note_es = "Los proveedores gestionados cobran por millón de inicios de sesión, en lugar de su precio por usuario activo al mes."

[[sim]]
cost = "per_instance_month"
note = "Keycloak is self-hosted: a fixed monthly price per server and no fee per sign-in."
note_es = "Keycloak es propio: un precio mensual fijo por servidor y sin coste por inicio de sesión."

