[[quiz]]
q = "Your API checks every token by calling the identity provider. The provider has an outage. What fails?"
q_es = "Tu API comprueba cada token llamando al proveedor de identidad. El proveedor sufre una caída. ¿Qué falla?"
options = ["Only new sign-ins", "Sign-ins and every API call that needs a token check", "Nothing, because tokens already issued are still valid", "Only users who signed in during the outage"]
options_es = ["Solo los inicios de sesión nuevos", "Los inicios de sesión y cada llamada a la API que necesita comprobar un token", "Nada, porque los tokens ya emitidos siguen siendo válidos", "Solo los usuarios que iniciaron sesión durante la caída"]
answer = 1
why = "With remote verification every check depends on the provider. Verifying locally with cached signing keys keeps existing sessions working; only new sign-ins fail."
why_es = "Con verificación remota cada comprobación depende del proveedor. Verificar en local con las claves de firma en caché mantiene las sesiones existentes; solo fallan los inicios de sesión nuevos."

[[quiz]]
q = "Which design keeps token checks fast and cheap at high request rates?"
q_es = "¿Qué diseño mantiene rápidas y baratas las comprobaciones de token con muchas peticiones?"
options = ["Add more instances of the identity provider", "Make users sign in again on every request", "Cache the provider's answer per request in the database", "Verify tokens inside the app with the provider's cached signing keys"]
options_es = ["Añadir más instancias del proveedor de identidad", "Hacer que los usuarios inicien sesión en cada petición", "Guardar la respuesta del proveedor por petición en la base de datos", "Verificar los tokens dentro de la aplicación con las claves de firma del proveedor en caché"]
answer = 3
why = "A signed token can be checked locally without a network call. The provider is then only on the path for sign-ins, which are rare."
why_es = "Un token firmado se puede comprobar en local sin llamada de red. El proveedor queda entonces solo en el camino de los inicios de sesión, que son raros."

[[quiz]]
q = "What does local token verification give up compared with remote verification?"
q_es = "¿Qué se pierde con la verificación local de tokens frente a la remota?"
options = ["A revoked session can keep working until its token expires", "Tokens can no longer be signed", "Sign-ins become slower", "The app can no longer read the user's id"]
options_es = ["Una sesión revocada puede seguir funcionando hasta que caduque su token", "Los tokens ya no se pueden firmar", "Los inicios de sesión se vuelven más lentos", "La aplicación ya no puede leer el id del usuario"]
answer = 0
why = "The app trusts any valid signature until expiry, so revocation takes effect late. Short token lifetimes keep that window small. The simulator doesn't model this lag."
why_es = "La aplicación confía en cualquier firma válida hasta que caduca, así que la revocación llega tarde. Una vida corta del token reduce esa ventana. El simulador no modela este retraso."
