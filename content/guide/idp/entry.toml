[[pitfalls]]
title = "Every request calls the provider"
title_es = "Cada petición llama al proveedor"
body = "Token checks are remote, so each API call waits on the provider and counts against its limits. When the provider goes down, the whole API goes down with it, not just sign-in."
body_es = "Las comprobaciones de token son remotas, así que cada llamada a la API espera al proveedor y cuenta contra sus límites. Cuando el proveedor cae, cae toda la API con él, no solo el inicio de sesión."
fix = "Verify tokens locally with cached signing keys. Only sign-ins then depend on the provider."
fix_es = "Verifica los tokens en local con las claves de firma en caché. Así solo los inicios de sesión dependen del proveedor."

[[pitfalls]]
title = "A login surge hits the rate limit"
title_es = "Un pico de inicios de sesión choca con el límite"
body = "A big launch or a forced sign-out sends everyone to sign in at once. The provider refuses sign-ins above its rate limit and users see errors."
body_es = "Un gran lanzamiento o un cierre de sesión forzado manda a todos a iniciar sesión a la vez. El proveedor rechaza los inicios por encima de su límite y los usuarios ven errores."
fix = "Keep sessions long enough that sign-ins stay rare, avoid forcing everyone out at once, and plan the provider's limit for the peak."
fix_es = "Mantén sesiones lo bastante largas para que los inicios sean raros, evita echar a todos a la vez y planifica el límite del proveedor para el pico."

