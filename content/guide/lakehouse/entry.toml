kind = "lakehouse"
one_liner = "An open table format over files in object storage, so many engines can query one copy of the data."
one_liner_es = "Un formato de tabla abierto sobre archivos en almacenamiento de objetos, para que muchos motores consulten una sola copia de los datos."

use_when = [
  "Large volumes of events land continuously and must stay cheap to keep",
  "Several engines, such as a warehouse and batch jobs, read the same data",
  "Queries mostly filter by time, so partitions can skip most of the data",
]
use_when_es = [
  "Llegan grandes volúmenes de eventos de forma continua y deben ser baratos de guardar",
  "Varios motores, como un almacén y trabajos por lotes, leen los mismos datos",
  "Las consultas filtran sobre todo por tiempo, así que las particiones pueden saltarse la mayoría de los datos",
]
skip_when = [
  "The data is small enough for one SQL database or one warehouse's own tables",
  "The workload is single-row reads and updates for an app",
  "Nobody will look after compaction and the file layout",
]
skip_when_es = [
  "Los datos caben en una base SQL o en las tablas propias de un almacén",
  "La carga son lecturas y actualizaciones de filas sueltas para una aplicación",
  "Nadie va a cuidar la compactación y la disposición de los archivos",
]

formula = "a reader scans the files of the partitions its filter keeps (all of them with partitioning = none); scanned bytes set the read time in the warehouse or batch job, and every file adds open and list overhead; streaming ingest writes small files, and compaction rewrites them towards target_file_mb on its schedule"
formula_es = "un lector recorre los archivos de las particiones que conserva su filtro (todas con partitioning = none); los bytes recorridos fijan el tiempo de lectura en el almacén o el trabajo por lotes, y cada archivo añade sobrecarga de apertura y listado; la ingesta en streaming escribe archivos pequeños, y la compactación los reescribe hacia target_file_mb según su calendario"

gains = [
  "Storage at object-storage prices, far below a database's",
  "One copy of the data serves a warehouse, batch jobs and streaming",
  "Time partitions let most queries read a small slice",
]
gains_es = [
  "Almacenamiento a precio de almacenamiento de objetos, muy por debajo del de una base de datos",
  "Una sola copia de los datos sirve a un almacén, a trabajos por lotes y al streaming",
  "Las particiones por tiempo permiten que la mayoría de consultas lean una porción pequeña",
]
costs = [
  "Readers pay for a bad layout: no partitions or many small files make every query slower",
  "Compaction is extra work that someone must schedule",
  "It is not a database: no fast single-row lookups",
]
costs_es = [
  "Los lectores pagan una mala disposición: sin particiones o con muchos archivos pequeños, cada consulta es más lenta",
  "La compactación es trabajo extra que alguien debe programar",
  "No es una base de datos: no hay búsquedas rápidas de una fila",
]

works_with = ["warehouse", "batch", "object", "streamproc", "connector"]
practice = ["logs-pipeline", "ad-clicks"]

interview_tip = "Pick the partition column from the most common filter, say how compaction keeps files near the target size, and name which engines read the table."
interview_tip_es = "Elige la columna de partición según el filtro más común, explica cómo la compactación mantiene los archivos cerca del tamaño objetivo y nombra qué motores leen la tabla."

not_simulated = [
  "Schema evolution",
  "Time travel and snapshot expiry",
  "Commit conflicts between concurrent writers",
  "The growth of metadata files as commits pile up",
]
not_simulated_es = [
  "La evolución del esquema",
  "El viaje en el tiempo y la caducidad de instantáneas",
  "Los conflictos de confirmación entre escritores concurrentes",
  "El crecimiento de los archivos de metadatos al acumularse confirmaciones",
]

[[sim]]
prop = "partitioning"
note = "How the table is split by time. A query that filters by time reads only the partitions it needs; without partitions it reads everything."
note_es = "Cómo se divide la tabla por tiempo. Una consulta que filtra por tiempo lee solo las particiones que necesita; sin particiones lo lee todo."

[[sim]]
prop = "compaction"
note = "How often small files are merged. Without it, streaming ingest leaves many small files and each one adds read overhead."
note_es = "Cada cuánto se fusionan los archivos pequeños. Sin ella, la ingesta en streaming deja muchos archivos pequeños y cada uno añade sobrecarga de lectura."

[[sim]]
prop = "target_file_mb"
note = "The file size compaction aims for. Larger files mean fewer files to open per gigabyte read."
note_es = "El tamaño de archivo que busca la compactación. Archivos más grandes significan menos archivos que abrir por gigabyte leído."

[[sim]]
prop = "stored_tb"
note = "Terabytes in the table. It sets the storage bill and how much a full scan reads."
note_es = "Terabytes en la tabla. Fija la factura de almacenamiento y cuánto lee un recorrido completo."

[[sim]]
sim = "service_ms"
note = "Base time for the storage behind the table to answer one read request, as for object storage."
note_es = "Tiempo base para que el almacenamiento bajo la tabla responda a una petición de lectura, como en el almacenamiento de objetos."

[[sim]]
cost = "per_gb_month"
note = "The table is billed only for its stored data, at object-storage prices. Readers pay for their own compute."
note_es = "La tabla se cobra solo por los datos guardados, a precio de almacenamiento de objetos. Los lectores pagan su propio cómputo."

