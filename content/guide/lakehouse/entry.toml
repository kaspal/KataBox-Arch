[[quiz]]
q = "Dashboards always filter on the last day, and the lake table has partitioning set to none. Which change cuts their scan the most?"
q_es = "Los paneles siempre filtran por el último día, y la tabla del lago tiene partitioning en none. ¿Qué cambio reduce más su recorrido?"
options = ["Raise target_file_mb", "Partition the table by day", "Turn on hourly compaction"]
options_es = ["Subir target_file_mb", "Particionar la tabla por día", "Activar la compactación horaria"]
answer = 1
why = "Partitioning by day lets the reader skip every other day's files. Bigger files and compaction reduce the per-file overhead but still read the whole table."
why_es = "Particionar por día permite al lector saltarse los archivos de los demás días. Archivos más grandes y la compactación reducen la sobrecarga por archivo, pero se sigue leyendo toda la tabla."

[[quiz]]
q = "A stream writes into the table every few seconds and queries keep slowing down, though the data size grows slowly. What is the likely cause?"
q_es = "Un stream escribe en la tabla cada pocos segundos y las consultas se vuelven cada vez más lentas, aunque el volumen de datos crece despacio. ¿Cuál es la causa probable?"
options = ["The object store is throttling the table", "The partitions are too coarse", "The warehouse ran out of concurrency slots", "Many small files, because compaction is off"]
options_es = ["El almacén de objetos limita la tabla", "Las particiones son demasiado gruesas", "El almacén de datos se quedó sin huecos de concurrencia", "Muchos archivos pequeños, porque la compactación está apagada"]
answer = 3
why = "Each small write is a new file, and every file adds open and list overhead to each read. Compaction merges them towards the target size."
why_es = "Cada escritura pequeña es un archivo nuevo, y cada archivo añade sobrecarga de apertura y listado a cada lectura. La compactación los fusiona hacia el tamaño objetivo."

[[quiz]]
q = "What does the lakehouse table itself cost in the simulator?"
q_es = "¿Cuánto cuesta en el simulador la propia tabla del lakehouse?"
options = ["Its stored data at object-storage prices; the engines that read it bill their own compute", "A fixed fee per table plus each query", "Nothing: storage is included in the warehouse price"]
options_es = ["Sus datos guardados a precio de almacenamiento de objetos; los motores que la leen cobran su propio cómputo", "Una tarifa fija por tabla más cada consulta", "Nada: el almacenamiento va incluido en el precio del almacén"]
answer = 0
why = "A table format is files plus metadata in object storage. The warehouse or batch job that reads it is a separate card with its own price."
why_es = "Un formato de tabla son archivos más metadatos en almacenamiento de objetos. El almacén o el trabajo por lotes que la lee es otra tarjeta con su propio precio."
