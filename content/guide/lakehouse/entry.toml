[[pitfalls]]
title = "No partitions on a time-filtered table"
title_es = "Sin particiones en una tabla filtrada por tiempo"
body = "Every query asks for the last hour or day, but the table has no partitions. Each one scans the whole table, so reads get slower and pricier as data piles up."
body_es = "Cada consulta pide la última hora o el último día, pero la tabla no tiene particiones. Cada una recorre la tabla entera, así que las lecturas se vuelven más lentas y caras a medida que se acumulan datos."
fix = "Partition by day, or by hour for very large streams, matching the filter readers use."
fix_es = "Particiona por día, o por hora en streams muy grandes, según el filtro que usan los lectores."

[[pitfalls]]
title = "Streaming ingest without compaction"
title_es = "Ingesta en streaming sin compactación"
body = "A stream writes a small file every few seconds. After a week there are hundreds of thousands, and queries spend their time opening files instead of reading data."
body_es = "Un stream escribe un archivo pequeño cada pocos segundos. Al cabo de una semana hay cientos de miles, y las consultas pasan el tiempo abriendo archivos en lugar de leer datos."
fix = "Turn on hourly or daily compaction so files are merged towards the target size."
fix_es = "Activa la compactación horaria o diaria para que los archivos se fusionen hacia el tamaño objetivo."

[[pitfalls]]
title = "Partitions that are too fine"
title_es = "Particiones demasiado finas"
body = "Partitioning by hour on a modest stream leaves each partition with a few tiny files. Pruning works, but the file overhead comes back."
body_es = "Particionar por hora un stream modesto deja cada partición con unos pocos archivos diminutos. La poda funciona, pero la sobrecarga por archivo vuelve."
fix = "Use day partitions unless each hour holds enough data to fill files of the target size."
fix_es = "Usa particiones por día salvo que cada hora tenga datos suficientes para llenar archivos del tamaño objetivo."

