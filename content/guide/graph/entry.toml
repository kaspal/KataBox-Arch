[[quiz]]
q = "A recommendation query goes from two hops to three, and each user has about two hundred links. What happens to its cost?"
q_es = "Una consulta de recomendaciones pasa de dos saltos a tres, y cada usuario tiene unos doscientos vínculos. ¿Qué le pasa a su coste?"
options = ["It grows by about half, one more hop out of two", "It grows about two hundred times, because each hop multiplies the edges visited", "It stays the same, because a graph database follows links in constant time", "It drops, because the third hop is served from a replica"]
options_es = ["Crece más o menos la mitad, un salto más de dos", "Crece unas doscientas veces, porque cada salto multiplica las aristas visitadas", "Se queda igual, porque una base de datos de grafos sigue vínculos en tiempo constante", "Baja, porque el tercer salto lo sirve una réplica"]
answer = 1
why = "Edges visited add up as fan-out, fan-out squared, fan-out cubed. Each link is cheap to follow, but there are many more of them at every hop."
why_es = "Las aristas visitadas suman abanico, abanico al cuadrado, abanico al cubo. Cada vínculo es barato de seguir, pero en cada salto hay muchos más."

[[quiz]]
q = "A social graph gets many new follows per second and the leader is saturated. Which change helps?"
q_es = "Un grafo social recibe muchos seguimientos nuevos por segundo y el líder está saturado. ¿Qué cambio ayuda?"
options = ["Add read replicas joined by Replicate edges", "Raise edges per ms on the replicas", "Lower the failover time", "Absorb the writes with a queue and batch them into the leader"]
options_es = ["Añadir réplicas de lectura unidas con aristas Replicate", "Subir las aristas por ms en las réplicas", "Bajar el tiempo de failover", "Absorber las escrituras con una cola y agruparlas hacia el líder"]
answer = 3
why = "Writes only go to the leader, so replicas and faster reads don't help. Smoothing and batching the writes does."
why_es = "Las escrituras solo van al líder, así que las réplicas y las lecturas más rápidas no ayudan. Suavizar y agrupar las escrituras sí."

[[quiz]]
q = "The app reads one user profile by id. Is a graph database the right store for this?"
q_es = "La aplicación lee un perfil de usuario por su id. ¿Es una base de datos de grafos el almacén adecuado para esto?"
options = ["Not for that alone: a key lookup with no links to follow fits a key-value store or SQL", "Yes, because every user is a node", "Yes, because graph reads are always faster than SQL"]
options_es = ["No solo por eso: una búsqueda por clave sin vínculos que seguir encaja en un almacén clave-valor o en SQL", "Sí, porque cada usuario es un nodo", "Sí, porque las lecturas en un grafo siempre son más rápidas que en SQL"]
answer = 0
why = "A graph pays off when the query walks relationships. A single lookup by key gains nothing from it and adds a database to run."
why_es = "Un grafo compensa cuando la consulta recorre relaciones. Una sola búsqueda por clave no gana nada y añade una base de datos que operar."
