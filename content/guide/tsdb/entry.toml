[[quiz]]
q = "A team adds the user id as a label on a request-latency metric. What happens to the time-series database?"
q_es = "Un equipo añade el id de usuario como etiqueta en una métrica de latencia de peticiones. ¿Qué le pasa a la base de series temporales?"
options = ["Nothing: labels are free", "Queries get faster because they can filter by user", "Each user becomes a new series, and past the series limit writes slow down and then fail"]
options_es = ["Nada: las etiquetas son gratis", "Las consultas son más rápidas porque pueden filtrar por usuario", "Cada usuario se vuelve una serie nueva, y por encima del límite de series las escrituras se ralentizan y luego fallan"]
answer = 2
why = "Each distinct label combination is a series that must be indexed. Unbounded labels explode the count. Keep per-user detail in logs or traces."
why_es = "Cada combinación distinta de etiquetas es una serie que hay que indexar. Las etiquetas sin límite disparan el número. Deja el detalle por usuario en logs o trazas."

[[quiz]]
q = "Fifty thousand sensors each send four points a second. One instance takes a fifth of that. What is the first fix?"
q_es = "Cincuenta mil sensores envían cuatro puntos por segundo cada uno. Una instancia admite una quinta parte de eso. ¿Cuál es la primera solución?"
options = ["Raise the series limit", "Add instances so total points per second cover the load", "Lower the retention", "Add a read replica"]
options_es = ["Subir el límite de series", "Añadir instancias para que el total de puntos por segundo cubra la carga", "Reducir la retención", "Añadir una réplica de lectura"]
answer = 1
why = "The bottleneck is ingest rate, which scales with instances. Series limits, retention and read replicas don't add write capacity."
why_es = "El cuello de botella es la velocidad de ingesta, que escala con las instancias. El límite de series, la retención y las réplicas de lectura no añaden capacidad de escritura."

[[quiz]]
q = "Which workload fits a time-series database best?"
q_es = "¿Qué carga encaja mejor en una base de series temporales?"
options = ["Server CPU and memory every ten seconds, charted over the last day", "A shopping cart updated on every click", "User profiles looked up by email", "Order history joined with customers and products"]
options_es = ["CPU y memoria de servidores cada diez segundos, en gráficos del último día", "Un carrito de compra actualizado en cada clic", "Perfiles de usuario buscados por correo", "Historial de pedidos unido con clientes y productos"]
answer = 0
why = "Append-only timestamped points with bounded labels, read by time range, is exactly the shape it is built for. The others are records that get updated or joined."
why_es = "Puntos con marca de tiempo que solo se añaden, con etiquetas acotadas, leídos por rango de tiempo, es justo la forma para la que está hecha. Los demás son registros que se actualizan o se unen."
