[[pitfalls]]
title = "A cardinality explosion"
title_es = "Una explosión de cardinalidad"
body = "Someone adds a user id or request id as a label. Every value creates a new series, the series count passes the limit, and writes slow down and then fail for everyone."
body_es = "Alguien añade un id de usuario o de petición como etiqueta. Cada valor crea una serie nueva, el número de series supera el límite, y las escrituras se ralentizan y luego fallan para todos."
fix = "Keep labels to bounded sets such as region, host or status, and send per-request detail to logs or traces."
fix_es = "Limita las etiquetas a conjuntos acotados como región, host o estado, y manda el detalle por petición a logs o trazas."

[[pitfalls]]
title = "Undersized ingest"
title_es = "Ingesta insuficiente"
body = "A fleet of devices reports every second and the points per second exceed one node's capacity. Writes queue, then fail, and data is lost in gaps."
body_es = "Una flota de dispositivos informa cada segundo y los puntos por segundo superan la capacidad de un nodo. Las escrituras se encolan, luego fallan, y se pierden datos en huecos."
fix = "Add instances, or put a stream in front to absorb bursts and write in batches."
fix_es = "Añade instancias, o pon un stream delante para absorber ráfagas y escribir por lotes."

[[pitfalls]]
title = "Dashboards over a year of raw points"
title_es = "Paneles sobre un año de puntos en bruto"
body = "A dashboard asks for a whole year at full resolution on each refresh. Long range queries are slow and compete with ingest."
body_es = "Un panel pide un año entero a resolución completa en cada actualización. Las consultas de rango largo son lentas y compiten con la ingesta."
fix = "Query short spans by default, and keep downsampled rollups for long ones."
fix_es = "Consulta periodos cortos por defecto y guarda agregados de menor resolución para los largos."

