kind = "tsdb"
one_liner = "A database built for a firehose of timestamped points and queries over time ranges."
one_liner_es = "Una base de datos hecha para un torrente de puntos con marca de tiempo y consultas sobre rangos de tiempo."

use_when = [
  "Devices, servers or apps send measurements every few seconds",
  "Writes far outnumber reads, and reads ask for a time range",
  "Old data can be dropped or downsampled after a while",
]
use_when_es = [
  "Dispositivos, servidores o aplicaciones envían mediciones cada pocos segundos",
  "Las escrituras superan con mucho a las lecturas, y las lecturas piden un rango de tiempo",
  "Los datos antiguos pueden borrarse o reducirse pasado un tiempo",
]
skip_when = [
  "Each record is a business entity that gets updated, such as an order or a user",
  "The data has unbounded labels such as user ids or request ids",
  "The question is ad-hoc analytics over many dimensions: a warehouse fits better",
]
skip_when_es = [
  "Cada registro es una entidad de negocio que se actualiza, como un pedido o un usuario",
  "Los datos tienen etiquetas sin límite, como ids de usuario o de petición",
  "La pregunta es analítica libre sobre muchas dimensiones: encaja mejor un almacén de datos",
]

formula = "ingest is capped at points_per_s per instance; past series_limit distinct series, writes slow down and then are refused; a range query costs service time plus more for each extra span of time it covers"
formula_es = "la ingesta tiene un tope de points_per_s por instancia; por encima de series_limit series distintas, las escrituras se ralentizan y luego se rechazan; una consulta de rango cuesta el tiempo de servicio más un extra por cada tramo de tiempo adicional que cubre"

gains = [
  "Takes hundreds of thousands of points a second on modest hardware",
  "Time-range queries over recent data are fast",
  "Retention rules keep storage bounded",
]
gains_es = [
  "Admite cientos de miles de puntos por segundo con hardware modesto",
  "Las consultas por rango de tiempo sobre datos recientes son rápidas",
  "Las reglas de retención mantienen el almacenamiento acotado",
]
costs = [
  "A high-cardinality label can explode the number of series and stall ingestion",
  "Queries over long spans are slow",
  "Poor at updates and at looking up single business records",
]
costs_es = [
  "Una etiqueta de alta cardinalidad puede disparar el número de series y frenar la ingesta",
  "Las consultas sobre periodos largos son lentas",
  "Malo para actualizaciones y para buscar registros de negocio sueltos",
]

works_with = ["metrics", "mqtt", "stream", "app", "worker"]
practice = []

interview_tip = "Estimate points per second and the number of distinct series, keep unbounded ids out of the labels, and say how long raw data is kept before downsampling."
interview_tip_es = "Estima los puntos por segundo y el número de series distintas, deja los ids sin límite fuera de las etiquetas y di cuánto tiempo se guardan los datos en bruto antes de reducirlos."

not_simulated = [
  "Retention and downsampling jobs (retention_days is a design note only)",
  "Compression and on-disk size",
  "Query language features such as rates, joins and alerting rules",
]
not_simulated_es = [
  "Los trabajos de retención y reducción de resolución (retention_days es solo una nota de diseño)",
  "La compresión y el tamaño en disco",
  "Las funciones del lenguaje de consulta, como tasas, uniones y reglas de alerta",
]

[[sim]]
prop = "instances"
note = "Nodes that share the ingest. Each one adds its own points per second."
note_es = "Nodos que se reparten la ingesta. Cada uno añade sus propios puntos por segundo."

[[sim]]
prop = "points_per_s"
note = "Points one instance can write each second. Past it, writes queue and then fail."
note_es = "Puntos que una instancia puede escribir por segundo. Por encima, las escrituras se encolan y luego fallan."

[[sim]]
prop = "series_limit"
note = "Distinct series the database can index. Above it writes slow down, and then new series are refused."
note_es = "Series distintas que la base puede indexar. Por encima, las escrituras se ralentizan y luego se rechazan las series nuevas."

[[sim]]
prop = "service_ms"
note = "Base time for a write or a short range query. Longer spans add to it."
note_es = "Tiempo base de una escritura o de una consulta de rango corta. Los periodos más largos suman."

[[sim]]
sim = "failover_s"
note = "With a replica wired by Replicate, how long until it takes over from a dead primary."
note_es = "Con una réplica unida por Replicate, cuánto tarda en sustituir a una principal caída."

[[sim]]
cost = "per_instance_month"
note = "A fixed monthly price per node for InfluxDB, TimescaleDB or Mimir."
note_es = "Un precio mensual fijo por nodo para InfluxDB, TimescaleDB o Mimir."

[[sim]]
cost = "per_million_write"
note = "Timestream has no node fee: it bills the points written."
note_es = "Timestream no cobra por nodo: cobra los puntos escritos."

[[sim]]
cost = "per_million"
note = "Timestream also bills each query."
note_es = "Timestream también cobra cada consulta."

