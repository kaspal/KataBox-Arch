kind = "streamproc"
one_liner = "A job that reads a stream without stopping and turns events into running results, such as counts per minute."
one_liner_es = "Un trabajo que lee un stream sin parar y convierte los eventos en resultados continuos, como recuentos por minuto."

use_when = [
  "Results must stay fresh within seconds, not after a nightly batch",
  "You aggregate events over time windows, such as clicks per ad per minute",
  "Each event needs state about earlier events with the same key",
]
use_when_es = [
  "Los resultados deben estar al día en segundos, no tras un lote nocturno",
  "Agregas eventos en ventanas de tiempo, como clics por anuncio por minuto",
  "Cada evento necesita estado sobre eventos anteriores con la misma clave",
]
skip_when = [
  "A result an hour late is fine: a batch job is simpler and cheaper",
  "Each event is handled on its own, with no windows or state: a plain consumer is enough",
  "The volume is small enough for one database query on a schedule",
]
skip_when_es = [
  "Un resultado con una hora de retraso sirve: un trabajo por lotes es más simple y barato",
  "Cada evento se trata por separado, sin ventanas ni estado: basta un consumidor simple",
  "El volumen es tan pequeño que basta una consulta a la base de datos programada",
]

formula = "throughput = min(slots, partitions) × records per s per slot; completion = processing + window length + watermark (results leave when the window closes); events later than allowed lateness are counted late; state = open keys × state per key, slower past memory; a crash replays from the last checkpoint"
formula_es = "rendimiento = mín(huecos, particiones) × registros por s por hueco; finalización = procesamiento + longitud de ventana + marca de agua (los resultados salen al cerrar la ventana); los eventos más tardíos que el retraso permitido cuentan como tardíos; estado = claves abiertas × estado por clave, más lento si supera la memoria; una caída reprocesa desde el último checkpoint"

gains = [
  "Fresh aggregates within seconds of the events",
  "State lives next to the computation, so no database round trip per event",
  "A crash loses no progress older than the last checkpoint",
]
gains_es = [
  "Agregados frescos a los pocos segundos de los eventos",
  "El estado vive junto al cálculo, así que no hay viaje a la base de datos por evento",
  "Una caída no pierde progreso anterior al último checkpoint",
]
costs = [
  "A window delays every result by its length plus the watermark",
  "Replay after a crash sends duplicates to a sink without dedup",
  "Parallelism can't exceed the stream's partitions",
  "Windows, watermarks and state are hard to reason about and test",
]
costs_es = [
  "Una ventana retrasa cada resultado su longitud más la marca de agua",
  "El reprocesado tras una caída envía duplicados a un destino sin deduplicación",
  "El paralelismo no puede superar las particiones del stream",
  "Ventanas, marcas de agua y estado son difíciles de razonar y probar",
]

works_with = ["stream", "nosql", "warehouse", "tsdb", "cache", "mqtt"]
practice = []

interview_tip = "Name the window, the watermark and what happens to a late event, then say how a restart avoids double counting at the sink."
interview_tip_es = "Nombra la ventana, la marca de agua y qué pasa con un evento tardío, y luego di cómo un reinicio evita contar dos veces en el destino."

not_simulated = [
  "End-to-end exactly-once transactions: the simulator counts the duplicates a replay sends instead, so you see what a sink without dedup receives",
  "Joins between streams or with tables",
  "Backpressure details between operators",
  "Savepoints and upgrading a running job",
]
not_simulated_es = [
  "Transacciones exactly-once de extremo a extremo: el simulador cuenta en su lugar los duplicados que envía un reprocesado, así ves lo que recibe un destino sin deduplicación",
  "Joins entre streams o con tablas",
