[[pitfalls]]
title = "More slots than partitions"
title_es = "Más huecos que particiones"
body = "The job falls behind, so instances are added. Nothing improves: each partition is read by one slot, and the extra slots have nothing to do."
body_es = "El trabajo se retrasa y se añaden instancias. No mejora nada: cada partición la lee un hueco, y los huecos extra no tienen nada que hacer."
fix = "Raise the stream's partitions first, then the slots to match."
fix_es = "Sube primero las particiones del stream, y luego los huecos para igualarlas."

[[pitfalls]]
title = "Duplicates after a crash"
title_es = "Duplicados tras una caída"
body = "A worker dies between checkpoints. The job restarts from the last checkpoint and sends the same results again, and a sink that just appends counts them twice."
body_es = "Un worker cae entre dos checkpoints. El trabajo se reinicia desde el último checkpoint y vuelve a enviar los mismos resultados, y un destino que solo añade los cuenta dos veces."
fix = "Write to the sink with an idempotent key (upsert by window and key), and checkpoint more often to shorten the replay."
fix_es = "Escribe en el destino con una clave idempotente (upsert por ventana y clave), y haz checkpoints más a menudo para acortar el reprocesado."

[[pitfalls]]
title = "A watermark too short"
title_es = "Una marca de agua demasiado corta"
body = "Mobile clients send events late. The window closes before they arrive, and many events are counted as late and left out of the totals."
body_es = "Los clientes móviles envían eventos con retraso. La ventana se cierra antes de que lleguen, y muchos eventos cuentan como tardíos y quedan fuera de los totales."
fix = "Lengthen the watermark or the allowed lateness to cover the usual delay, and accept results a little later."
fix_es = "Alarga la marca de agua o el retraso permitido para cubrir el retraso habitual, y acepta resultados un poco más tarde."

