[[sim]]
prop = "instances"
note = "Worker machines running the job. Together they provide the slots."
note_es = "Máquinas worker que ejecutan el trabajo. Entre todas aportan los huecos."

[[sim]]
prop = "concurrency"
note = "Parallel slots per instance. Slots beyond the stream's partitions sit idle."
note_es = "Huecos paralelos por instancia. Los huecos por encima de las particiones del stream quedan ociosos."

[[sim]]
prop = "records_per_s"
note = "Events one slot processes per second. Below the arrival rate, a backlog builds and results fall behind."
note_es = "Eventos que procesa un hueco por segundo. Por debajo del ritmo de llegada, se acumula trabajo pendiente y los resultados se retrasan."

[[sim]]
prop = "window"
note = "None handles each event at once. Tumbling cuts time into fixed blocks; sliding opens a new overlapping window every slide."
note_es = "Ninguna trata cada evento al momento. Fija corta el tiempo en bloques fijos; deslizante abre una ventana solapada nueva en cada deslizamiento."

[[sim]]
prop = "window_s"
note = "The length of a window. Its result leaves only when the window closes, so this adds to completion time."
note_es = "La longitud de una ventana. Su resultado solo sale al cerrarse la ventana, así que esto se suma al tiempo de finalización."

[[sim]]
prop = "slide_s"
note = "How often a sliding window starts. Each event belongs to several windows, so state grows."
note_es = "Cada cuánto empieza una ventana deslizante. Cada evento pertenece a varias ventanas, así que el estado crece."

[[sim]]
prop = "watermark_s"
note = "How long the job waits for stragglers before it closes a window. Longer is more complete but later."
note_es = "Cuánto espera el trabajo a los rezagados antes de cerrar una ventana. Más largo es más completo pero más tarde."

[[sim]]
prop = "allowed_lateness_s"
note = "Extra time after the watermark in which a late event still updates its window. Later events are counted as late, not silently lost."
note_es = "Tiempo extra tras la marca de agua en que un evento tardío aún actualiza su ventana. Los eventos más tardíos cuentan como tardíos, no se pierden en silencio."

[[sim]]
prop = "checkpoint_s"
note = "How often the job saves its state and position. After a crash it replays every event since the last checkpoint."
note_es = "Cada cuánto guarda el trabajo su estado y su posición. Tras una caída reprocesa todos los eventos desde el último checkpoint."

[[sim]]
prop = "state_kb"
note = "State held per key while its window is open. Open keys times this is the state the job holds."
note_es = "Estado que se guarda por clave mientras su ventana está abierta. Las claves abiertas por este valor es el estado que guarda el trabajo."

[[sim]]
prop = "memory_gb"
note = "Memory per instance for state. State beyond it spills and slows processing."
note_es = "Memoria por instancia para el estado. El estado que la supera se desborda y frena el procesamiento."

[[sim]]
sim = "service_ms"
note = "The fixed time to handle one event outside any window."
note_es = "El tiempo fijo para tratar un evento fuera de cualquier ventana."

[[sim]]
cost = "per_instance_month"
note = "A fixed monthly price per worker machine, whatever the flavour."
note_es = "Un precio mensual fijo por máquina worker, sea cual sea la variante."

