[[quiz]]
q = "A stream has eight partitions and the processor has four instances with four slots each. It still falls behind. What helps?"
q_es = "Un stream tiene ocho particiones y el procesador tiene cuatro instancias con cuatro huecos cada una. Sigue retrasándose. ¿Qué ayuda?"
options = ["Add more instances", "Raise the partitions of the stream so the idle slots get work", "Shorten the checkpoint interval", "Switch the window from tumbling to sliding"]
options_es = ["Añadir más instancias", "Subir las particiones del stream para que los huecos ociosos tengan trabajo", "Acortar el intervalo de checkpoint", "Cambiar la ventana de fija a deslizante"]
answer = 1
why = "Parallelism is capped by the partitions: only eight of the sixteen slots are reading. More instances add more idle slots."
why_es = "El paralelismo tiene el tope de las particiones: solo ocho de los dieciséis huecos están leyendo. Más instancias añaden más huecos ociosos."

[[quiz]]
q = "A job counts clicks per minute and writes each total by appending a row. A worker crashes between checkpoints. What does the sink see?"
q_es = "Un trabajo cuenta clics por minuto y escribe cada total añadiendo una fila. Un worker cae entre dos checkpoints. ¿Qué ve el destino?"
options = ["Nothing unusual: the processor guarantees each result once", "Some minutes are missing for good", "The job stops until someone restarts it by hand", "Some totals written twice, because the job replays events since the last checkpoint"]
options_es = ["Nada raro: el procesador garantiza cada resultado una vez", "Faltan algunos minutos para siempre", "El trabajo se detiene hasta que alguien lo reinicia a mano", "Algunos totales escritos dos veces, porque el trabajo reprocesa los eventos desde el último checkpoint"]
answer = 3
why = "Recovery replays from the checkpoint, so results after it are sent again. An append-only sink keeps both; an upsert by window and key does not."
why_es = "La recuperación reprocesa desde el checkpoint, así que los resultados posteriores se envían otra vez. Un destino que solo añade guarda los dos; un upsert por ventana y clave no."

[[quiz]]
q = "A dashboard must show ad clicks within a few seconds. The design uses a one-hour tumbling window. What is the problem?"
q_es = "Un panel debe mostrar los clics en anuncios en pocos segundos. El diseño usa una ventana fija de una hora. ¿Cuál es el problema?"
options = ["Each result leaves only when its hour closes, so the dashboard is up to an hour behind", "Tumbling windows lose the events at the edges", "One-hour windows need more partitions"]
options_es = ["Cada resultado solo sale cuando cierra su hora, así que el panel va hasta una hora por detrás", "Las ventanas fijas pierden los eventos de los bordes", "Las ventanas de una hora necesitan más particiones"]
answer = 0
why = "A window adds its length plus the watermark to completion. Use short windows, or a sliding window with a small slide, to meet a freshness goal of seconds."
why_es = "Una ventana suma su longitud más la marca de agua a la finalización. Usa ventanas cortas, o una ventana deslizante con un deslizamiento pequeño, para cumplir un objetivo de frescura de segundos."
