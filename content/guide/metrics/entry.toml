[[sim]]
cost = "per_instance_month"
note = "A fixed monthly price for the metrics stack. Retention is a design note and doesn't change the price here."
note_es = "Un precio mensual fijo por la pila de métricas. La retención es una nota de diseño y aquí no cambia el precio."

[[pitfalls]]
title = "High-cardinality labels"
title_es = "Etiquetas de alta cardinalidad"
body = "A label such as a user id or a full URL creates a new series for every value, and the metrics store runs out of memory."
body_es = "Una etiqueta como un id de usuario o una URL completa crea una serie nueva por cada valor, y el almacén de métricas se queda sin memoria."
fix = "Keep labels to small, fixed sets such as route, status and region, and put per-request detail in logs or traces."
fix_es = "Limita las etiquetas a conjuntos pequeños y fijos como ruta, estado y región, y deja el detalle por petición a los logs o las trazas."

[[pitfalls]]
title = "Averages that hide the tail"
title_es = "Medias que ocultan la cola"
body = "Mean latency looks fine while a small share of users wait many times longer."
body_es = "La latencia media parece bien mientras una pequeña parte de los usuarios espera muchas veces más."
fix = "Record histograms and alert on high percentiles, not on the mean."
fix_es = "Registra histogramas y pon alertas sobre percentiles altos, no sobre la media."

