[[quiz]]
q = "A dashboard query reads the last day of events, but the events table isn't partitioned. What does the warehouse do?"
q_es = "Una consulta de un panel lee el último día de eventos, pero la tabla de eventos no está particionada. ¿Qué hace el almacén?"
options = ["It scans the whole table, so the query is slow and costs as much as reading everything", "It reads only the last day, because the filter is on time", "It refuses the query until the table is partitioned"]
options_es = ["Recorre toda la tabla, así que la consulta es lenta y cuesta como leerlo todo", "Lee solo el último día, porque el filtro es por tiempo", "Rechaza la consulta hasta que la tabla se particione"]
answer = 0
why = "Without partitions the engine can't skip data by time, so it scans every file. Partitioning by day lets it prune to one day."
why_es = "Sin particiones el motor no puede saltarse datos por tiempo, así que recorre todos los archivos. Particionar por día le permite quedarse con un solo día."

[[quiz]]
q = "At the start of the workday, fifty analysts open dashboards at once and queries start waiting. Which change addresses the wait directly?"
q_es = "Al empezar la jornada, cincuenta analistas abren paneles a la vez y las consultas empiezan a esperar. ¿Qué cambio ataca la espera directamente?"
options = ["Raise overhead_ms", "Turn off the result cache", "Store the data in fewer, larger files", "Add a cluster or raise concurrency, and keep the result cache on"]
options_es = ["Subir overhead_ms", "Apagar la caché de resultados", "Guardar los datos en menos archivos más grandes", "Añadir un clúster o subir la concurrencia, y mantener la caché de resultados"]
answer = 3
why = "The queries wait for slots. More clusters or slots run more at once, and repeated dashboard queries served from the result cache don't need a slot for long."
why_es = "Las consultas esperan huecos. Más clústeres o huecos ejecutan más a la vez, y las consultas repetidas de los paneles servidas desde la caché de resultados apenas ocupan un hueco."

[[quiz]]
q = "A product page needs a customer's lifetime total in under fifty milliseconds. Where should it read it from?"
q_es = "Una página de producto necesita el total histórico de un cliente en menos de cincuenta milisegundos. ¿De dónde debería leerlo?"
options = ["The warehouse, with the result cache on", "A precomputed value in a cache or SQL table, refreshed from the warehouse", "The warehouse, with more clusters"]
options_es = ["Del almacén, con la caché de resultados activa", "De un valor precalculado en una caché o tabla SQL, actualizado desde el almacén", "Del almacén, con más clústeres"]
answer = 1
why = "Every warehouse query pays a fixed overhead, and each customer's query is different, so the cache rarely hits. Precompute in batch and serve from a fast store."
why_es = "Cada consulta al almacén paga una sobrecarga fija, y la de cada cliente es distinta, así que la caché casi nunca acierta. Precalcula por lotes y sirve desde un almacén rápido."
