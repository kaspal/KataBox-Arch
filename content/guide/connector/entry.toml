[[quiz]]
q = "The app writes each product to SQL and then to the search index. Sometimes the index write fails. What is the better design?"
q_es = "La aplicación escribe cada producto en SQL y luego en el índice de búsqueda. A veces falla la escritura en el índice. ¿Cuál es el mejor diseño?"
options = ["Retry the index write three times inside the request", "Write to the index first, then to SQL", "Write only to SQL and let a change-capture connector update the index", "Rebuild the whole index every night"]
options_es = ["Reintentar la escritura en el índice tres veces dentro de la petición", "Escribir primero en el índice y luego en SQL", "Escribir solo en SQL y dejar que un conector de captura de cambios actualice el índice", "Reconstruir todo el índice cada noche"]
answer = 2
why = "With one write, the database is the source of truth and the connector carries every committed change from its log. The index is a little behind, but it doesn't drift."
why_es = "Con una sola escritura, la base de datos es la fuente de verdad y el conector lleva cada cambio confirmado desde su registro. El índice va un poco por detrás, pero no se desvía."

[[quiz]]
q = "A connector polls a CRM API every ten minutes. The goal is that new leads reach the warehouse within two minutes. What must change?"
q_es = "Un conector sondea la API de un CRM cada diez minutos. El objetivo es que los contactos nuevos lleguen al warehouse en dos minutos. ¿Qué debe cambiar?"
options = ["Add more connector instances", "Poll more often, within the API's rate limit", "Give the warehouse more concurrency"]
options_es = ["Añadir más instancias del conector", "Sondear más a menudo, dentro del límite de la API", "Dar más concurrencia al warehouse"]
answer = 1
why = "A change waits up to the poll interval before it moves at all. More workers or a faster warehouse can't shorten that wait."
why_es = "Un cambio espera hasta el intervalo de sondeo antes de moverse siquiera. Más workers o un warehouse más rápido no acortan esa espera."

[[quiz]]
q = "After a day-long outage a polling connector must catch up, and the API allows a few calls per second. What happens when you double the tasks?"
q_es = "Tras una caída de un día, un conector por sondeo debe ponerse al día, y la API permite unas pocas llamadas por segundo. ¿Qué pasa si duplicas las tareas?"
options = ["Catch-up time halves", "The API answers faster to more tasks", "The connector switches to change capture", "Little changes: the API's rate limit, not the tasks, caps the catch-up"]
options_es = ["El tiempo de recuperación se reduce a la mitad", "La API responde más rápido a más tareas", "El conector pasa a captura de cambios", "Cambia poco: el límite de la API, no las tareas, pone tope a la recuperación"]
answer = 3
why = "The rate limit belongs to the API account. Bigger pages per call or a higher limit help; more tasks only queue behind the same limit."
why_es = "El límite pertenece a la cuenta de la API. Ayudan páginas más grandes por llamada o un límite mayor; más tareas solo esperan tras el mismo límite."
