kind = "connector"
one_liner = "A pipe that copies data from a source to a sink, from a database's change log or by polling an API."
one_liner_es = "Una tubería que copia datos de un origen a un destino, desde el registro de cambios de una base de datos o sondeando una API."

use_when = [
  "Another system needs the changes made in your database, without the app writing twice",
  "Data from a SaaS tool must land in your warehouse or stream on a schedule",
  "You want a search index or cache kept in step with the source of truth",
]
use_when_es = [
  "Otro sistema necesita los cambios hechos en tu base de datos, sin que la aplicación escriba dos veces",
  "Los datos de una herramienta SaaS deben llegar a tu warehouse o stream de forma periódica",
  "Quieres un índice de búsqueda o una caché al día con la fuente de verdad",
]
skip_when = [
  "The reader needs the change in the same request: a sync call is the only way",
  "The data moves once, not continuously: a one-off script or export is simpler",
  "The source has no change log and no API, so there is nothing to connect to",
]
skip_when_es = [
  "Quien lee necesita el cambio en la misma petición: una llamada síncrona es la única forma",
  "Los datos se mueven una vez, no de forma continua: un script o una exportación puntual es más simple",
  "El origen no tiene registro de cambios ni API, así que no hay nada a lo que conectarse",
]

formula = "change capture: each committed change is read from the log and written to the sink, tasks in parallel; polling: every poll interval the connector fetches new rows within the API's requests per second; sync lag = wait for the next poll or log read + fetch + write"
formula_es = "captura de cambios: cada cambio confirmado se lee del registro y se escribe en el destino, con tareas en paralelo; sondeo: en cada intervalo el conector trae las filas nuevas dentro de las peticiones por segundo de la API; retraso de sincronización = espera a la siguiente lectura + obtención + escritura"

gains = [
  "The app writes once and other systems follow its changes",
  "No custom code to keep two stores in step",
  "The source can be a SaaS tool you can't change",
]
gains_es = [
  "La aplicación escribe una vez y otros sistemas siguen sus cambios",
  "Sin código propio para mantener dos almacenes al día",
  "El origen puede ser una herramienta SaaS que no puedes cambiar",
]
costs = [
  "The sink is always a little behind the source",
  "A polled API's rate limit caps how fast data can move",
  "It is one more moving part that can fall behind or stop",
]
costs_es = [
  "El destino siempre va un poco por detrás del origen",
  "El límite de peticiones de una API sondeada pone tope a la velocidad de los datos",
  "Es una pieza más que puede retrasarse o detenerse",
]

works_with = ["sql", "stream", "warehouse", "search", "external", "lakehouse"]
practice = []

interview_tip = "Say where the changes come from (a log or a poll), how far behind the sink may be, and what the sink does with a change it sees twice."
interview_tip_es = "Di de dónde salen los cambios (un registro o un sondeo), cuánto puede ir por detrás el destino y qué hace el destino con un cambio que ve dos veces."

not_simulated = [
  "Schema mapping between source and sink",
  "The initial snapshot of a large table before streaming starts",
  "Connector restarts and how offsets are stored and resumed",
]
not_simulated_es = [
  "La correspondencia de esquemas entre origen y destino",
  "La instantánea inicial de una tabla grande antes de empezar a transmitir",
  "Los reinicios del conector y cómo se guardan y retoman los offsets",
]

[[sim]]
prop = "instances"
note = "Worker machines that run the connector's tasks."
note_es = "Máquinas worker que ejecutan las tareas del conector."

[[sim]]
prop = "concurrency"
note = "Tasks per instance that copy data in parallel. More tasks move more rows at once, within the source's limits."
note_es = "Tareas por instancia que copian datos en paralelo. Más tareas mueven más filas a la vez, dentro de los límites del origen."

[[sim]]
prop = "poll_s"
note = "How often a polling connector asks the API for new rows. A change waits up to this long before it starts moving."
note_es = "Cada cuánto pregunta a la API un conector por sondeo si hay filas nuevas. Un cambio espera hasta este tiempo antes de empezar a moverse."

[[sim]]
prop = "api_rps"
note = "The source API's rate limit. The connector never calls faster, so a big backlog takes several rounds to drain."
note_es = "El límite de peticiones de la API de origen. El conector nunca llama más rápido, así que una gran cola pendiente tarda varias rondas en vaciarse."

[[sim]]
prop = "service_ms"
note = "Time to fetch and write one batch of changes."
note_es = "Lo que tarda en obtener y escribir un lote de cambios."

[[sim]]
cost = "per_instance_month"
note = "A fixed monthly price per worker for a self-hosted connector such as Kafka Connect, Debezium or Airbyte. Fivetran has no worker fee."
note_es = "Un precio mensual fijo por worker para un conector propio como Kafka Connect, Debezium o Airbyte. Fivetran no cobra por worker."

[[sim]]
cost = "per_million"
note = "Fivetran bills per million rows moved, a stand-in for its monthly active rows pricing."
note_es = "Fivetran cobra por millón de filas movidas, una aproximación a su precio por filas activas al mes."

