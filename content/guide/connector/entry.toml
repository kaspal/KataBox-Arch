[[pitfalls]]
title = "Dual writes instead of a connector"
title_es = "Escrituras dobles en lugar de un conector"
body = "The app writes to the database and then to the search index. When the second write fails, the two disagree and nothing notices."
body_es = "La aplicación escribe en la base de datos y luego en el índice de búsqueda. Cuando falla la segunda escritura, los dos discrepan y nadie se da cuenta."
fix = "Write only to the database and let a change-capture connector carry each committed change to the index."
fix_es = "Escribe solo en la base de datos y deja que un conector de captura de cambios lleve cada cambio confirmado al índice."

[[pitfalls]]
title = "A long poll interval"
title_es = "Un intervalo de sondeo largo"
body = "The SLO says new orders reach the warehouse within a minute, but the connector polls every five. Sync lag is often several minutes."
body_es = "El SLO dice que los pedidos nuevos llegan al warehouse en un minuto, pero el conector sondea cada cinco. El retraso de sincronización suele ser de varios minutos."
fix = "Poll more often if the API's rate limit allows it, or switch to change capture from the source's log."
fix_es = "Sondea más a menudo si el límite de la API lo permite, o pasa a captura de cambios desde el registro del origen."

[[pitfalls]]
title = "Rate limit behind a backlog"
title_es = "Límite de peticiones tras una cola pendiente"
body = "After an outage the connector has hours of changes to fetch, but the API allows only a few calls a second. Adding tasks doesn't help; the limit belongs to the API."
body_es = "Tras una caída, el conector tiene horas de cambios por traer, pero la API solo permite unas pocas llamadas por segundo. Añadir tareas no ayuda; el límite es de la API."
fix = "Fetch larger pages per call, ask the provider for a higher limit, or plan for the catch-up time in the SLO."
fix_es = "Trae páginas más grandes por llamada, pide al proveedor un límite mayor, o cuenta con el tiempo de recuperación en el SLO."

