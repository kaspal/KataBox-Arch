[[sim]]
prop = "shards"
note = "Each query goes to every shard and waits for the slowest. More shards mean fewer vectors to search in each."
note_es = "Cada consulta va a todos los shards y espera al más lento. Más shards significan menos vectores que buscar en cada uno."

[[sim]]
prop = "vectors_m"
note = "Millions of vectors stored, split evenly across the shards. Search time grows with the vectors per shard."
note_es = "Millones de vectores guardados, repartidos a partes iguales entre los shards. El tiempo de búsqueda crece con los vectores por shard."

[[sim]]
prop = "service_ms"
note = "Base time for one shard to answer, before the search itself."
note_es = "Tiempo base para que un shard responda, antes de la búsqueda en sí."

[[sim]]
sim = "servers_per_instance"
note = "Queries one shard runs at once before the rest wait."
note_es = "Consultas que un shard ejecuta a la vez antes de que el resto espere."

[[sim]]
sim = "failover_s"
note = "How long a shard is unavailable when its node fails, until a replica takes over."
note_es = "Cuánto tiempo no está disponible un shard cuando cae su nodo, hasta que una réplica toma el relevo."

[[sim]]
cost = "per_instance_month"
note = "A fixed monthly price per node for self-hosted flavours such as pgvector, Qdrant or Milvus."
note_es = "Un precio mensual fijo por nodo para los sabores propios como pgvector, Qdrant o Milvus."

[[sim]]
cost = "per_million"
note = "Pinecone bills read units per query instead of nodes."
note_es = "Pinecone cobra unidades de lectura por consulta en lugar de nodos."

[[sim]]
cost = "per_million_write"
note = "Pinecone bills write units per upsert."
note_es = "Pinecone cobra unidades de escritura por inserción."

