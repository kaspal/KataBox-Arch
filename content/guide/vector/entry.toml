[[quiz]]
q = "A vector store holds all its vectors in one shard, and search latency keeps rising as the collection grows. What helps most?"
q_es = "Un almacén vectorial guarda todos sus vectores en un shard, y la latencia de búsqueda sigue subiendo al crecer la colección. ¿Qué ayuda más?"
options = ["Raise top_k so each query finds more matches", "Add read replicas of the single shard", "Split the vectors across more shards", "Lower the dimension count"]
options_es = ["Subir top_k para que cada consulta encuentre más coincidencias", "Añadir réplicas de lectura del único shard", "Repartir los vectores en más shards", "Reducir el número de dimensiones"]
answer = 2
why = "Search time grows with the vectors per shard. More shards make each search smaller, and they run in parallel. Replicas add throughput, not a faster single search."
why_es = "El tiempo de búsqueda crece con los vectores por shard. Más shards hacen cada búsqueda más pequeña, y se ejecutan en paralelo. Las réplicas añaden rendimiento, no una búsqueda individual más rápida."

[[quiz]]
q = "A query fans out to eight shards. Seven answer quickly and one is slow. When does the user get results?"
q_es = "Una consulta se reparte a ocho shards. Siete responden rápido y uno es lento. ¿Cuándo recibe el usuario los resultados?"
options = ["When the slow shard answers too", "As soon as the seven fast shards answer", "After the average of the eight times"]
options_es = ["Cuando también responde el shard lento", "En cuanto responden los siete shards rápidos", "Tras la media de los ocho tiempos"]
answer = 0
why = "The nearest neighbours could be on any shard, so the query waits for all of them. The slowest shard sets the latency."
why_es = "Los vecinos más cercanos pueden estar en cualquier shard, así que la consulta los espera a todos. El shard más lento marca la latencia."

[[quiz]]
q = "Why is a vector store's answer called approximate?"
q_es = "¿Por qué se dice que la respuesta de un almacén vectorial es aproximada?"
options = ["The embeddings are rounded before they are stored", "Replicas may return older data", "The scores are random within a range", "The index skips most vectors to be fast, so it can miss a true nearest neighbour"]
options_es = ["Los embeddings se redondean antes de guardarse", "Las réplicas pueden devolver datos antiguos", "Las puntuaciones son aleatorias dentro de un rango", "El índice se salta la mayoría de vectores para ser rápido, así que puede perder un vecino realmente cercano"]
answer = 3
why = "An index such as HNSW walks a graph instead of comparing the query with every vector. It is fast but not exhaustive. The simulator models its speed, not its recall."
why_es = "Un índice como HNSW recorre un grafo en lugar de comparar la consulta con cada vector. Es rápido pero no exhaustivo. El simulador modela su velocidad, no su exhaustividad."
