[[pitfalls]]
title = "One huge shard"
title_es = "Un único shard enorme"
body = "All the vectors sit in one shard. Each query searches the whole collection, latency climbs as the data grows, and the node can't take more load."
body_es = "Todos los vectores están en un shard. Cada consulta busca en toda la colección, la latencia sube al crecer los datos y el nodo no admite más carga."
fix = "Split the vectors across more shards so each search is smaller, and add replicas for read throughput."
fix_es = "Reparte los vectores en más shards para que cada búsqueda sea más pequeña, y añade réplicas para el rendimiento de lectura."

[[pitfalls]]
title = "Asking for too many neighbours"
title_es = "Pedir demasiados vecinos"
body = "Every query asks for hundreds of results to re-rank later. Search time grows with top_k on every shard, and most of the results are thrown away."
body_es = "Cada consulta pide cientos de resultados para reordenarlos después. El tiempo de búsqueda crece con top_k en cada shard, y la mayoría de resultados se descartan."
fix = "Keep top_k close to what the page shows, or re-rank a small candidate set."
fix_es = "Mantén top_k cerca de lo que muestra la página, o reordena un conjunto pequeño de candidatos."

[[pitfalls]]
title = "Embedding on the read path for every query"
title_es = "Calcular el embedding en cada lectura"
body = "Each search first calls a model to embed the query, so the model's latency and rate limits add to every search."
body_es = "Cada búsqueda llama primero a un modelo para calcular el embedding de la consulta, así que la latencia y los límites del modelo se suman a cada búsqueda."
fix = "Cache embeddings of common queries, and embed documents ahead of time on the write path with a worker."
fix_es = "Guarda en caché los embeddings de las consultas frecuentes, y calcula los de los documentos de antemano en el camino de escritura con un worker."

