[[pitfalls]]
title = "Too few workers for the peak"
title_es = "Muy pocos workers para el pico"
body = "Jobs arrive faster than the pool can run them. Nothing fails at first, but the backlog grows every second and completion times climb."
body_es = "Los trabajos llegan más rápido de lo que el grupo puede ejecutarlos. Al principio nada falla, pero la cola acumulada crece cada segundo y los tiempos de finalización suben."
fix = "Size the pool for the peak, or wrap it in an Autoscaling zone with a maximum high enough for the burst."
fix_es = "Dimensiona el grupo para el pico, o mételo en una zona de Autoescalado con un máximo suficiente para el pico."
seen_in = "online-judge"

[[pitfalls]]
title = "Jobs that are not safe to repeat"
title_es = "Trabajos que no se pueden repetir"
body = "A worker crashes after doing the work but before acknowledging it, so the job runs again: a second charge, a second email."
body_es = "Un worker cae después de hacer el trabajo pero antes de confirmarlo, así que el trabajo se ejecuta otra vez: un segundo cobro, un segundo correo."
fix = "Make jobs idempotent: give each one a key and skip work already recorded under it."
fix_es = "Haz los trabajos idempotentes: dale a cada uno una clave y sáltate el trabajo ya registrado con ella."

[[pitfalls]]
title = "Workers that overwhelm the database"
title_es = "Workers que desbordan la base de datos"
body = "Adding workers drains the queue faster, but every job also writes somewhere. Past a point the database becomes the bottleneck and jobs wait on it while holding their slots."
body_es = "Añadir workers vacía la cola más rápido, pero cada trabajo también escribe en algún sitio. A partir de cierto punto la base de datos se convierte en el cuello de botella y los trabajos la esperan sin soltar su hueco."
fix = "Check the store's capacity when you scale the pool, batch the writes, or cap the number of workers."
fix_es = "Comprueba la capacidad del almacén cuando escales el grupo, agrupa las escrituras o limita el número de workers."

