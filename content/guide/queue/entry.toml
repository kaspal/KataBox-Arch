kind = "queue"
one_liner = "A buffer that holds work until a consumer is free to do it."
one_liner_es = "Un búfer que guarda el trabajo hasta que un consumidor está libre para hacerlo."

use_when = [
  "The caller doesn't need the result to answer the user",
  "Traffic comes in bursts that the workers can't take at once",
  "The work is slow or calls an unreliable provider",
  "Each message should be handled by exactly one consumer",
]
use_when_es = [
  "Quien llama no necesita el resultado para responder al usuario",
  "El tráfico llega en ráfagas que los workers no pueden asumir de golpe",
  "El trabajo es lento o llama a un proveedor poco fiable",
  "Cada mensaje debe procesarlo un solo consumidor",
]
skip_when = [
  "The user is waiting for the answer in the same request",
  "Many independent consumers each need every message",
  "Consumers must re-read old messages later",
  "The work is fast and the load is steady",
]
skip_when_es = [
  "El usuario espera la respuesta en la misma petición",
  "Muchos consumidores independientes necesitan cada mensaje",
  "Los consumidores tienen que volver a leer mensajes antiguos",
  "El trabajo es rápido y la carga es estable",
]

formula = "publish acknowledged after the hop + publish latency; the message waits (up to max depth, else dropped) for any free consumer slot; a failure retries with doubling backoff up to max retries, then goes to a wired DLQ or is lost"
formula_es = "publicación confirmada tras el salto + latencia de publicación; el mensaje espera (hasta la profundidad máxima, si no se descarta) a un hueco libre de consumidor; un fallo reintenta con espera que se duplica hasta el máximo de reintentos, y luego va a una DLQ conectada o se pierde"

gains = [
  "The caller answers fast and is released at once",
  "Bursts become a backlog instead of errors",
  "Failed work is retried without the user noticing",
]
gains_es = [
  "Quien llama responde rápido y queda libre al momento",
  "Las ráfagas se convierten en una cola pendiente en lugar de errores",
  "El trabajo fallido se reintenta sin que el usuario lo note",
]
costs = [
  "The work finishes later, and the user can't see when",
  "A backlog can grow without limit if consumers are too few",
  "Messages can arrive twice, so consumers must be idempotent",
]
costs_es = [
  "El trabajo termina más tarde, y el usuario no ve cuándo",
  "La cola pendiente puede crecer sin límite si hay pocos consumidores",
  "Los mensajes pueden llegar dos veces, así que los consumidores deben ser idempotentes",
]

works_with = ["app", "worker", "dlq", "scheduler", "autoscale"]
practice = ["flash-sale", "job-scheduler", "notifications", "online-judge", "video-streaming", "web-crawler"]

interview_tip = "Say who publishes, who consumes, how many retries there are, and where a message goes when it keeps failing."
interview_tip_es = "Di quién publica, quién consume, cuántos reintentos hay y adónde va un mensaje que sigue fallando."

[[sim]]
prop = "max_depth"
note = "Messages the queue holds while they wait. A publish to a full queue is dropped and the caller gets an error."
note_es = "Mensajes que la cola guarda mientras esperan. Una publicación en una cola llena se descarta y quien llama recibe un error."

[[sim]]
prop = "max_retries"
note = "How many times a failed message is tried again, each wait twice the last. Then it goes to a wired DLQ, or is lost."
note_es = "Cuántas veces se vuelve a intentar un mensaje fallido, cada espera el doble que la anterior. Luego va a una DLQ conectada, o se pierde."

[[sim]]
sim = "service_ms"
note = "How long the broker takes to store a publish before it acknowledges it. SQS answers over HTTPS, so it is slower."
note_es = "Lo que tarda el broker en guardar una publicación antes de confirmarla. SQS responde por HTTPS, así que es más lento."

[[sim]]
cost = "per_instance_month"
note = "A fixed monthly price for the broker."
note_es = "Un precio mensual fijo por el broker."

[[sim]]
cost = "per_million"
note = "Plus a price for every million messages it accepts."
note_es = "Más un precio por cada millón de mensajes que acepta."

