[[pitfalls]]
title = "Segments for a conversation"
title_es = "Segmentos para una conversación"
body = "A live Q&A is delivered through a transcoder and segments. Viewers are several segments behind, so questions and answers no longer line up and the latency goal fails."
body_es = "Una sesión de preguntas en directo se entrega con un transcodificador y segmentos. Los espectadores van varios segmentos por detrás, así que preguntas y respuestas ya no encajan y no se cumple el objetivo de latencia."
fix = "Use an SFU for anyone who talks back, or shorten the segments when a few seconds are acceptable."
fix_es = "Usa una SFU para quien responde, o acorta los segmentos cuando unos segundos son aceptables."

[[pitfalls]]
title = "A transcoder for every viewer"
title_es = "Un transcodificador por espectador"
body = "The design sends every viewer to the media server. A transcoder handles channels, not viewers, and quickly runs out of capacity."
body_es = "El diseño manda a cada espectador al servidor de medios. Un transcodificador atiende canales, no espectadores, y se queda sin capacidad enseguida."
fix = "Transcode each channel once, put the segments in object storage, and let a CDN serve the viewers."
fix_es = "Transcodifica cada canal una vez, pon los segmentos en almacenamiento de objetos y deja que una CDN sirva a los espectadores."

