]

formula = "streams per instance ≤ capacity (forwarded streams for an SFU, transcoded channels for an encoder); glass-to-glass latency ≈ processing for an SFU, or about three segments + processing for segment-based delivery"
formula_es = "flujos por instancia ≤ capacidad (flujos reenviados en una SFU, canales transcodificados en un codificador); latencia de extremo a extremo ≈ procesado en una SFU, o unos tres segmentos + procesado en la entrega por segmentos"

gains = [
