[[quiz]]
q = "A team builds video calls for groups of six. Which mode fits?"
q_es = "Un equipo construye videollamadas para grupos de seis. ¿Qué modo encaja?"
options = ["Transcode with long segments", "SFU, which forwards streams with sub-second delay", "Transcode with short segments", "No media server: serve the video from a CDN"]
options_es = ["Transcode con segmentos largos", "SFU, que reenvía los flujos con retraso por debajo del segundo", "Transcode con segmentos cortos", "Sin servidor de medios: servir el vídeo desde una CDN"]
answer = 1
why = "A call is two-way, so it needs sub-second delay. Segment-based delivery keeps viewers several segments behind, even with short segments."
why_es = "Una llamada es bidireccional, así que necesita un retraso por debajo del segundo. La entrega por segmentos deja a los espectadores varios segmentos por detrás, incluso con segmentos cortos."

[[quiz]]
q = "A broadcast uses segment-based delivery and viewers are too far behind live. Which change lowers the delay most directly?"
q_es = "Una emisión usa entrega por segmentos y los espectadores van demasiado por detrás del directo. ¿Qué cambio reduce el retraso de forma más directa?"
options = ["Add more media server instances", "Add more renditions", "Put a load balancer in front", "Shorten the segment length"]
options_es = ["Añadir más instancias del servidor de medios", "Añadir más renditions", "Poner un balanceador delante", "Acortar la duración del segmento"]
answer = 3
why = "Players stay about three segments behind, so the segment length sets most of the delay. More instances add capacity, not speed."
why_es = "Los reproductores van unos tres segmentos por detrás, así que la duración del segmento marca la mayor parte del retraso. Más instancias añaden capacidad, no velocidad."

[[quiz]]
q = "A live event expects a million viewers of one channel. Where should the viewers be served from?"
q_es = "Un evento en directo espera un millón de espectadores de un canal. ¿Desde dónde se debe servir a los espectadores?"
options = ["A CDN, fed by one transcoded channel", "One SFU per viewer", "The transcoder directly", "A WebSocket gateway"]
options_es = ["Una CDN, alimentada por un canal transcodificado", "Una SFU por espectador", "Directamente el transcodificador", "Un gateway de WebSocket"]
answer = 0
why = "The transcoder works per channel. Its segments are ordinary files, so a CDN can serve any number of viewers."
why_es = "El transcodificador trabaja por canal. Sus segmentos son ficheros normales, así que una CDN puede servir a cualquier número de espectadores."
