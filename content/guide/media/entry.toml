[[sim]]
prop = "mode"
note = "SFU forwards streams as they come, with very low delay. Transcode re-encodes each channel and packages it into segments, which adds delay."
note_es = "SFU reenvía los flujos tal como llegan, con muy poco retraso. Transcode recodifica cada canal y lo empaqueta en segmentos, lo que añade retraso."

[[sim]]
prop = "streams_per_instance"
note = "Streams one instance handles: forwarded streams for an SFU, channels for an encoder. Past it, new streams are refused."
note_es = "Flujos que atiende una instancia: flujos reenviados en una SFU, canales en un codificador. Por encima, los flujos nuevos se rechazan."

[[sim]]
prop = "segment_s"
note = "Length of one segment in transcode mode. Players stay about three segments behind live, so shorter segments mean lower delay."
note_es = "Duración de un segmento en modo transcode. Los reproductores van unos tres segmentos por detrás del directo, así que segmentos más cortos dan menos retraso."

[[sim]]
prop = "instances"
note = "Media servers. Total stream capacity grows with them."
note_es = "Servidores de medios. La capacidad total de flujos crece con ellos."

[[sim]]
sim = "service_ms"
note = "Processing time a stream adds as it passes through the server, before any segment delay."
note_es = "Tiempo de procesado que añade un flujo al pasar por el servidor, antes de cualquier retraso por segmentos."

[[sim]]
cost = "per_instance_month"
note = "A monthly price per instance. A managed live encoder channel running all month costs far more than an SFU node."
note_es = "Un precio mensual por instancia. Un canal de codificación gestionado en marcha todo el mes cuesta mucho más que un nodo SFU."

