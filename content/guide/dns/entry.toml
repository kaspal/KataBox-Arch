[[pitfalls]]
title = "Expecting DNS failover to be instant"
title_es = "Esperar que la conmutación por DNS sea inmediata"
body = "Resolvers and clients keep a cached answer until its TTL ends, and some keep it longer. Users go on reaching the dead address for a while."
body_es = "Los resolvedores y los clientes guardan la respuesta cacheada hasta que acaba su TTL, y algunos más tiempo. Los usuarios siguen llegando a la dirección caída durante un rato."
fix = "Keep TTLs short on records you plan to fail over, and use a load balancer with health checks for fast failover inside a region."
fix_es = "Usa TTL cortos en los registros que pienses conmutar, y un balanceador con comprobaciones de salud para conmutar rápido dentro de una región."

[[pitfalls]]
title = "Very short TTLs everywhere"
title_es = "TTL muy cortos en todas partes"
body = "Short TTLs mean more lookups, a higher bill and extra latency for users whose resolver must ask again."
body_es = "Los TTL cortos traen más consultas, una factura mayor y más latencia para los usuarios cuyo resolvedor tiene que volver a preguntar."
fix = "Keep short TTLs for records that move, and long ones for records that stay put."
fix_es = "Deja los TTL cortos para los registros que cambian, y largos para los que no se mueven."

