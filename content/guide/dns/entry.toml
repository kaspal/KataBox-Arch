[[sim]]
sim = "service_ms"
note = "Time a lookup adds to each request that passes through. Clients cache answers, so this is only the resolver's reply."
note_es = "Lo que añade una consulta a cada petición que pasa. Los clientes cachean las respuestas, así que es solo la respuesta del resolvedor."

[[sim]]
sim = "servers_per_instance"
note = "Lookups answered at once. It is set high because a managed DNS service is not the bottleneck."
note_es = "Consultas atendidas a la vez. Es alto porque un DNS gestionado no es el cuello de botella."

[[sim]]
