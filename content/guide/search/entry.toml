[[pitfalls]]
title = "A hot shard"
title_es = "Una partición caliente"
body = "A few popular queries all land on the same shard. It saturates while the others idle, and adding shards spreads other keys but not the hot one."
body_es = "Unas pocas consultas populares caen todas en la misma partición. Se satura mientras las demás están ociosas, y añadir particiones reparte otras claves pero no la caliente."
fix = "Put a cache in front for the popular queries, so the index only sees the rare ones."
fix_es = "Pon una caché delante para las consultas populares, así el índice solo ve las raras."
seen_in = "typeahead"

[[pitfalls]]
title = "The index as the source of truth"
title_es = "El índice como fuente de verdad"
body = "Data written only to the search index is hard to rebuild after a bad mapping change or a lost cluster."
body_es = "Los datos escritos solo en el índice de búsqueda son difíciles de reconstruir tras un cambio de mapeo erróneo o la pérdida del clúster."
fix = "Keep the primary copy in a database and feed the index from it, so you can always reindex."
fix_es = "Guarda la copia principal en una base de datos y alimenta el índice desde ella, para poder reindexar siempre."

[[pitfalls]]
title = "Every keystroke hits the index"
title_es = "Cada pulsación llega al índice"
body = "Search-as-you-type sends a query per key press. A slow spell in the index, such as a rebuild, then slows every request."
body_es = "La búsqueda mientras escribes manda una consulta por cada tecla. Un momento lento del índice, como una reconstrucción, ralentiza entonces todas las peticiones."
fix = "Cache popular prefixes, debounce input on the client, and keep the index off the hot path where you can."
fix_es = "Cachea los prefijos populares, espera a que el usuario deje de teclear en el cliente, y saca el índice del camino caliente cuando puedas."

