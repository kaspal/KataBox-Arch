[[quiz]]
q = "Autoscaling grows the app from ten to sixty instances, each holding twenty database connections, and the database allows five hundred. What happens without a pooler?"
q_es = "El autoescalado lleva la aplicación de diez a sesenta instancias, cada una con veinte conexiones a la base, y la base admite quinientas. ¿Qué pasa sin pooler?"
options = ["The database queues the extra connections until some free up", "The new instances share the existing connections", "Connections above the limit fail, so many new instances can't reach the database"]
options_es = ["La base encola las conexiones sobrantes hasta que se liberan algunas", "Las instancias nuevas comparten las conexiones existentes", "Las conexiones por encima del límite fallan, así que muchas instancias nuevas no llegan a la base"]
answer = 2
why = "Sixty times twenty is far over the limit, and the database refuses new connections past it. A pooler shares a fixed pool among all instances."
why_es = "Sesenta por veinte supera de lejos el límite, y la base rechaza las conexiones nuevas por encima. Un pooler reparte un pool fijo entre todas las instancias."

[[quiz]]
q = "A pooler sits in front of the database, but the connection count on the database hasn't dropped at all. What is the likely cause?"
q_es = "Hay un pooler delante de la base, pero el número de conexiones en la base no ha bajado nada. ¿Cuál es la causa probable?"
options = ["The pool_size is too small", "The pooler runs in session mode", "The pooler adds too much delay", "The database's limit is too high"]
options_es = ["El pool_size es demasiado pequeño", "El pooler funciona en modo sesión", "El pooler añade demasiado retraso", "El límite de la base es demasiado alto"]
answer = 1
why = "In session mode a client keeps its server connection as long as it is connected, so nothing is shared. Transaction mode lends a connection only for each transaction."
why_es = "En modo sesión un cliente conserva su conexión de servidor mientras está conectado, así que no se comparte nada. El modo transacción presta una conexión solo durante cada transacción."

[[quiz]]
q = "After adding a pooler in transaction mode, latency at peak climbs and some calls are dropped, while the database is lightly loaded. What should you change?"
q_es = "Tras añadir un pooler en modo transacción, la latencia en el pico sube y algunas llamadas se descartan, mientras la base está poco cargada. ¿Qué deberías cambiar?"
options = ["Raise pool_size so more transactions run at once", "Switch to session mode", "Remove the pooler and connect directly", "Add read replicas to the database"]
options_es = ["Subir pool_size para que se ejecuten más transacciones a la vez", "Cambiar al modo sesión", "Quitar el pooler y conectar directamente", "Añadir réplicas de lectura a la base"]
answer = 0
why = "Calls are waiting for a pooled connection while the database has room. A bigger pool lets more through; session mode or no pooler brings back the connection wall."
why_es = "Las llamadas esperan una conexión del pool mientras la base tiene margen. Un pool mayor deja pasar más; el modo sesión o quitar el pooler devuelven el muro de conexiones."
