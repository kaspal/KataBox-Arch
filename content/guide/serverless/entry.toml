[[pitfalls]]
title = "Cold starts on a burst"
title_es = "Arranques en frío en un pico"
body = "Traffic jumps past anything seen before, so many requests at once wait for new instances to start, and the tail latency spikes."
body_es = "El tráfico salta por encima de todo lo visto antes, así que muchas peticiones a la vez esperan a que arranquen instancias nuevas, y la latencia de cola se dispara."
fix = "Keep some capacity warm before a known peak, trim the start-up work, or use always-on servers for the steady part of the load."
fix_es = "Mantén algo de capacidad caliente antes de un pico conocido, recorta el trabajo de arranque, o usa servidores siempre encendidos para la parte constante de la carga."

[[pitfalls]]
title = "A slow dependency eats the concurrency"
title_es = "Una dependencia lenta se come la concurrencia"
body = "Each invocation stays busy while it waits for its calls. When the database slows down, invocations pile up, hit the concurrency limit, and new requests are throttled."
body_es = "Cada invocación sigue ocupada mientras espera sus llamadas. Cuando la base de datos se vuelve lenta, las invocaciones se acumulan, llegan al límite de concurrencia y las peticiones nuevas se rechazan."
fix = "Set short timeouts on calls, keep the downstream fast, or put a queue in front so work waits instead of failing."
fix_es = "Pon tiempos de espera cortos en las llamadas, mantén rápido lo que hay detrás, o pon una cola delante para que el trabajo espere en lugar de fallar."

[[pitfalls]]
title = "Flooding the database"
title_es = "Inundar la base de datos"
body = "Functions scale far faster than a SQL database. Thousands of concurrent invocations can each want a connection, and the database runs out long before the functions do."
body_es = "Las funciones escalan mucho más rápido que una base de datos SQL. Miles de invocaciones simultáneas pueden querer cada una su conexión, y la base de datos se agota mucho antes que las funciones."
fix = "Lower the concurrency limit to what the database can take, use a connection pooler, or pick a store built for many clients."
fix_es = "Baja el límite de concurrencia a lo que aguante la base de datos, usa un gestor de conexiones, o elige un almacén pensado para muchos clientes."

