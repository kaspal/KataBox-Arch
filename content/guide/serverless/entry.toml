kind = "serverless"
one_liner = "Functions the cloud runs for you on demand, billed per request."
one_liner_es = "Funciones que la nube ejecuta por ti bajo demanda, cobradas por petición."

use_when = [
  "Traffic is spiky or low, with long quiet periods",
  "You want to pay nothing while nothing happens",
  "Handlers are short and keep no state between requests",
  "Glue work reacts to events: uploads, messages, schedules",
]
use_when_es = [
  "El tráfico va a picos o es bajo, con periodos largos de calma",
  "Quieres no pagar nada mientras no pasa nada",
  "Los manejadores son cortos y no guardan estado entre peticiones",
  "Trabajo de unión que reacciona a eventos: subidas, mensajes, horarios",
]
skip_when = [
  "Steady high traffic, where always-on servers cost less per request",
  "Every request needs a tight tail latency and cold starts would break it",
  "The work runs for a long time or holds long-lived connections",
  "A small database behind it cannot take a sudden flood of connections",
]
skip_when_es = [
  "Tráfico alto y constante, donde los servidores siempre encendidos cuestan menos por petición",
  "Cada petición necesita una latencia de cola ajustada y los arranques en frío la romperían",
  "El trabajo dura mucho o mantiene conexiones de larga duración",
  "Una base de datos pequeña detrás no aguanta una avalancha repentina de conexiones",
]

formula = "latency ≈ service time, plus a cold start each time concurrency climbs above its highest level so far; requests beyond the concurrency limit are throttled"
formula_es = "latencia ≈ tiempo de servicio, más un arranque en frío cada vez que la concurrencia sube por encima de su máximo hasta entonces; las peticiones por encima del límite de concurrencia se rechazan"

gains = [
  "No servers to size: capacity follows the traffic",
  "Zero cost when idle, since you pay per request",
  "Less to operate: patching and scaling are the provider's job",
]
gains_es = [
  "No hay servidores que dimensionar: la capacidad sigue al tráfico",
  "Coste cero en reposo, porque pagas por petición",
  "Menos que operar: los parches y el escalado son cosa del proveedor",
]
costs = [
  "Cold starts add latency when new instances are needed",
  "A hard concurrency limit: beyond it requests are throttled",
  "Expensive per request at high, steady load",
]
costs_es = [
  "Los arranques en frío añaden latencia cuando hacen falta instancias nuevas",
  "Un límite de concurrencia estricto: por encima, las peticiones se rechazan",
  "Cara por petición con carga alta y constante",
]

works_with = ["gateway", "queue", "nosql", "object", "pubsub"]
practice = []

interview_tip = "Say how you handle cold starts and the concurrency limit, and how the function reaches the database without exhausting its connections."
interview_tip_es = "Di cómo manejas los arranques en frío y el límite de concurrencia, y cómo llega la función a la base de datos sin agotar sus conexiones."

[[sim]]
prop = "concurrency_limit"
note = "The most requests running at once. It replaces instances times concurrency: there are no instances to set."
note_es = "El máximo de peticiones ejecutándose a la vez. Sustituye a instancias por concurrencia: no hay instancias que configurar."

[[sim]]
prop = "cold_start_ms"
note = "Added to a request that pushes concurrency above its highest level so far in the run. Warm instances then stay warm."
note_es = "Se suma a una petición que lleva la concurrencia por encima de su máximo hasta entonces en la ejecución. Después, las instancias calientes siguen calientes."

[[sim]]
prop = "service_ms"
note = "The median time of the function's own work, not counting the calls it makes."
note_es = "La mediana del trabajo propio de la función, sin contar las llamadas que hace."

[[sim]]
sim = "queue_per_server"
note = "Zero: past the limit there is only a very small buffer, then requests are throttled and fail."
note_es = "Cero: pasado el límite solo hay un búfer muy pequeño, y después las peticiones se rechazan y fallan."

[[sim]]
cost = "per_million"
note = "Priced per request only. There is no monthly charge for capacity."
note_es = "Se cobra solo por petición. No hay cargo mensual por capacidad."

