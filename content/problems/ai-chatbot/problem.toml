id = "ai-chatbot"
number = 1
set = 1
track = "ai"
difficulty = "easy"
title = "Support Chatbot"
title_es = "Chatbot de soporte"
teaches = "Size a hosted model's per-minute limits for your peak, and survive 429s and provider outages with client retries and a second provider"
teaches_es = "Dimensionar los límites por minuto de un modelo alojado para tu pico, y sobrevivir a los 429 y a las caídas del proveedor con reintentos en el cliente y un segundo proveedor"
tags = ["llm", "rate-limits", "retries", "fallback"]
requires = ["infer"]

[nfr]
peak_rps = 5
p95_ms = 12000
availability = 0.99
budget_usd = 100000

[[request_types]]
id = "chat"
name = "Send a chat message"
name_es = "Enviar un mensaje al chat"
share = 1.0
route = ["edge?", "compute", "model:chat"]
key_space = 100000
tokens_in = { mean = 800, p95 = 1600 }
tokens_out = { mean = 300, p95 = 600 }

# The statement's account tier (already raised for the launch, the top one): every hosted
# Model Inference card has it, whatever its own props say.
[[model_limits]]
flavour = "claude_api"
rpm = 4000
tpm = 1000000

[[model_limits]]
flavour = "bedrock"
rpm = 4000
tpm = 1000000

[[model_limits]]
flavour = "openai_api"
rpm = 4000
tpm = 1000000

[[model_limits]]
flavour = "gemini_api"
rpm = 4000
tpm = 1000000

[[tests]]
id = "normal"
name = "A normal day"
name_es = "Un día normal"

[[tests]]
id = "launch"
name = "Launch day: 4 times the traffic for 4 minutes"
name_es = "Día de lanzamiento: 4 veces el tráfico durante 4 minutos"
hidden = true
duration_s = 300
traffic = { spike = { at = 30, x = 4, for = 240 } }
pass = { error_rate = 0.05, availability = 0.95 }

[[tests]]
id = "overloaded"
name = "The model provider is overloaded for 20 s"
name_es = "El proveedor del modelo se satura durante 20 s"
hidden = true
duration_s = 90
chaos = [{ kill = { kind = "infer", same_flavour = true, at = 20, for = 20 } }]
pass = { error_rate = 0.02, availability = 0.98 }

[[tests]]
id = "rate-cut"
name = "The model provider cuts your limit for 40 s"
name_es = "El proveedor del modelo te recorta el límite durante 40 s"
hidden = true
duration_s = 90
chaos = [{ model_rate = { kind = "infer", same_flavour = true, at = 20, for = 40, tpm = 50000 } }]
pass = { error_rate = 0.02, availability = 0.98 }

[pass]
error_rate = 0.01
ttft_p95_ms = 2000
