id = "rtb"
number = 41
set = 3
difficulty = "hard"
title = "Real-Time Ad Auction"
title_es = "Subasta de anuncios en tiempo real"
teaches = "Close every auction on a deadline: a call timeout drops late bids instead of letting the slowest bidder set your latency"
teaches_es = "Cerrar cada subasta a tiempo: un timeout de llamada descarta las pujas tardías en vez de dejar que el pujador más lento marque tu latencia"
tags = ["timeouts", "tail-latency", "external-providers", "deadlines"]

challenge_ratio = 0.75
[nfr]
peak_rps = 20000
p95_ms = 100
availability = 0.999
budget_usd = 1200

[[externals]]
name = "bidders"
median_ms = 30
p99_ms = 90

[[request_types]]
