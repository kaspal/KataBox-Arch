share = 1.0
route = ["edge?", "compute", "cache", "external:bidders?"]
key_space = 5000000
key_skew = { zipf = 0.7 }

[[tests]]
id = "normal"
name = "A normal hour"
name_es = "Una hora normal"

[[tests]]
id = "slow-bidder"
name = "A big bidder slows down"
name_es = "Un pujador grande se vuelve lento"
hidden = true
chaos = [{ external = { name = "bidders", at = 20, for = 30, add_ms = 80 } }]

[[tests]]
id = "prime-time"
name = "Prime time"
name_es = "Horario de máxima audiencia"
hidden = true
traffic = { spike = { at = 15, x = 2, for = 30 } }

[pass]
error_rate = 0.001
