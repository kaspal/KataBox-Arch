id = "ai-global-serving"
number = 16
set = 1
track = "ai"
difficulty = "hard"
title = "An Assistant for the US and the EU"
title_es = "Un asistente para EE. UU. y la UE"
teaches = "Keep EU conversations in EU Regions, both the stored history and the GPUs that answer them, with two EU Regions that can each carry the whole peak when the other fails"
teaches_es = "Mantener las conversaciones de la UE en regiones de la UE, tanto el historial guardado como las GPU que las responden, con dos regiones de la UE que pueden llevar cada una el pico entero cuando la otra falla"
tags = ["llm", "gpu", "regions", "data-residency", "failover"]
requires = ["infer"]

[nfr]
peak_rps = 30
p95_ms = 15000
availability = 0.99
budget_usd = 12000

[[request_types]]
id = "chat-us"
name = "A US user sends a message"
name_es = "Un usuario de EE. UU. envía un mensaje"
share = 0.6
route = ["edge?", "compute", "datastore:write", "model:chat", "datastore:write"]
key_space = 200000
tokens_in = { mean = 800, p95 = 2000 }
tokens_out = { mean = 250, p95 = 600 }

[[request_types]]
id = "chat-eu"
name = "An EU user sends a message"
name_es = "Un usuario de la UE envía un mensaje"
share = 0.4
route = ["edge?", "compute", "datastore:write", "model:chat", "datastore:write"]
key_space = 200000
tokens_in = { mean = 800, p95 = 2000 }
tokens_out = { mean = 250, p95 = 600 }
residency = "eu"

[[tests]]
id = "normal"
name = "A normal day"
name_es = "Un día normal"

[[tests]]
id = "eu-dark"
name = "The Region with the history database goes dark"
name_es = "Se apaga la región de la base de datos del historial"
hidden = true
duration_s = 300
chaos = [{ partition = { zone = "@primary", at = 30 } }]
pass = { error_rate = 0.08, availability = 0.92 }

[[tests]]
id = "eu-audit"
name = "An EU-only audit day: the database primary fails, then the Region it moved to"
name_es = "Un día de auditoría solo con la UE: falla el primario de la base de datos y después la región a la que pasó"
hidden = true
duration_s = 450
type_multipliers = { chat-us = 0, chat-eu = 2.5 }
chaos = [
  { kill = { kind = "sql", role = "primary", at = 30, for = 40 } },
  { partition = { zone = "@primary", at = 100, for = 60 } },
]
pass = { error_rate = 0.08, availability = 0.92 }

[pass]
error_rate = 0.01
ttft_p95_ms = 1000
residency_violations = 0
