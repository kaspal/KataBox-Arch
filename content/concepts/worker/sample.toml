[[step]]
snapshot = "nine-judges.kbarch"
title = "Judging takes two seconds"
title_es = "Juzgar lleva dos segundos"
caption = "The API accepts a submission in milliseconds and queues it. Each worker slot judges one submission at a time, for about two seconds. Nine worker instances with eight slots each can't keep up with the arrivals, so the line grows."
caption_es = "La API acepta un envío en milisegundos y lo pone en cola. Cada plaza de worker juzga un envío a la vez, durante unos dos segundos. Nueve instancias de worker con ocho plazas cada una no dan abasto con lo que llega, así que la fila crece."
focus = ["queue", "judges"]
run = { test = "normal" }
callout = { metric = "p95_ms", after = 22770, target = 20000 }

