title = "A few more workers"
title_es = "Unos pocos workers más"
caption = "Twelve instances have slots to spare, so the line stays short. Workers are the knob for slow, background work: add them until the queue stops growing."
caption_es = "Doce instancias tienen plazas de sobra, así que la fila se mantiene corta. Los workers son el mando del trabajo lento en segundo plano: añádelos hasta que la cola deje de crecer."
