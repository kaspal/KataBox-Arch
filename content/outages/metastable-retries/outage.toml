id = "metastable-retries"
number = 9
difficulty = "medium"
title = "The spike that never ended"
title_es = "El pico que nunca terminó"
summary = "Traffic tripled for ten seconds, and retries between services kept the system down long after it fell back."
summary_es = "El tráfico se triplicó durante diez segundos, y los reintentos entre servicios mantuvieron caído el sistema mucho después de que bajara."
story = "A profile page ran on six Go App Servers that called a Profile microservice through a Linkerd service mesh, then read PostgreSQL. The Profile service could answer about 1,000 calls a second and normally saw 550: about half busy. The mesh gave each call 200 ms and retried a failed one three times at once; the clients gave each page 1 s and retried twice at once. A push notification went to every user, and for ten seconds traffic tripled. The Profile queue grew past 200 ms of waiting, so calls timed out while the service was still working on them, and every timed-out call came back three more times. When traffic fell back to normal at 25 s, the service was still doing several times the work, mostly for callers that had already given up. It stayed saturated, with about a third of page loads failing, until the end."
story_es = "Una página de perfil funcionaba con seis App Servers de Go que llamaban a un microservicio Profile a través de una malla de servicios Linkerd y después leían PostgreSQL. El servicio Profile podía responder unas 1.000 llamadas por segundo y normalmente recibía 550: ocupado la mitad del tiempo. La malla daba a cada llamada 200 ms y reintentaba una llamada fallida tres veces, de inmediato; los clientes daban a cada página 1 s y reintentaban dos veces, de inmediato. Se envió una notificación push a todos los usuarios y durante diez segundos el tráfico se triplicó. La cola de Profile superó los 200 ms de espera, así que las llamadas expiraban mientras el servicio seguía trabajando en ellas, y cada llamada expirada volvía tres veces más. Cuando el tráfico volvió a la normalidad a los 25 s, el servicio seguía haciendo varias veces el trabajo, casi todo para llamadores que ya se habían rendido. Siguió saturado, con cerca de un tercio de las cargas de página fallando, hasta el final."
lesson = "A system can have two stable states at the same load: healthy, or saturated by its own retries (a metastable failure). The spike only pushes it from one to the other; the retries keep it there. A long queue makes it worse: work that waits longer than the caller's timeout is done for nobody, and the retry adds it again. Bound the queue so nothing waits past the timeout: with load shedding (here 8 waiting calls), the excess is turned away at once and costs nothing, every call the service accepts is answered in time, and when the spike ends the system is healthy again. A circuit breaker or a retry budget limits the retries in the same spirit."
lesson_es = "Un sistema puede tener dos estados estables con la misma carga: sano, o saturado por sus propios reintentos (un fallo metaestable). El pico solo lo empuja de uno a otro; los reintentos lo mantienen ahí. Una cola larga lo empeora: el trabajo que espera más que el timeout del llamador no le sirve a nadie, y el reintento lo vuelve a añadir. Limita la cola para que nada espere más que el timeout: con descarte de carga (aquí, 8 llamadas en espera), el exceso se rechaza al instante sin coste, cada llamada que el servicio acepta se responde a tiempo, y cuando el pico termina el sistema vuelve a estar sano. Un circuit breaker o un presupuesto de reintentos limitan los reintentos con la misma idea."
target_test = "incident"
kinds = ["app", "client"]
real_world = [
    "https://pure.psu.edu/en/publications/metastable-failures-in-distributed-systems/",
    "https://slack.engineering/slacks-incident-on-2-22-22/",
]

[[step]]
snapshot = "as_it_was.kbarch"
title = "As it was"
title_es = "Como era"
caption = "Six App Servers call the Profile service through a Linkerd mesh (200 ms timeout, 3 retries), then read PostgreSQL. On a normal day Profile is about half busy and pages load well under the 250 ms target."
caption_es = "Seis App Servers llaman al servicio Profile a través de una malla Linkerd (timeout de 200 ms, 3 reintentos) y después leen PostgreSQL. En un día normal Profile está ocupado la mitad del tiempo y las páginas cargan muy por debajo del objetivo de 250 ms."
focus = ["app", "profile"]
run = { test = "normal", start_s = 5 }
callout = { metric = "p95_ms", after = 106, target = 250 }

[[step]]
snapshot = "as_it_was.kbarch"
title = "Ten seconds of triple traffic"
title_es = "Diez segundos de tráfico triple"
caption = "At 15 s traffic triples. The Profile queue grows past 200 ms, calls time out while still being worked on, and each one comes back three more times. At 25 s traffic is normal again, but Profile stays saturated by retries: the errors never stop."
caption_es = "A los 15 s el tráfico se triplica. La cola de Profile pasa de 200 ms, las llamadas expiran mientras todavía se están procesando, y cada una vuelve tres veces más. A los 25 s el tráfico vuelve a ser normal, pero los reintentos mantienen saturado a Profile: los errores no paran."
focus = ["app", "profile"]
run = { test = "incident", start_s = 12 }
callout = { metric = "error_rate", after = 0.372 }

[[step]]
snapshot = "fixed.kbarch"
title = "Shed the excess"
title_es = "Descarta el exceso"
caption = "The same spike with load shedding on Profile: past 8 waiting calls, new ones are turned away at once. The excess fails fast during the spike, no call waits past its timeout, and at 25 s everything recovers."
caption_es = "El mismo pico con descarte de carga en Profile: con más de 8 llamadas en espera, las nuevas se rechazan al instante. El exceso falla rápido durante el pico, ninguna llamada espera más que su timeout, y a los 25 s todo se recupera."
focus = ["app", "profile"]
run = { test = "incident", start_s = 12 }
callout = { metric = "error_rate", before = 0.372, after = 0.0846 }

[scenario.nfr]
peak_rps = 550
p95_ms = 250
availability = 0.999
budget_usd = 3000

[[scenario.request_types]]
id = "read"
name = "Load a profile page"
name_es = "Cargar una página de perfil"
share = 1.0
route = ["edge?", "compute", "service", "datastore"]
key_space = 1000000

[[scenario.tests]]
id = "incident"
name = "Traffic triples for 10 s"
name_es = "El tráfico se triplica durante 10 s"
duration_s = 150
traffic = { spike = { at = 15, x = 3, for = 10 } }
pass = { recovered_by_s = 40, p95_ms = 2000, error_rate = 0.1, availability = 0.9 }

[[scenario.tests]]
id = "normal"
name = "A normal day"
name_es = "Un día normal"

[[scenario.tests]]
id = "aftershock"
name = "A smaller spike at a busier hour"
name_es = "Un pico menor en una hora con más tráfico"
duration_s = 150
traffic = { steps = [[0, 1.3], [15, 2.6], [25, 1.3]] }
pass = { recovered_by_s = 40, p95_ms = 2000, error_rate = 0.1, availability = 0.9 }

[scenario.pass]
error_rate = 0.01
