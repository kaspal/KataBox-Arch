# Estimation drills for Bulk Email Campaigns.

[[drill]]
id = "sender-slots"
kind = "capacity"
prompt = "A campaign sends {emails_per_s} emails a second, and the email provider takes {provider_ms} ms per call at the median. A sender holds its slot for the whole call. How many calls are in flight at once?"
prompt_es = "Una campaña envía {emails_per_s} correos por segundo, y el proveedor de correo tarda {provider_ms} ms por llamada en la mediana. Un sender mantiene ocupado su hueco durante toda la llamada. ¿Cuántas llamadas hay en curso a la vez?"
inputs = { emails_per_s = 500, provider_ms = 150 }
formula = "emails_per_s * provider_ms / 1000"
unit = "count"
solution = "Calls in flight = arrival rate × time per call. {emails_per_s} a second × 0.15 s = {answer} calls at once. That is only the median; the slow tail reaches 1.2 s, so plan a few times as many slots. 4 Celery instances at a concurrency of 64 give 256."
solution_es = "Llamadas en curso = ritmo de llegada × tiempo por llamada. {emails_per_s} por segundo × 0,15 s = {answer} llamadas a la vez. Eso es solo la mediana; la cola lenta llega a 1,2 s, así que planifica varias veces más huecos. 4 instancias Celery con concurrencia 64 dan 256."

[[drill]]
id = "rate-cut-backlog"
kind = "capacity"
prompt = "A campaign sends {emails_per_s} emails a second. For {cut_s} seconds the provider accepts only {cut_limit} calls a second and refuses the rest. How many emails are still waiting to be sent by the end of the cut?"
prompt_es = "Una campaña envía {emails_per_s} correos por segundo. Durante {cut_s} segundos el proveedor solo acepta {cut_limit} llamadas por segundo y rechaza el resto. ¿Cuántos correos siguen esperando a enviarse al final del recorte?"
inputs = { emails_per_s = 500, cut_limit = 250, cut_s = 40 }
formula = "(emails_per_s - cut_limit) * cut_s"
unit = "count"
solution = "{emails_per_s} arrive and {cut_limit} get through, so {cut_limit} a second are left over. × {cut_s} s = {answer} emails waiting. None of them has to be lost: if the queue keeps retrying them for longer than the cut, they go out once the limit is back to 800, a little late."
solution_es = "Llegan {emails_per_s} y pasan {cut_limit}, así que sobran {cut_limit} por segundo. × {cut_s} s = {answer} correos esperando. No hace falta perder ninguno: si la cola los sigue reintentando durante más tiempo que el recorte, salen cuando el límite vuelve a 800, con un poco de retraso."

[[drill]]
id = "retry-window"
kind = "capacity"
prompt = "A queue retries a failed send after waits of 1, 2, 4, 8, 16 and 32 seconds, then waits 32 seconds before each further retry. With {max_retries} retries, how many seconds of waiting does an email get before it is given up on?"
prompt_es = "Una cola reintenta un envío fallido tras esperas de 1, 2, 4, 8, 16 y 32 segundos, y después espera 32 segundos antes de cada reintento siguiente. Con {max_retries} reintentos, ¿cuántos segundos de espera recibe un correo antes de darlo por perdido?"
inputs = { max_retries = 10 }
formula = "1 + 2 + 4 + 8 + 16 + 32 + (max_retries - 6) * 32"
unit = "s"
solution = "The first six waits add up to 63 s, and retries 7 to 10 add 32 s each: {answer} seconds, more than three minutes, far longer than a 40-second rate cut. The default 3 retries wait only 1 + 2 + 4 = 7 s, so a refused email can run out of tries while the limit is still low."
solution_es = "Las seis primeras esperas suman 63 s, y los reintentos del 7 al 10 añaden 32 s cada uno: {answer} segundos, más de tres minutos, mucho más que un recorte de 40 segundos. Los 3 reintentos por defecto solo esperan 1 + 2 + 4 = 7 s, así que un correo rechazado puede quedarse sin intentos con el límite todavía bajo."
