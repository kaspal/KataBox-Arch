# Estimation drills for Clickstream into a Lakehouse.

[[drill]]
id = "files-per-refresh"
kind = "capacity"
prompt = "A chart refresh reads the last day of a lake table partitioned by day, about {day_gb} GB. Without compaction, the table holds the stream processor's files of about {file_mb} MB. How many files does one refresh open?"
prompt_es = "El refresco de un gráfico lee el último día de una tabla del lago particionada por día, unos {day_gb} GB. Sin compactación, la tabla guarda los archivos del procesador de streams, de unos {file_mb} MB. ¿Cuántos archivos abre un refresco?"
inputs = { day_gb = 2, file_mb = 2 }
formula = "day_gb * 1024 / file_mb"
unit = "count"
solution = "{day_gb} GB × 1024 / {file_mb} MB = {answer} files. Compacted into 256 MB files, the same day is just 8 files. The data is the same; only the number of files to open changes."
solution_es = "{day_gb} GB × 1024 / {file_mb} MB = {answer} archivos. Compactado en archivos de 256 MB, el mismo día son solo 8 archivos. Los datos son los mismos; solo cambia cuántos archivos hay que abrir."

[[drill]]
id = "file-open-time"
kind = "capacity"
prompt = "A query opens {files} files. Opening one takes {open_ms} ms, and the warehouse opens {readers} at a time. How many seconds does the query spend just opening files?"
prompt_es = "Una consulta abre {files} archivos. Abrir uno tarda {open_ms} ms, y el almacén abre {readers} a la vez. ¿Cuántos segundos pasa la consulta solo abriendo archivos?"
inputs = { files = 1024, open_ms = 20, readers = 8 }
formula = "files * open_ms / readers / 1000"
unit = "s"
solution = "{files} × {open_ms} ms / {readers} = {answer} s. Reading the 2 GB itself at 2 Gbps takes 1 s, so the small files cost more than the data. With 8 compacted files, opening them takes 20 ms."
solution_es = "{files} × {open_ms} ms / {readers} = {answer} s. Leer los 2 GB a 2 Gbps tarda 1 s, así que los archivos pequeños cuestan más que los datos. Con 8 archivos compactados, abrirlos tarda 20 ms."

[[drill]]
id = "launch-slots"
kind = "servers"
prompt = "On a launch day, {refreshes} chart refreshes arrive each second, and each one holds a warehouse slot for {scan_s} s while it scans small files. How many slots are busy at once?"
prompt_es = "En un día de lanzamiento llegan {refreshes} refrescos de gráficos por segundo, y cada uno ocupa un hueco del almacén durante {scan_s} s mientras escanea archivos pequeños. ¿Cuántos huecos están ocupados a la vez?"
inputs = { refreshes = 100, scan_s = 3.86 }
formula = "refreshes * scan_s"
unit = "count"
solution = "{refreshes} × {scan_s} s = {answer} slots, against 160 in a warehouse of 5 instances with a concurrency of 32: the queue grows and refreshes time out. Compacted, a scan takes 1.32 s, and the same day needs about 132 slots."
solution_es = "{refreshes} × {scan_s} s = {answer} huecos, frente a 160 en un almacén de 5 instancias con una concurrencia de 32: la cola crece y los refrescos agotan su tiempo. Compactado, un escaneo tarda 1,32 s, y el mismo día pide unos 132 huecos."
