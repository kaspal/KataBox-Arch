# Estimation drills for Password Reset.

[[drill]]
id = "mailer-slots"
kind = "capacity"
prompt = "Your service gets {peak_rps} requests a second at peak, and {reset_pct}% of them ask for a reset link. Each one ends in a call to the email provider, which takes {provider_ms} ms at the median. A Mailer holds its slot for the whole call. How many calls are in flight at once?"
prompt_es = "Tu servicio recibe {peak_rps} peticiones por segundo en el pico, y el {reset_pct} % pide un enlace de restablecimiento. Cada una acaba en una llamada al proveedor de correo, que tarda {provider_ms} ms en la mediana. Un Mailer mantiene ocupado su hueco durante toda la llamada. ¿Cuántas llamadas hay en curso a la vez?"
inputs = { peak_rps = 400, reset_pct = 70, provider_ms = 150 }
formula = "peak_rps * reset_pct / 100 * provider_ms / 1000"
unit = "count"
solution = "Reset requests: {peak_rps} × {reset_pct}% = 280 a second. Calls in flight = 280 × 0.15 s = {answer}. That is only the median; the slow tail reaches 0.8 s, so plan a few times as many slots. 4 Celery Mailer instances at a concurrency of 32 give 128."
solution_es = "Peticiones de restablecimiento: {peak_rps} × {reset_pct} % = 280 por segundo. Llamadas en curso = 280 × 0,15 s = {answer}. Eso es solo la mediana; la cola lenta llega a 0,8 s, así que planifica varias veces más huecos. 4 instancias Celery de Mailer con concurrencia 32 dan 128."

[[drill]]
id = "outage-backlog"
kind = "capacity"
prompt = "{reset_rps} reset emails a second need to go out, and the email provider is down for {outage_s} seconds. How many emails must be kept somewhere until it is back?"
prompt_es = "Hay que enviar {reset_rps} correos de restablecimiento por segundo, y el proveedor de correo está caído durante {outage_s} segundos. ¿Cuántos correos hay que guardar en algún sitio hasta que vuelva?"
inputs = { reset_rps = 280, outage_s = 30 }
formula = "reset_rps * outage_s"
unit = "count"
solution = "{reset_rps} a second × {outage_s} s = {answer} emails. An App Server that sends inline has nowhere to keep them. A queue that retries for longer than the outage (10 retries wait 191 s in all) keeps every one, and they go out once the provider is back, a little late."
solution_es = "{reset_rps} por segundo × {outage_s} s = {answer} correos. Un App Server que envía en línea no tiene dónde guardarlos. Una cola que reintenta durante más tiempo que la caída (10 reintentos esperan 191 s en total) los guarda todos, y salen cuando el proveedor vuelve, con un poco de retraso."

[[drill]]
id = "hot-token-redeems"
kind = "qps"
prompt = "{redeem_rps} redeems a second arrive, and mail scanners multiply them by {scanner_factor}. {hot_pct}% of the redeems land on {hot_tokens} tokens being opened at once. How many redeems a second hit each of those tokens?"
prompt_es = "Llegan {redeem_rps} canjes por segundo, y los escáneres de correo los multiplican por {scanner_factor}. El {hot_pct} % de los canjes cae en {hot_tokens} tokens que se abren a la vez. ¿Cuántos canjes por segundo recibe cada uno de esos tokens?"
inputs = { redeem_rps = 120, scanner_factor = 4, hot_pct = 10, hot_tokens = 20 }
formula = "redeem_rps * scanner_factor * hot_pct / 100 / hot_tokens"
unit = "rps"
solution = "{redeem_rps} × {scanner_factor} = 480 redeems a second; {hot_pct}% of that is 48 a second, spread over {hot_tokens} tokens: {answer} a second each. Each redeem reads and then writes, so two of them often overlap on the same token. Without a check and set in one statement, both read \"unused\" and both succeed."
solution_es = "{redeem_rps} × {scanner_factor} = 480 canjes por segundo; el {hot_pct} % son 48 por segundo, repartidos entre {hot_tokens} tokens: {answer} por segundo cada uno. Cada canje lee y después escribe, así que dos de ellos se solapan a menudo en el mismo token. Sin comprobar y escribir en una sola sentencia, los dos leen «sin usar» y los dos salen bien."
