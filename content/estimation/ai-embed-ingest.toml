# Estimation drills for Embedding Ingest.

[[drill]]
id = "tokens-per-minute"
kind = "qps"
prompt = "Your customers add {docs_per_s} documents a second, and a document averages {tokens} tokens. How many tokens a minute do you send to the embeddings API?"
prompt_es = "Tus clientes añaden {docs_per_s} documentos por segundo, y un documento tiene de media {tokens} tokens. ¿Cuántos tokens por minuto envías a la API de embeddings?"
inputs = { docs_per_s = 5, tokens = 625 }
formula = "docs_per_s * tokens * 60"
unit = "count"
solution = "{docs_per_s} × {tokens} × 60 s = {answer} tokens a minute. Against an account limit of 600,000, a normal day uses about a third: plenty of headroom, until someone imports ten times as much."
solution_es = "{docs_per_s} × {tokens} × 60 s = {answer} tokens por minuto. Frente a un límite de cuenta de 600 000, un día normal usa más o menos un tercio: mucho margen, hasta que alguien importa diez veces más."

[[drill]]
id = "allowance-runs-out"
kind = "capacity"
prompt = "Your account allows {tpm} tokens a minute, refilled continuously, and starts the burst with a full minute's allowance. A bulk import sends {docs_per_s} documents a second of {tokens} tokens each, straight to the API. After how many seconds is the allowance gone?"
prompt_es = "Tu cuenta permite {tpm} tokens por minuto, que se rellenan sin parar, y empieza la ráfaga con lo permitido en un minuto completo. Una importación masiva envía {docs_per_s} documentos por segundo de {tokens} tokens cada uno, directamente a la API. ¿Tras cuántos segundos se acaba lo permitido?"
inputs = { tpm = 600000, docs_per_s = 50, tokens = 625 }
formula = "tpm / (docs_per_s * tokens - tpm / 60)"
unit = "s"
solution = "The import spends {docs_per_s} × {tokens} = 31,250 tokens a second while the allowance refills {tpm} / 60 = 10,000 a second, so it shrinks by 21,250 a second: {tpm} / 21,250 ≈ {answer} s. After that, about two documents in three are refused, and without a queue each refusal is a failed upload."
solution_es = "La importación gasta {docs_per_s} × {tokens} = 31 250 tokens por segundo mientras lo permitido se rellena a {tpm} / 60 = 10 000 por segundo, así que baja 21 250 por segundo: {tpm} / 21 250 ≈ {answer} s. A partir de ahí se rechazan unos dos de cada tres documentos, y sin cola cada rechazo es una subida fallida."

[[drill]]
id = "worker-slots"
kind = "servers"
prompt = "Your account allows {tpm} tokens a minute, and a document averages {tokens} tokens. Each document holds a Worker slot for {hold_ms} ms. How many slots does it take to embed documents at {burst_x} times the steady token limit, so a burst can spend the minute's allowance?"
prompt_es = "Tu cuenta permite {tpm} tokens por minuto, y un documento tiene de media {tokens} tokens. Cada documento ocupa una plaza de Worker durante {hold_ms} ms. ¿Cuántas plazas hacen falta para procesar documentos a {burst_x} veces el límite sostenido de tokens, de modo que una ráfaga pueda gastar lo permitido en el minuto?"
inputs = { tpm = 600000, tokens = 625, hold_ms = 740, burst_x = 2 }
formula = "burst_x * tpm / 60 / tokens * hold_ms / 1000"
unit = "count"
solution = "The steady limit is {tpm} / 60 / {tokens} = 16 documents a second; {burst_x} times that is 32 a second, and each holds a slot for {hold_ms} ms: 32 × 0.74 s ≈ {answer} slots. The reference uses 24. Many more would only collect rate-limit errors: the provider's limit, not your Workers, sets the pace."
solution_es = "El límite sostenido es {tpm} / 60 / {tokens} = 16 documentos por segundo; {burst_x} veces eso son 32 por segundo, y cada uno ocupa una plaza {hold_ms} ms: 32 × 0,74 s ≈ {answer} plazas. La referencia usa 24. Muchas más solo recogerían errores de límite: el ritmo lo marca el límite del proveedor, no tus Workers."
