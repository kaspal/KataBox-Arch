# Estimation drills for Code Autocomplete as You Type.

[[drill]]
id = "idle-completion"
kind = "capacity"
prompt = "Your code model on vLLM needs {ttft_ms} ms before it starts, reads the prompt at {prefill_tps} tokens a second, and writes one completion alone at {tokens_per_s} tokens a second. A long request sends {tokens_in} tokens of code and gets back {tokens_out} tokens. On an idle GPU, how many milliseconds does it take?"
prompt_es = "Tu modelo de código en vLLM necesita {ttft_ms} ms antes de empezar, lee el prompt a {prefill_tps} tokens por segundo y escribe una sugerencia sola a {tokens_per_s} tokens por segundo. Una petición larga envía {tokens_in} tokens de código y recibe {tokens_out} tokens. En una GPU ociosa, ¿cuántos milisegundos tarda?"
inputs = { ttft_ms = 15, prefill_tps = 50000, tokens_per_s = 500, tokens_in = 2000, tokens_out = 30 }
formula = "ttft_ms + tokens_in / prefill_tps * 1000 + tokens_out / tokens_per_s * 1000"
unit = "ms"
solution = "15 ms + {tokens_in} / {prefill_tps} s (40 ms) + {tokens_out} / {tokens_per_s} s (60 ms) = {answer} ms, out of a budget of 150 ms. With a full batch the writing runs at half speed, 120 ms instead of 60, and the request takes 175 ms: GPUs for this budget must stay well short of full."
solution_es = "15 ms + {tokens_in} / {prefill_tps} s (40 ms) + {tokens_out} / {tokens_per_s} s (60 ms) = {answer} ms, de un presupuesto de 150 ms. Con el lote lleno la escritura va a la mitad de velocidad, 120 ms en vez de 60, y la petición tarda 175 ms: las GPU para este presupuesto deben seguir lejos de llenarse."

[[drill]]
id = "in-flight"
kind = "capacity"
prompt = "In the busy hour your editors send {busy_rps} completion requests a second, and a completion holds a GPU slot for about {hold_ms} ms. Without a cache, about how many completions are in flight at once?"
prompt_es = "En la hora punta tus editores envían {busy_rps} peticiones de sugerencia por segundo, y una sugerencia ocupa un hueco de GPU unos {hold_ms} ms. Sin caché, ¿cuántas sugerencias hay en curso a la vez, más o menos?"
inputs = { busy_rps = 6000, hold_ms = 50 }
formula = "busy_rps * hold_ms / 1000"
unit = "count"
solution = "{busy_rps} a second × {hold_ms} ms = {answer} completions at once (Little's law), and more in practice, because a busier GPU writes each completion slower. Four GPUs of 64 slots hold 256: full, so requests queue and the budget is gone."
solution_es = "{busy_rps} por segundo × {hold_ms} ms = {answer} sugerencias a la vez (ley de Little), y más en la práctica, porque una GPU más ocupada escribe cada sugerencia más despacio. Cuatro GPU de 64 huecos admiten 256: llenas, así que las peticiones hacen cola y el presupuesto se acaba."

[[drill]]
id = "cache-entries"
kind = "storage"
prompt = "A cached completion takes about {value_kb} KB, and your Redis Cache has {memory_gb} GB of Memory. About how many million completions does it hold?"
prompt_es = "Una sugerencia en caché ocupa más o menos {value_kb} KB, y tu Caché Redis tiene {memory_gb} GB de Memoria. ¿Cuántos millones de sugerencias guarda, más o menos?"
inputs = { value_kb = 1, memory_gb = 4 }
formula = "memory_gb / value_kb"
unit = "count"
solution = "{memory_gb} GB / {value_kb} KB ≈ {answer} million completions, for $72 a month. There are about 15 million distinct prefixes an hour, but the popular ones are typed far more often, so these few million answer a large share of the requests, each one a request no GPU sees."
solution_es = "{memory_gb} GB / {value_kb} KB ≈ {answer} millones de sugerencias, por 72 $ al mes. Hay unos 15 millones de prefijos distintos por hora, pero los populares se escriben mucho más, así que estos pocos millones responden una buena parte de las peticiones, y cada una es una petición que ninguna GPU ve."
