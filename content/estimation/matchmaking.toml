# Estimation drills for Game Matchmaking.

[[drill]]
id = "matcher-slots"
kind = "capacity"
prompt = "{players_per_s} players a second ask for a match, and matching one player takes {match_ms} ms of a matcher slot. How many slots are busy at once, before the database write?"
prompt_es = "{players_per_s} jugadores por segundo piden partida, y emparejar a un jugador ocupa {match_ms} ms de un hueco de emparejador. ¿Cuántos huecos están ocupados a la vez, antes de la escritura en la base de datos?"
inputs = { players_per_s = 1000, match_ms = 200 }
formula = "players_per_s * match_ms / 1000"
unit = "count"
solution = "Slots in use = arrival rate × time per player. {players_per_s} a second × 0.2 s = {answer} slots. 4 Celery instances at a concurrency of 64 give 256, and with the write added they are about 99% busy: enough for a weekday evening in one Region, with nothing left for a spike."
solution_es = "Huecos en uso = ritmo de llegada × tiempo por jugador. {players_per_s} por segundo × 0,2 s = {answer} huecos. 4 instancias Celery con concurrencia 64 dan 256, y con la escritura incluida están ocupadas en torno al 99 %: basta para una tarde entre semana en una sola región, sin nada de sobra para un pico."

[[drill]]
id = "saturday-backlog"
kind = "capacity"
prompt = "On Saturday night {spike_rps} players a second arrive for {spike_s} seconds, and one Region's matchers take about {drain_rps} a second. How many players are waiting in the queue by the end of the spike?"
prompt_es = "El sábado por la noche llegan {spike_rps} jugadores por segundo durante {spike_s} segundos, y los emparejadores de una región toman unos {drain_rps} por segundo. ¿Cuántos jugadores esperan en la cola al final del pico?"
inputs = { spike_rps = 2000, drain_rps = 1000, spike_s = 30 }
formula = "(spike_rps - drain_rps) * spike_s"
unit = "count"
solution = "{spike_rps} arrive and {drain_rps} are matched, so {drain_rps} a second are left over. × {spike_s} s = {answer} players in the queue. The queue keeps them all, but the last of them wait many seconds, far over the 5 s limit. Two Regions split the spike into about 1,000 a second each, which their matchers can take."
solution_es = "Llegan {spike_rps} y se emparejan {drain_rps}, así que sobran {drain_rps} por segundo. × {spike_s} s = {answer} jugadores en la cola. La cola los guarda a todos, pero los últimos esperan muchos segundos, muy por encima del límite de 5 s. Dos regiones reparten el pico en unos 1000 por segundo cada una, que sus emparejadores pueden tomar."

[[drill]]
id = "failover-matchers"
kind = "servers"
prompt = "us-east goes dark and eu-west takes all {players_per_s} players a second. Matching one player takes {match_ms} ms, and a Celery instance has {concurrency} slots. How many instances does eu-west need at the bare minimum?"
prompt_es = "Se apaga us-east y eu-west toma los {players_per_s} jugadores por segundo. Emparejar a un jugador tarda {match_ms} ms, y una instancia Celery tiene {concurrency} huecos. ¿Cuántas instancias necesita eu-west como mínimo?"
inputs = { players_per_s = 1000, match_ms = 200, concurrency = 64 }
formula = "players_per_s * match_ms / 1000 / concurrency"
unit = "count"
solution = "{players_per_s} × 0.2 s = 200 slots, ÷ {concurrency} per instance = {answer} instances. Round up to 4, which is what each Region has: during the failover eu-west's matchers run at about 100% but keep up. On a normal evening, with half the players, the same 4 are about 50% busy."
solution_es = "{players_per_s} × 0,2 s = 200 huecos, ÷ {concurrency} por instancia = {answer} instancias. Redondea a 4, que es lo que tiene cada región: durante la conmutación los emparejadores de eu-west trabajan en torno al 100 % pero dan abasto. En una tarde normal, con la mitad de jugadores, esas mismas 4 están ocupadas en torno al 50 %."
