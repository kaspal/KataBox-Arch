# Estimation drills for Recommendations: Retrieve, Then Re-rank.

[[drill]]
id = "shard-throughput"
kind = "capacity"
prompt = "One shard of your vector index runs {slots} searches at a time, and a search takes about {search_ms} ms. About how many searches a second can that shard finish at most?"
prompt_es = "Un shard de tu índice vectorial ejecuta {slots} búsquedas a la vez, y una búsqueda tarda unos {search_ms} ms. ¿Cuántas búsquedas por segundo puede terminar ese shard como mucho?"
inputs = { slots = 16, search_ms = 15 }
formula = "slots * 1000 / search_ms"
unit = "rps"
solution = "{slots} slots × 1,000 ms ÷ {search_ms} ms ≈ {answer} searches a second, and fewer in practice, because slow searches hold their slot longer. A normal day of 600 requests a second keeps one shard well over half busy; a sale at three times that needs more shards."
solution_es = "{slots} huecos × 1000 ms ÷ {search_ms} ms ≈ {answer} búsquedas por segundo, y menos en la práctica, porque las búsquedas lentas ocupan su hueco más tiempo. Un día normal de 600 peticiones por segundo tiene un shard ocupado bastante más de la mitad del tiempo; una rebaja al triple necesita más shards."

[[drill]]
id = "hot-item-load"
kind = "qps"
prompt = "During a viral burst your site gets {burst_rps} recommendation requests a second, and one item gets {hot_share} of them. Without a cache, how many searches a second land on the one shard that holds that item?"
prompt_es = "Durante una ráfaga viral tu sitio recibe {burst_rps} peticiones de recomendaciones por segundo, y un artículo se lleva {hot_share} de ellas. Sin caché, ¿cuántas búsquedas por segundo caen en el único shard que tiene ese artículo?"
inputs = { burst_rps = 3600, hot_share = 0.61 }
formula = "burst_rps * hot_share"
unit = "rps"
solution = "{burst_rps} × {hot_share} ≈ {answer} searches a second, all on one shard, since one item's searches always go to the same shard. That is about twice what any shard can finish, and adding shards doesn't move this item. A cache does: everyone who opens the item gets the same list."
solution_es = "{burst_rps} × {hot_share} ≈ {answer} búsquedas por segundo, todas en un solo shard, porque las búsquedas de un artículo van siempre al mismo shard. Es cerca del doble de lo que puede terminar cualquier shard, y añadir shards no mueve este artículo. Una caché sí: todos los que abren el artículo reciben la misma lista."

[[drill]]
id = "cache-size"
kind = "storage"
prompt = "Each finished recommendation list is {list_kb} KB, and you want the cache to hold the lists of the {items} most viewed items. About how many GB of cache memory is that?"
prompt_es = "Cada lista de recomendaciones terminada ocupa {list_kb} KB, y quieres que la caché guarde las listas de los {items} artículos más vistos. ¿Cuántos GB de memoria de caché son, más o menos?"
inputs = { list_kb = 2, items = 2000000 }
formula = "list_kb * items / (1024 * 1024)"
unit = "GB"
solution = "{list_kb} KB × {items} ÷ 1,048,576 KB per GB ≈ {answer} GB. A 4 GB Redis Cache holds them. On a normal day most of those lists still expire before anyone asks again (popularity is a long tail); the cache earns its place when a few items get most of the views."
solution_es = "{list_kb} KB × {items} ÷ 1 048 576 KB por GB ≈ {answer} GB. Una Caché Redis de 4 GB las guarda. En un día normal la mayoría de esas listas caducan antes de que alguien vuelva a pedirlas (la popularidad es una cola larga); la caché se gana su sitio cuando unos pocos artículos se llevan la mayoría de las visitas."
