# Estimation drills for the Static Site + CDN.

[[drill]]
id = "peak-rps"
kind = "qps"
prompt = "The site gets {page_views_per_day} page views a day. Each page view loads {requests_per_page} files (the page, its images and scripts), and the busiest hour runs at {peak_factor}× the daily average. How many requests a second arrive at peak?"
prompt_es = "El sitio recibe {page_views_per_day} visitas de página al día. Cada visita carga {requests_per_page} archivos (la página, sus imágenes y scripts), y la hora de más tráfico va a {peak_factor} veces la media diaria. ¿Cuántas peticiones por segundo llegan en el pico?"
inputs = { page_views_per_day = 4_000_000, requests_per_page = 10, peak_factor = 3 }
formula = "page_views_per_day * requests_per_page / 86400 * peak_factor"
unit = "rps"
solution = "{page_views_per_day} × {requests_per_page} = 40 million requests a day. ÷ 86,400 s ≈ 463 a second on average, × {peak_factor} at peak gives about {answer} a second, close to this problem's 1,500."
solution_es = "{page_views_per_day} × {requests_per_page} = 40 millones de peticiones al día. ÷ 86 400 s ≈ 463 por segundo de media, × {peak_factor} en el pico da unas {answer} por segundo, cerca de las 1500 de este problema."

[[drill]]
id = "origin-bandwidth"
kind = "bandwidth"
prompt = "At peak, {peak_rps} requests a second reach the CDN, and it serves {hit_rate_pct}% of them from its cache. The average file is {avg_file_kb} KB. How much data a second must the origin send, in MB/s?"
prompt_es = "En el pico llegan a la CDN {peak_rps} peticiones por segundo, y sirve el {hit_rate_pct} % desde su caché. El archivo medio ocupa {avg_file_kb} KB. ¿Cuántos datos por segundo tiene que enviar el origen, en MB/s?"
inputs = { peak_rps = 1_500, hit_rate_pct = 95, avg_file_kb = 100 }
formula = "peak_rps * (100 - hit_rate_pct) / 100 * avg_file_kb / 1000"
unit = "MB/s"
solution = "Only the misses reach the origin: 5% of {peak_rps} = 75 requests a second. × {avg_file_kb} KB = 7,500 KB a second, about {answer} MB/s (60 Mbps). Without the CDN the origin would send twenty times as much."
solution_es = "Solo los fallos llegan al origen: el 5 % de {peak_rps} = 75 peticiones por segundo. × {avg_file_kb} KB = 7500 KB por segundo, unos {answer} MB/s (60 Mbps). Sin la CDN el origen enviaría veinte veces más."

[[drill]]
id = "cdn-egress-month"
kind = "storage"
prompt = "The site gets {page_views_per_day} page views a day, each loading {requests_per_page} files of {avg_file_kb} KB on average. How much data does the CDN deliver in a 30-day month, in TB?"
prompt_es = "El sitio recibe {page_views_per_day} visitas de página al día, y cada una carga {requests_per_page} archivos de {avg_file_kb} KB de media. ¿Cuántos datos entrega la CDN en un mes de 30 días, en TB?"
inputs = { page_views_per_day = 4_000_000, requests_per_page = 10, avg_file_kb = 100 }
formula = "page_views_per_day * requests_per_page * avg_file_kb * 1000 * 30 / 1e12"
unit = "TB"
solution = "{page_views_per_day} × {requests_per_page} = 40 million files a day. × {avg_file_kb} KB = 4 × 10^12 bytes, 4 TB a day. × 30 days gives about {answer} TB a month, which is what the CDN bills you for."
solution_es = "{page_views_per_day} × {requests_per_page} = 40 millones de archivos al día. × {avg_file_kb} KB = 4 × 10^12 bytes, 4 TB al día. × 30 días da unos {answer} TB al mes, que es lo que te cobra la CDN."
