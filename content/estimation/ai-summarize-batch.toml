# Estimation drills for Summarise a Document Backlog.

[[drill]]
id = "backlog-tokens"
kind = "capacity"
prompt = "A backlog holds {documents} documents. Each one sends about {tokens_in} tokens to the model and gets about {tokens_out} tokens back. About how many tokens does the whole backlog need?"
prompt_es = "Un atraso tiene {documents} documentos. Cada uno envía unos {tokens_in} tokens al modelo y recibe unos {tokens_out} tokens de vuelta. ¿Cuántos tokens necesita más o menos todo el atraso?"
inputs = { documents = 1350, tokens_in = 600, tokens_out = 100 }
formula = "documents * (tokens_in + tokens_out)"
unit = "count"
solution = "{documents} × ({tokens_in} + {tokens_out}) = {answer} tokens. Against a real-time limit of 400,000 tokens a minute, that is well over two minutes of the account's whole allowance. The token limit counts input and output together, so long documents use it up long before the request limit."
solution_es = "{documents} × ({tokens_in} + {tokens_out}) = {answer} tokens. Frente a un límite en tiempo real de 400 000 tokens por minuto, son bastante más de dos minutos de toda la asignación de la cuenta. El límite de tokens cuenta entrada y salida juntas, así que los documentos largos lo agotan mucho antes que el límite de peticiones."

[[drill]]
id = "realtime-drain"
kind = "capacity"
prompt = "The backlog needs {tokens} tokens, and the real-time API allows {tpm} tokens a minute. If every token had to wait for the limit, how many seconds would the backlog take?"
prompt_es = "El atraso necesita {tokens} tokens, y la API en tiempo real permite {tpm} tokens por minuto. Si cada token tuviera que esperar al límite, ¿cuántos segundos tardaría el atraso?"
inputs = { tokens = 945000, tpm = 400000 }
formula = "tokens / tpm * 60"
unit = "s"
solution = "{tokens} / {tpm} × 60 ≈ {answer} seconds. The first minute's allowance goes through at once, which saves 60 seconds, but the rest still takes about 80 seconds, against a deadline of 45. More Workers can't help; the batch API, with no per-minute limit, can."
solution_es = "{tokens} / {tpm} × 60 ≈ {answer} segundos. La asignación del primer minuto pasa de golpe, lo que ahorra 60 segundos, pero el resto sigue tardando unos 80 segundos, frente a un plazo de 45. Más Workers no ayudan; la API por lotes, sin límite por minuto, sí."

[[drill]]
id = "worker-slots"
kind = "servers"
prompt = "Documents arrive at {docs_per_s} a second. The provider slows down, and a model call now takes {call_s} seconds. A Worker slot is held for the whole call. How many slots must be busy at once to keep up?"
prompt_es = "Los documentos llegan a {docs_per_s} por segundo. El proveedor se vuelve lento, y una llamada al modelo tarda ahora {call_s} segundos. Un hueco de Worker queda ocupado durante toda la llamada. ¿Cuántos huecos tienen que estar ocupados a la vez para seguir el ritmo?"
inputs = { docs_per_s = 15, call_s = 5.2 }
formula = "docs_per_s * call_s"
unit = "count"
solution = "{docs_per_s} × {call_s} = {answer} calls in flight (Little's law). 2 Celery instances with a concurrency of 64 give 128 slots, so the slowdown fits. Once the batch API removes the per-minute limit, these slots are the only cap left."
solution_es = "{docs_per_s} × {call_s} = {answer} llamadas en curso (ley de Little). 2 instancias de Celery con una concurrencia de 64 dan 128 huecos, así que la lentitud cabe. Cuando la API por lotes quita el límite por minuto, estos huecos son el único tope que queda."
