[package]
name = "katabox-arch-desktop"
description = "KataBox Arch desktop app (Tauri shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors = ["Ehrlichmann Casas and KataBox contributors"]
# `tauri dev` / `cargo run` start the app, not the bindings exporter.
default-run = "katabox-arch-desktop"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "katabox_arch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
ka-app = { workspace = true, features = ["specta"] }
ka-core = { workspace = true, features = ["specta"] }
ka-sim = { workspace = true, features = ["specta"] }
ka-store = { workspace = true, features = ["specta"] }
serde.workspace = true
serde_json.workspace = true
# tauri-specta 2 is a release candidate: versions are pinned exactly (as in KataBox).
specta.workspace = true
specta-typescript = "=0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["typescript"] }
tauri-plugin-dialog = "2"
# Auto-update, prepared but off: only `--features updater` registers it. No keys exist.
tauri-plugin-updater = { version = "2", optional = true }

[features]
updater = ["dep:tauri-plugin-updater"]
# The bindings generator is a development tool: behind a feature so `tauri build` never
# compiles or bundles it next to the app.
bindings = []

[[bin]]
name = "export-bindings"
path = "src/bin/export-bindings.rs"
required-features = ["bindings"]

[lints]
workspace = true
